 ucm_cheat_menu.3080.opt_raise_levies: "@soldier_icon! Gesamten Heerbann aufbieten"
 ucm_cheat_menu.3080.opt_raise_levies_tt: "@soldier_icon! Biete sofort den gesamten Heerbann mit maximaler Stärke in deiner Hauptstadt oder aktueller Position auf."
