 ucm_cheat_menu_make_my_vassal_interaction: "Zu direktem Vasallen machen"
 ucm_cheat_menu_make_my_vassal_interaction_desc: "Das Ziel leistet Ihnen den Treueeid und wird Ihr direkter Vasall. Funktioniert bei jedem landbesitzenden KI- oder Spielercharakter. Ist die Person bereits Ihr Vasall, passiert nichts. Beide Seiten müssen Ländereien besitzen; der Haupttitel des Ziels darf nicht über Ihrem Rang liegen und es darf kein Oberherr über Ihnen sein. Spielregeln wie Regierungsform oder Bündnisse können die Aktion dennoch blockieren."
