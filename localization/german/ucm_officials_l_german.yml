 ucm_officials.9084.t: "Ein-Kind-Regel für Ihre Dynastie"
 ucm_officials.9084.desc: "#bold Ein-Kind-Regel#!: gilt für alle KI-Väter. Bewertet nach der Anzahl #bold lebender#! Kinder — hat der Vater bereits 1 lebendes Kind, wird das Neugeborene entfernt. Verstorbene Kinder zählen nicht; nach dem Tod des einzigen lebenden Kindes darf erneut ein Kind behalten werden. Nur KI-Kinder von KI-Vätern sind betroffen; menschliche Spieler-Väter sind ausgenommen. Optionale Dynastie-Schutzregel schließt die Spieler-Dynastie aus. Gegenseitig ausschließend mit der Regel „Dynastie-Männer: ein Kind“."
