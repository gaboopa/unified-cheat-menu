l_russian:
 ucm_clavius_grail_name:0 "Грааль Вечного Стража"
 ucm_clavius_grail_description:0 "Чаша, врученная трибуну Клавию Аквиле; её скромное происхождение скрыто под дарами бесчисленных поколений. Перед концом своей долгой вахты Клавий вложил её в руки преемника. Это обет оберегать живых с терпением того, кого смерть уже не может торопить."
 ucm_clavius_grail_modifier:0 "Последний наказ Клавия"
 ucm_clavius_grail_modifier_desc:0 "Чаша трибуна призывает своего хранителя к мудрости, преданности и справедливости по отношению ко всем подданным."
 ucm_clavius_handover_memory:0 "Последняя вахта Клавия"
 ucm_clavius_handover_memory_desc:0 "Я испил из Грааля Клавия Аквилы и принял его наказ Вечного Стража. Наконец долгая вахта трибуна завершилась."
 ucm_clavius_handover_memory_desc_second_perspective:0 "Ты испил из Грааля Клавия Аквилы и принял его наказ Вечного Стража. Наконец долгая вахта трибуна завершилась."
 ucm_clavius_handover_memory_desc_third_perspective:0 "Этот персонаж испил из Грааля Клавия Аквилы и принял его наказ Вечного Стража. Наконец долгая вахта трибуна завершилась."
