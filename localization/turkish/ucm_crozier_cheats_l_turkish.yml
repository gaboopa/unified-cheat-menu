 UCM_CROZIER_CHEATS_B_slots_ON:0 "AÇIK  ·  Bina yuvası +1 × güç"
 UCM_CROZIER_CHEATS_B_slots_TT:0 "Sahip olduğun her mülk, her güç kademesi için +1 ek bina yuvası kazanır.\nKapsam tüm diyar olarak ayarlıysa tüm vasalların da yuvaları alır.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_stress_OFF:0 "KAPALI  ·  Stres kazancı −%99"
 UCM_CROZIER_CHEATS_B_stress_ON:0 "AÇIK  ·  Stres kazancı −%99"
 UCM_CROZIER_CHEATS_B_stress_TT:0 "Normalde alacağın stresin yalnızca %1'ini alırsın. Gücün bu anahtar üzerinde etkisi yoktur.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_stress_zero:0 "Tüm stresi kaldır"
 UCM_CROZIER_CHEATS_B_stress_zero_TT:0 "Tüm stresini kaldırır."
