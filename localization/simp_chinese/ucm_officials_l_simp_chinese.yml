 trait_warlord_god_desc: "本模组#bold 统率向作战作弊特质#!。大幅提升[martial|e] 与#bold 勇武#!（$game_concept_prowess$），强化#bold 骑士#!! 上限与战场效力，#bold 全军#!! 杀伤、耐打与#bold 围城#!! 能力，提高#bold 恐怖#!! 基线、#bold 征召#!! 补员并降低#bold 军费#!! 负担；#bold 行军#!! 与地形等以可用人格修正近似表现。#bold 非遗传#!!、#bold 不进入#!! 统治者设计器、#bold 不进入#!! 随机池；#bold 无#!! 引擎内「#bold 永不可失去特质#!!」独立键。#bold 主菜单#!! 对#bold 右击##bold 选中的角色#!! 发放，或#bold  add_trait = warlord_god#!! 。#bold 可与#!!#bold 天人不死#!!#bold  分开#!!#bold  叠加#!!。图标为#bold 金盔双剑#!! 风格，对应[commander|e] 定位。"
