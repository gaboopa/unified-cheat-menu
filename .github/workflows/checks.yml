name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tool self-checks
        run: |
          python tools/ck3parse.py
          python tools/check_refs.py --self-check
          python tools/audit_baseline.py --self-check
          python tools/check_mod.py --self-check
      - name: Braces, localization, parity, ucm_ names, icons
        run: python tools/check_mod.py
