  zhuge_huangzu_add:0 "十字军护符"
  zhuge_huangzu_add_desc:0 "当上天轻声细语时，芭芭拉温柔地后退了一步。她的身形闪烁，如同黎明最后的烛光。她飘逸的袍子变得更轻，长发散开成柔软的银色发丝，脸上温和的表情绽放。当你的视野清晰时，站在你面前的不是那位 fierce 的女先知，而是一个温柔的身影——容光焕发，温柔，充满希望。\n“受选定的朝圣者，”受膏者芭芭拉低语道，“我跨越了许多时间之河。重担不再落在我身上。光明必须寄寓于另一人身上，一个生于尘世但渴望发光的人。”\n“耶和华是永恒之光。耶稣是未熄灭的火焰，”她轻声说。“我现在离去，超越你的时代，因为另一个寂静的夜晚在另一条时间之河中呼唤。”\n她微笑着，声音温暖而纯净，如同微风中的风铃轻轻回响。“火焰现在是你的了。我可以自由地回到永恒的河流，不再被束缚于见证每一份悲伤。温柔地守护光明，它也会守护你。”\n然后身影步入比阳光更柔和的灿烂之中，化为无影之光，化为没有告别的喜悦。在她曾经站立的地方，你感受到生命之血在你血管中的温暖，以及护符在你心口轻轻跳动。\n受膏者芭芭拉离去了。但她的光明继续存在——在你之内。"
  zhuge_jinyong_huangzu_tt:0 ""
  zhuge_huangzu_add_tooltip:0 "#P 你将获得：#!\n#Y $chuanguoyuxi_cn$#!\n$chuanguoyuxi_cn_description$"
  zhuge_huangzu_add_confirm:0 "天命所归"
  chuanguoyuxi_cn:0 "十字军护符"
  chuanguoyuxi_cn_description:0 "由古代犹地亚加利利海岸边的一位妇女锻造；为纪念她自身的解救，这件奇妙的封印以超越凡人认知的技艺制成。它被携带穿越许多土地，直到它来到神圣教会的仆人面前，他们从中 discern 出隐藏天意的圣物，赐予其庄严的祝福。此后，它不再被提及为 mere 纪念品，而是神圣权威的容器。\n\n编年史家记载，其表面蚀刻着神秘字符，其意义除了智者外皆已失落，它闪烁着 subtle 的光芒，仿佛上天本身在其中呼吸。因此，这封印成为#Y 上天之命#！可能 resting 于那些被选中守护祭司和国王的 rulers 身上的标志，在神圣权柄的阴影下将东西方 binding 在一起。"
  zhuge_huangzu:0 "皇室血统"
  zhuge_huangzu_desc:0 "此宗族被视为#Y 天选皇室#！，是上天之命的正当承载者。\n其血统号令天下，凌驾于东西方所有其他贵族血统之上。"

