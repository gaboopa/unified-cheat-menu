l_russian:
 ucm_cheat_menu.0010.t: "~ Близость ~ Весенняя ночь"
 ucm_cheat_menu.0010.desc: "Слуги разошлись. Вы и [ucm_cheat_menu_target.GetShortUIName] скрыты от мира за шелковыми занавесками. Дыхание [ucm_cheat_menu_target.GetHerHis] наполняет воздух, а свечи мягко мерцают. Войны и государственные дела могут подождать."
 ucm_cheat_menu.0010.desc_lover: "Рядом с возлюбленным [ucm_cheat_menu_target.GetShortUIName]. Каждое прикосновение хранит тепло прошлых встреч. Аромат благовоний смешивается с запахом кожи, словно сама ночь соединяет вас воедино."
 ucm_cheat_menu.0010.desc_spouse: "Ваш супруг [ucm_cheat_menu_target.GetShortUIName] плавно снимает одежду, в глазах горит привычная страсть. Сегодня вечером [ucm_cheat_menu_target.GetSheHe] напомнит вам, что связывает вас."
 ucm_cheat_menu.0010.desc_concubine: "Ваша наложница [ucm_cheat_menu_target.GetShortUIName] опускает взгляд и медленно снимает халат. Она отлично знает, как себя вести, и манит вас на диван тихими словами и лёгкими касаниями пальцев."
 ucm_cheat_menu.0010.desc_camp: "Снаружи палатки воет ветер, а внутри царит тепло и тонкий аромат. [ucm_cheat_menu_target.GetShortUIName] лежит на походной койке — постель ещё хранит тепло, а тело пылает жаром. Украденный час спокойствия на войне слаще любых победных криков."
 ucm_cheat_menu.0010.continue: "Предаться соблазну..."
 ucm_cheat_menu.0010.cancel: "Отступить назад"
 ucm_cheat_menu.0012.t: "Мгновения близости..."
 ucm_cheat_menu.0012.desc: "Ночь подошла к концу, но вы всё ещё лежите в одной постели. Щёки [ucm_cheat_menu_target.GetShortUIName] покраснели, а пальцы нежно лежат на вашем запястье. За занавесками стемнело, но тепло между вами не угасает."
 ucm_cheat_menu.0012.ok: "Помочь ей одеться"
