l_turkish:
 UCM_CROZIER_CHEATS_B_auto_ascension_OFF:0 "KAPALI  ·  Oynadığım her hükümdar: en iyi genler ve +5 beceri"
 UCM_CROZIER_CHEATS_B_auto_ascension_ON:0 "AÇIK  ·  Oynadığım her hükümdar: en iyi genler ve +5 beceri"
 UCM_CROZIER_CHEATS_B_auto_ascension_TT:0 "Oynadığın karakter Dahi, Herkül Gibi ve Güzel özelliklerini ve altı becerinin hepsine +5 alır. Her karakter bunu yalnızca bir kez alır; böylece oynamaya devam ettiğin her varis de bunu alır.\nAçtığında ve her otomatik mod kontrolünde yeniden denetlenir (varsayılan olarak aylık, aşağıdaki sıklık düğmelerine bak)."
 UCM_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "KAPALI  ·  Sonsuza dek 30 yaşında kal"
 UCM_CROZIER_CHEATS_B_auto_forever_young_ON:0 "AÇIK  ·  Sonsuza dek 30 yaşında kal"
 UCM_CROZIER_CHEATS_B_auto_forever_young_TT:0 "30 yaşından büyük olduğunda yaşın tekrar 30'a ayarlanır.\nAçtığında ve her otomatik mod kontrolünde yeniden denetlenir (varsayılan olarak aylık, aşağıdaki sıklık düğmelerine bak)."
 UCM_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "KAPALI  ·  Asla 1.000 altının altına düşme"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "AÇIK  ·  Asla 1.000 altının altına düşme"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "1.000 altından azın olduğunda (borç dahil) altının tam olarak 1.000'e tamamlanır.\nAçtığında ve her otomatik mod kontrolünde yeniden denetlenir (varsayılan olarak aylık, aşağıdaki sıklık düğmelerine bak)."
 UCM_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "KAPALI  ·  Hapsedilemem"
 UCM_CROZIER_CHEATS_B_auto_no_prison_ON:0 "AÇIK  ·  Hapsedilemem"
 UCM_CROZIER_CHEATS_B_auto_no_prison_TT:0 "Hapsedildiğin anda serbest bırakılırsın.\nAyrıca açtığında ve her otomatik mod kontrolünde de denetlenir."
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "KAPALI  ·  Asla 1.000 prestij ve dindarlığın altına düşme"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "AÇIK  ·  Asla 1.000 prestij ve dindarlığın altına düşme"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "Prestijin veya dindarlığın 1.000'in altına düştüğünde tam olarak 1.000'e tamamlanır.\nAçtığında ve her otomatik mod kontrolünde yeniden denetlenir (varsayılan olarak aylık, aşağıdaki sıklık düğmelerine bak)."
 UCM_CROZIER_CHEATS_B_child_now:0 "Eşimden şimdi bir çocuğum olsun"
 UCM_CROZIER_CHEATS_B_child_now_TT:0 "Senin ve eşlerinden birinin yeni doğmuş çocuğu Dahi, Herkül Gibi ve Güzel özellikleriyle sarayında belirir. Bir eş gerektirir. Çocuk senin hanedanına katılır."
 UCM_CROZIER_CHEATS_B_combo_army:0 "Rüya ordu"
 UCM_CROZIER_CHEATS_B_combo_army_TT:0 "Sırasıyla: her silahlı adamlar alayı büyür (alay başına +1 / +2 / +5, Miktarlar ayarı) ve tam güce doldurulur; eyaletlerindeki toplama askerler ve garnizonlar yenilenir; sarayına 5 güçlü şövalye katılır (Yiğitlik 40, Askeri 18); sen, şövalyelerin ve ordu komutanların Lojistikçi, Askeri Mühendis, Organizatör ve Saldırgan Hücumcu özelliklerini alırsınız."
 UCM_CROZIER_CHEATS_B_combo_emergency:0 "Acil kurtarma"
 UCM_CROZIER_CHEATS_B_combo_emergency_TT:0 "Sırasıyla: hastalıkların ve yaraların iyileştirilir; hapisten kurtarılırsın; ana savunan olduğun her savaşı kazanırsın; borcun ödenir; seni hedef alan her komplo iptal edilir; rehine tutulan akrabaların eve getirilir."
 UCM_CROZIER_CHEATS_B_combo_family:0 "Kusursuz aile"
 UCM_CROZIER_CHEATS_B_combo_family_TT:0 "Sırasıyla: sen, eşlerin ve çocukların tüm hastalıklardan, yaralardan ve kusurlardan arındırılırsınız; varisin Dahi, Herkül Gibi, Güzel özelliklerini ve tüm becerilere +10 alır; eğitim özelliği olan yaşayan her çocuğun bu özelliğin en iyi seviyesini alır."
 UCM_CROZIER_CHEATS_B_combo_golden_age:0 "Altın çağ"
 UCM_CROZIER_CHEATS_B_combo_golden_age_TT:0 "Sırasıyla: varsa borcun ödenir, altının ikiye katlanır, tüm diyarında yapılabilecek her bina inşa edilir, kontluk gelişmişliği artırılır (+1 / +5 / +20, Miktarlar ayarı, Kapsam ayarı) ve başkentinin gelişmişliği artırılır (+5 / +20 / +50, Miktarlar ayarı)."
 UCM_CROZIER_CHEATS_B_combo_rise:0 "Güce yükseliş"
 UCM_CROZIER_CHEATS_B_combo_rise_TT:0 "Sırasıyla: efendinden bağımsız olursun; en yüksek unvanın krallıktan düşükse senin için yeni bir krallık kurulur; kontluklarının üzerindeki sahipsiz tüm dükalık, krallık ve imparatorluk unvanları senin için oluşturulur."
 UCM_CROZIER_CHEATS_B_combo_throne:0 "Tahta giden yol (vasallar için)"
 UCM_CROZIER_CHEATS_B_combo_throne_TT:0 "Vasal olduğun durumlar için: efendinin sana karşı görüşü +100 olur ve seni belirlenmiş varisi yapar, diğer tüm vasalları 10 yıl boyunca sana oy vermeye zorlanır ve efendinin ana unvanı üzerinde ileri sürülmüş bir hak iddiası kazanırsın."
 UCM_CROZIER_CHEATS_B_cooldowns_reset:0 "Tüm bekleme sürelerini sıfırla"
 UCM_CROZIER_CHEATS_B_cooldowns_reset_TT:0 "501 karar ve 558 karakter etkileşimi üzerindeki bekleme sürelerini kaldırır; böylece henüz hazır değil olarak işaretlenen her şey yeniden kullanılabilir."
 UCM_CROZIER_CHEATS_B_disease_player_OFF:0 "KAPALI  ·  Hastalık bağışıklığı"
 UCM_CROZIER_CHEATS_B_disease_player_ON:0 "AÇIK  ·  Hastalık bağışıklığı"
 UCM_CROZIER_CHEATS_B_disease_player_TT:0 "Sana Hastalık Koruması özelliğini verir (+50 sağlık, sıradan salgın dışı hastalıklara yakalanmayı engeller) ve veba, çiçek hastalığı ve kanser dahil sahip olduğun her hastalığı iyileştirir. Hastalıklar her otomatik mod kontrolünde yeniden iyileştirilir.\nOlaylar yine de sana doğrudan hastalık verebilir.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_domain_OFF:0 "KAPALI  ·  Şahsi arazi sınırı +50 × güç"
 UCM_CROZIER_CHEATS_B_domain_ON:0 "AÇIK  ·  Şahsi arazi sınırı +50 × güç"
 UCM_CROZIER_CHEATS_B_domain_TT:0 "Her güç kademesi için cezasız olarak şahsen +50 kontluk daha tutmanı sağlar.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_enemy_commander:0 "Ordu komutanlarını kaldır"
 UCM_CROZIER_CHEATS_B_enemy_commander_TT:0 "Hedefin her ordusundan komutanı kaldırır. Yapay zekâ yenilerini atayabilir."
 UCM_CROZIER_CHEATS_B_enemy_deplete:0 "Toplanmış askerlerinin %25 / %50 / %90'ını yok et"
 UCM_CROZIER_CHEATS_B_enemy_deplete_TT:0 "Hedefin toplanmış orduları askerlerinin bir kısmını kalıcı olarak kaybeder.\nMiktar, Hileleri'nin üst kısmındaki Miktarlar ayarına bağlıdır: Düşük %25, Orta %50, Yüksek %90."
 UCM_CROZIER_CHEATS_B_enemy_supply:0 "Ordu erzaklarını boşalt"
 UCM_CROZIER_CHEATS_B_enemy_supply_TT:0 "Hedefin toplanmış her ordusu tüm erzakını kaybeder."
 UCM_CROZIER_CHEATS_B_forge_crown:0 "Hükümdarın Tacı'nı yarat"
 UCM_CROZIER_CHEATS_B_forge_crown_TT:0 "Envanterine yeni bir efsanevi taç ekler: +10 Diplomasi, ayda +5 prestij, +25 vasal görüşü ve +10 genel görüş. Asla yıpranmaz."
 UCM_CROZIER_CHEATS_B_freq_month:0 "Otomatik modlar: her ay kontrol et (varsayılan)"
 UCM_CROZIER_CHEATS_B_freq_month_TT:0 "Otomatik modlar ve anahtar bakımı her 30 günde bir çalışır. Varsayılan budur. Bir sonraki kontrolden sonra geçerli olur."
 UCM_CROZIER_CHEATS_B_freq_quarter:0 "Otomatik modlar: her çeyrekte kontrol et"
 UCM_CROZIER_CHEATS_B_freq_quarter_TT:0 "Otomatik modlar ve anahtar bakımı her 90 günde bir çalışır. Oyun performansını daha az etkiler. Bir sonraki kontrolden sonra geçerli olur."
 UCM_CROZIER_CHEATS_B_freq_week:0 "Otomatik modlar: her hafta kontrol et"
 UCM_CROZIER_CHEATS_B_freq_week_TT:0 "Otomatik modlar ve anahtar bakımı her 7 günde bir çalışır. Bir sonraki kontrolden sonra geçerli olur."
 UCM_CROZIER_CHEATS_B_gold:0 "Altın ekle: 1.000 / 10.000 / 100.000"
 UCM_CROZIER_CHEATS_B_gold_TT:0 "Hazinene altın ekler.\nMiktar, Hileleri'nin üst kısmındaki Miktarlar ayarına bağlıdır: Düşük 1.000, Orta 10.000, Yüksek 100.000."
 UCM_CROZIER_CHEATS_B_gold_double:0 "Altınımı ikiye katla"
 UCM_CROZIER_CHEATS_B_gold_double_TT:0 "Şu anda sahip olduğun kadar altın ekler. Borçluyken hiçbir şey yapmaz."
 UCM_CROZIER_CHEATS_B_good_traits_me:0 "Bana en iyi doğuştan özellikleri ver"
 UCM_CROZIER_CHEATS_B_good_traits_me_TT:0 "Dahi, Güzel, Herkül Gibi, Güçlü, Kurnaz, Doğurgan ve Saf Kanlı özelliklerini ekler."
 UCM_CROZIER_CHEATS_B_gp_complete:0 "Tüm büyük projelerimi bitir"
 UCM_CROZIER_CHEATS_B_gp_complete_TT:0 "Sahip olduğun her büyük proje, hiçbir katkı gerekmeden anında tamamlanır."
 UCM_CROZIER_CHEATS_B_grandeur_max:0 "Saray ihtişamını en üst düzeye çıkar"
 UCM_CROZIER_CHEATS_B_grandeur_max_TT:0 "Saray ihtişamını 100'e ayarlar. Yalnızca bir kraliyet sarayın varsa çalışır."
 UCM_CROZIER_CHEATS_B_health_OFF:0 "KAPALI  ·  Sağlık +50 × güç"
 UCM_CROZIER_CHEATS_B_health_ON:0 "AÇIK  ·  Sağlık +50 × güç"
 UCM_CROZIER_CHEATS_B_health_TT:0 "Her güç kademesi için +50 sağlık ekler. Normal sağlık tek hanelidir, bu yüzden ×1 bile kötü sağlıktan neredeyse hiç ölmeyeceğin anlamına gelir.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_immortal_player_OFF:0 "KAPALI  ·  Ölümsüz: yaşlılıktan ölüm yok"
 UCM_CROZIER_CHEATS_B_immortal_player_ON:0 "AÇIK  ·  Ölümsüz: yaşlılıktan ölüm yok"
 UCM_CROZIER_CHEATS_B_immortal_player_TT:0 "Sana oyunun Ölümsüz özelliğini verir: görünüşte yaşlanmayı bırakırsın ve yaşlılıktan ölemezsin. Yine de suikasta kurban gidebilir, idam edilebilir, savaşta ya da olaylar sonucu ölebilirsin. Ayrıca Solan Zihin, Bulanık Gözler, Tekleyen Kalp, Kırılgan Kemikler ve Düşkün yaşlılık rahatsızlıklarını iyileştirir; 25 yaşından büyüksen görünüşün 25 yaşında dondurulur (görünen yaşın yine de artmaya devam eder).\nBunu kapatmak özelliği tekrar kaldırır, ancak yalnızca bu anahtar eklediyse.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_income_OFF:0 "KAPALI  ·  Gelir +%400 × güç"
 UCM_CROZIER_CHEATS_B_income_ON:0 "AÇIK  ·  Gelir +%400 × güç"
 UCM_CROZIER_CHEATS_B_income_TT:0 "Tüm aylık gelirini her güç kademesi için +%400 artırır (×1 = normal gelirinin beş katı).\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_income_year:0 "Bir yıllık geliri şimdi al"
 UCM_CROZIER_CHEATS_B_income_year_TT:0 "Mevcut yıllık gelirine eşit miktarda altını anında ekler. Normal gelirin etkilenmez."
 UCM_CROZIER_CHEATS_B_influence_OFF:0 "KAPALI  ·  Ayda +5 nüfuz × güç"
 UCM_CROZIER_CHEATS_B_influence_ON:0 "AÇIK  ·  Ayda +5 nüfuz × güç"
 UCM_CROZIER_CHEATS_B_influence_TT:0 "Her güç kademesi için her ay +5 nüfuz kazanırsın. Nüfuz yalnızca idari yönetimler tarafından kullanılır.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_innovation_OFF:0 "KAPALI  ·  Yenilik hızı +%100 × güç"
 UCM_CROZIER_CHEATS_B_innovation_ON:0 "AÇIK  ·  Yenilik hızı +%100 × güç"
 UCM_CROZIER_CHEATS_B_innovation_TT:0 "Kültürün her güç kademesi için yenilikleri +%100 daha hızlı keşfeder. Yalnızca kültürünün lideriyken çalışır.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_instant_empire:0 "Anında imparatorluk"
 UCM_CROZIER_CHEATS_B_instant_empire_TT:0 "Sırasıyla: kontluklarının üzerindeki sahipsiz tüm dükalık, krallık ve imparatorluk unvanları senin için oluşturulur; hiç yoksa yeni bir imparatorluk unvanı alırsın; de jure topraklarındaki bağımsız hükümdarlar ve tüm komşu bağımsız hükümdarlar, rütbeleri senden düşükse sana biat eder; dükalıklarının ve daha yüksek unvanlarının tüm de jure kontluklarını alırsın (bunun açtığı diğer unvanlar da oluşturulur); tüm seviyeler en üst düzeye çıkar."
 UCM_CROZIER_CHEATS_B_legend_spread_OFF:0 "KAPALI  ·  Efsane yayılımı +%100 × güç"
 UCM_CROZIER_CHEATS_B_legend_spread_ON:0 "AÇIK  ·  Efsane yayılımı +%100 × güç"
 UCM_CROZIER_CHEATS_B_legend_spread_TT:0 "Sahip olduğun efsaneler her güç kademesi için +%100 daha hızlı yayılır.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_legit_gain_OFF:0 "KAPALI  ·  Ayda +1 meşruiyet, kazanç +%100 × güç"
 UCM_CROZIER_CHEATS_B_legit_gain_ON:0 "AÇIK  ·  Ayda +1 meşruiyet, kazanç +%100 × güç"
 UCM_CROZIER_CHEATS_B_legit_gain_TT:0 "Her güç kademesi için her ay +1 meşruiyet kazanırsın ve kazandığın tüm meşruiyet +%100 artar.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_legit_level:0 "Meşruiyet +1 seviye"
 UCM_CROZIER_CHEATS_B_legit_level_TT:0 "Meşruiyetini bir seviye yükseltir. Yalnızca karakterin meşruiyet kullanıyorsa çalışır (hükümdarlar kullanır; topraksız karakterlerin çoğu kullanmaz)."
 UCM_CROZIER_CHEATS_B_levels_max_all:0 "Tüm seviyeleri en üst düzeye çıkar"
 UCM_CROZIER_CHEATS_B_levels_max_all_TT:0 "Prestij seviyesi ve dindarlık seviyesi 5'e çıkar, karakterin meşruiyet kullanıyorsa meşruiyet +5 seviye artar ve kraliyet sarayın varsa saray ihtişamı 100'e çıkar."
 UCM_CROZIER_CHEATS_B_levy_OFF:0 "KAPALI  ·  Toplama asker sayısı +%100 × güç"
 UCM_CROZIER_CHEATS_B_levy_ON:0 "AÇIK  ·  Toplama asker sayısı +%100 × güç"
 UCM_CROZIER_CHEATS_B_levy_TT:0 "Tüm mülklerin her güç kademesi için +%100 daha fazla toplama asker sağlar.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_life_OFF:0 "KAPALI  ·  Yaşam beklentisi +10 yıl × güç (aile)"
 UCM_CROZIER_CHEATS_B_life_ON:0 "AÇIK  ·  Yaşam beklentisi +10 yıl × güç (aile)"
 UCM_CROZIER_CHEATS_B_life_TT:0 "Sen, eşlerin ve çocukların her güç kademesi için +10 yıl yaşam beklentisi kazanırsınız.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "KAPALI  ·  Yaşam tarzı deneyimi +%100 × güç"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "AÇIK  ·  Yaşam tarzı deneyimi +%100 × güç"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "Yaşam tarzı deneyimin her güç kademesi için +%100 daha hızlı artar; böylece yetenekleri daha erken açarsın.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_lifestyle_xp_all:0 "Yaşam tarzı deneyimi: her birine 500 / 2.000 / 10.000"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_all_TT:0 "Altı yaşam tarzının hepsine deneyim ekler (Diplomasi, Askeri, Yönetim, Entrika, Bilgi, Gezgin).\nMiktar, Hileleri'nin üst kısmındaki Miktarlar ayarına bağlıdır: Düşük 500, Orta 2.000, Yüksek 10.000 (yaşam tarzı başına)."
 UCM_CROZIER_CHEATS_B_long_reign_OFF:0 "KAPALI  ·  Uzun saltanat bonusu +%100 × güç"
 UCM_CROZIER_CHEATS_B_long_reign_ON:0 "AÇIK  ·  Uzun saltanat bonusu +%100 × güç"
 UCM_CROZIER_CHEATS_B_long_reign_TT:0 "Uzun süre hüküm sürdüğün için aldığın bonus, her güç kademesi için +%100 daha hızlı birikir.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_me_cure:0 "Kusurlarımı kaldır"
 UCM_CROZIER_CHEATS_B_me_cure_TT:0 "Doğuştan ve sonradan edinilmiş kusurları kaldırır: kör, tek gözlü, yüzü bozuk, sakat, kekeme, çarpık ayaklı, kambur, cüce, ensest ürünü, hırıltılı, kanamalı, sıska, pullu, albino, zayıf, ahmak, düşük zekâ, çirkinlik, zayıf fizik, kısır, depresif, deli, cinli, cüzamlı, hastalıklı, düşkün ve aciz."
 UCM_CROZIER_CHEATS_B_me_fit:0 "Normal kilo"
 UCM_CROZIER_CHEATS_B_me_fit_TT:0 "Kilonu normale ayarlar ve hedef kilon olarak orada tutar; şişman ya da zayıf olmanın cezalarını kaldırır."
 UCM_CROZIER_CHEATS_B_me_heal_all:0 "Hastalıklarımı ve yaralarımı iyileştir"
