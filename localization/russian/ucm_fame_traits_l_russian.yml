l_russian:
 trait_ucm_fame_warlord_eternal: "Вечный военачальник"
 trait_ucm_fame_warlord_eternal_desc: "Вершина командования: закалённые в боях солдаты, ужасающие рыцари и неустанный натиск. Скорость марша парит, местность перестаёт иметь значение, а осады рушатся перед неудержимым войском."
 trait_ucm_fame_wealth_sovereign_max: "Суверенное богатство"
 trait_ucm_fame_wealth_sovereign_max_desc: "Мастер денег и торговли: налоги растут, вассальные взносы растут, а казначейство, кажется, никогда не иссякает."
 trait_ucm_fame_ultimate_intrigue_master: "Многоликий провидец"
 trait_ucm_fame_ultimate_intrigue_master_desc: "Непревзойдённый ткач теней: враждебные схемы против вас увядают, в то время как ваши собственные заговоры остаются невидимыми и почти гарантированно преуспевают."
 trait_ucm_fame_nether_conspiracy_lord: "Повелитель преисподней (заговор)"
 trait_ucm_fame_nether_conspiracy_lord_desc: "Мастер завуалированной интриги: ваши враждебные схемы становятся всё более скрытными и вероятными, в то время как вражеские заговоры против вас медленны и непостоянны; страх поднимается, и придворные склоняются в вашу пользу."
 trait_ucm_fame_eternal_nether_lord: "Вечный повелитель преисподней"
 trait_ucm_fame_eternal_nether_lord_desc: "Воля, застывшая на эоны: стресс едва касается вас, страх нарастает и держится, интрига огромна, и враждебные схемы против вас с трудом добиваются успеха, в то время как вассалы и придворные изгибаются в трепете."
 trait_ucm_fame_great_builder_god: "Божественный строитель"
 trait_ucm_fame_great_builder_god_desc: "Первозданное мастерство в строительстве: владения и здания по всему миру растут с минимальными затратами времени и золота; управление, налоги, престиж, развитие, укрепления и сборы — всё это растёт."
