l_german:
 UCM_CROZIER_CHEATS_B_auto_ascension_OFF:0 "AUS  ·  Jeder Herrscher, den ich spiele: beste Gene und +5 Werte"
 UCM_CROZIER_CHEATS_B_auto_ascension_ON:0 "AN  ·  Jeder Herrscher, den ich spiele: beste Gene und +5 Werte"
 UCM_CROZIER_CHEATS_B_auto_ascension_TT:0 "Der Charakter, den du spielst, erhält Genie, Herkules und Wunderschön sowie +5 auf alle sechs Werte. Jeder Charakter erhält dies nur einmal, sodass auch jeder Erbe, mit dem du weiterspielst, es bekommt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 UCM_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "AUS  ·  Für immer 30 bleiben"
 UCM_CROZIER_CHEATS_B_auto_forever_young_ON:0 "AN  ·  Für immer 30 bleiben"
 UCM_CROZIER_CHEATS_B_auto_forever_young_TT:0 "Sobald du älter als 30 bist, wird dein Alter wieder auf 30 gesetzt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 UCM_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "AUS  ·  Nie unter 1.000 Gold"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "AN  ·  Nie unter 1.000 Gold"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "Sobald du weniger als 1.000 Gold hast (einschließlich Schulden), wird es wieder auf genau 1.000 aufgefüllt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 UCM_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "AUS  ·  Ich kann nicht eingekerkert werden"
 UCM_CROZIER_CHEATS_B_auto_no_prison_ON:0 "AN  ·  Ich kann nicht eingekerkert werden"
 UCM_CROZIER_CHEATS_B_auto_no_prison_TT:0 "Sobald du eingekerkert wirst, wirst du freigelassen.\nWird außerdem beim Einschalten und bei jeder Auto-Modus-Prüfung geprüft."
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "AUS  ·  Nie unter 1.000 Prestige und Frömmigkeit"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "AN  ·  Nie unter 1.000 Prestige und Frömmigkeit"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "Sobald dein Prestige oder deine Frömmigkeit unter 1.000 liegt, wird der Wert wieder auf genau 1.000 aufgefüllt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 UCM_CROZIER_CHEATS_B_combo_army:0 "Traumarmee"
 UCM_CROZIER_CHEATS_B_combo_army_TT:0 "Der Reihe nach: Jedes Kriegsvolk-Regiment wächst (+1 / +2 / +5 pro Regiment, Einstellung „Mengen“) und wird auf volle Stärke aufgefüllt; Aufgebote und Garnisonen in deinen Provinzen werden aufgefüllt; 5 starke Ritter treten deinem Hof bei (Kampfgeschick 40, Kriegsführung 18); du, deine Ritter und deine Armeebefehlshaber erhalten Logistiker, Pionier, Organisator und Aggressiver Angreifer."
 UCM_CROZIER_CHEATS_B_disease_player_OFF:0 "AUS  ·  Krankheitsimmunität"
 UCM_CROZIER_CHEATS_B_disease_player_ON:0 "AN  ·  Krankheitsimmunität"
 UCM_CROZIER_CHEATS_B_disease_player_TT:0 "Gibt dir die Eigenschaft Krankheitsschutz (+50 Gesundheit, verhindert die Ansteckung mit gewöhnlichen Krankheiten, die keine Seuchen sind) und heilt jede Krankheit, die du hast, einschließlich Pest, Blattern und Krebs. Krankheiten werden bei jeder Auto-Modus-Prüfung erneut geheilt.\nEreignisse können dir weiterhin direkt eine Krankheit geben.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_domain_OFF:0 "AUS  ·  Domänenschwelle +50 × Stärke"
 UCM_CROZIER_CHEATS_B_domain_ON:0 "AN  ·  Domänenschwelle +50 × Stärke"
 UCM_CROZIER_CHEATS_B_domain_TT:0 "Erlaubt dir, pro Stärkestufe +50 Grafschaften mehr ohne Malus selbst zu halten.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_enemy_commander:0 "Armeebefehlshaber entfernen"
 UCM_CROZIER_CHEATS_B_enemy_commander_TT:0 "Entfernt den Befehlshaber aus jeder Armee des Ziels. Die KI kann neue ernennen."
 UCM_CROZIER_CHEATS_B_enemy_deplete:0 "25 % / 50 % / 90 % der ausgehobenen Truppen vernichten"
 UCM_CROZIER_CHEATS_B_enemy_deplete_TT:0 "Die ausgehobenen Armeen des Ziels verlieren dauerhaft einen Teil ihrer Soldaten.\nDie Menge hängt von der Einstellung „Mengen“ oben in Cheats ab: Niedrig 25 %, Mittel 50 %, Hoch 90 %."
 UCM_CROZIER_CHEATS_B_enemy_supply:0 "Armeevorräte leeren"
 UCM_CROZIER_CHEATS_B_enemy_supply_TT:0 "Jede ausgehobene Armee des Ziels verliert ihren gesamten Nachschub."
 UCM_CROZIER_CHEATS_B_forge_crown:0 "Die Krone des Souveräns erschaffen"
 UCM_CROZIER_CHEATS_B_forge_crown_TT:0 "Fügt deinem Inventar eine neue legendäre Krone hinzu: +10 Diplomatie, +5 Prestige pro Monat, +25 Meinung der Vasallen und +10 allgemeine Meinung. Sie nutzt sich nie ab."
 UCM_CROZIER_CHEATS_B_freq_month:0 "Auto-Modi: jeden Monat prüfen (Standard)"
 UCM_CROZIER_CHEATS_B_freq_month_TT:0 "Auto-Modi und die Pflege der Schalter laufen alle 30 Tage. Dies ist die Standardeinstellung. Wirkt nach der nächsten Prüfung."
 UCM_CROZIER_CHEATS_B_freq_quarter:0 "Auto-Modi: jedes Quartal prüfen"
 UCM_CROZIER_CHEATS_B_freq_quarter_TT:0 "Auto-Modi und die Pflege der Schalter laufen alle 90 Tage. Schont die Spielleistung. Wirkt nach der nächsten Prüfung."
 UCM_CROZIER_CHEATS_B_freq_week:0 "Auto-Modi: jede Woche prüfen"
 UCM_CROZIER_CHEATS_B_freq_week_TT:0 "Auto-Modi und die Pflege der Schalter laufen alle 7 Tage. Wirkt nach der nächsten Prüfung."
 UCM_CROZIER_CHEATS_B_health_OFF:0 "AUS  ·  Gesundheit +50 × Stärke"
 UCM_CROZIER_CHEATS_B_health_ON:0 "AN  ·  Gesundheit +50 × Stärke"
 UCM_CROZIER_CHEATS_B_health_TT:0 "Fügt +50 Gesundheit pro Stärkestufe hinzu. Normale Gesundheit ist einstellig, sodass du schon bei ×1 praktisch nie an schlechter Gesundheit stirbst.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_immortal_player_OFF:0 "AUS  ·  Unsterblich: kein Tod durch Alter"
 UCM_CROZIER_CHEATS_B_immortal_player_ON:0 "AN  ·  Unsterblich: kein Tod durch Alter"
 UCM_CROZIER_CHEATS_B_immortal_player_TT:0 "Gibt dir die Spieleigenschaft Unsterblich: Du alterst optisch nicht mehr und kannst nicht an Altersschwäche sterben. Du kannst weiterhin ermordet, hingerichtet oder in der Schlacht bzw. durch Ereignisse getötet werden. Außerdem heilt sie die Altersleiden Welkender Verstand, Trübe Augen, Schwaches Herz, Brüchige Knochen und Gebrechlich, und bist du älter als 25, wird dein Aussehen auf 25 eingefroren (dein angezeigtes Alter zählt weiter).\nBeim Ausschalten wird die Eigenschaft wieder entfernt, aber nur, wenn dieser Schalter sie hinzugefügt hat.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_income_OFF:0 "AUS  ·  Einnahmen +400 % × Stärke"
 UCM_CROZIER_CHEATS_B_income_ON:0 "AN  ·  Einnahmen +400 % × Stärke"
 UCM_CROZIER_CHEATS_B_income_TT:0 "Erhöht all deine monatlichen Einnahmen um +400 % pro Stärkestufe (×1 = das Fünffache deiner normalen Einnahmen).\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_influence_OFF:0 "AUS  ·  Einfluss +5 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_influence_ON:0 "AN  ·  Einfluss +5 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_influence_TT:0 "Du erhältst jeden Monat +5 Einfluss pro Stärkestufe. Einfluss wird nur von Verwaltungsregierungen genutzt.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_innovation_OFF:0 "AUS  ·  Innovationstempo +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_innovation_ON:0 "AN  ·  Innovationstempo +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_innovation_TT:0 "Deine Kultur entdeckt Innovationen pro Stärkestufe +100 % schneller. Funktioniert nur, solange du das Kulturoberhaupt bist.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_legend_spread_OFF:0 "AUS  ·  Legendenverbreitung +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_legend_spread_ON:0 "AN  ·  Legendenverbreitung +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_legend_spread_TT:0 "Legenden, die dir gehören, verbreiten sich pro Stärkestufe +100 % schneller.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_legit_gain_OFF:0 "AUS  ·  Legitimität +1 pro Monat, Zuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_legit_gain_ON:0 "AN  ·  Legitimität +1 pro Monat, Zuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_legit_gain_TT:0 "Du erhältst jeden Monat +1 Legitimität, und sämtliche Legitimität, die du erhältst, steigt um +100 %, jeweils pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_levy_OFF:0 "AUS  ·  Aufgebotsgröße +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_levy_ON:0 "AN  ·  Aufgebotsgröße +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_levy_TT:0 "Alle deine Besitztümer stellen pro Stärkestufe +100 % mehr Aufgebote.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_life_OFF:0 "AUS  ·  Lebenserwartung +10 Jahre × Stärke (Familie)"
 UCM_CROZIER_CHEATS_B_life_ON:0 "AN  ·  Lebenserwartung +10 Jahre × Stärke (Familie)"
 UCM_CROZIER_CHEATS_B_life_TT:0 "Du, deine Ehepartner und deine Kinder erhalten pro Stärkestufe +10 Jahre Lebenserwartung.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "AUS  ·  Lebenswandelerfahrung +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "AN  ·  Lebenswandelerfahrung +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "Deine Lebenswandelerfahrung wächst pro Stärkestufe +100 % schneller, sodass du Vorzüge früher freischaltest.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_long_reign_OFF:0 "AUS  ·  Bonus für lange Herrschaft +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_long_reign_ON:0 "AN  ·  Bonus für lange Herrschaft +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_long_reign_TT:0 "Der Bonus für lange Herrschaft baut sich pro Stärkestufe +100 % schneller auf.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_merit_gain_OFF:0 "AUS  ·  Verdienstzuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_merit_gain_ON:0 "AN  ·  Verdienstzuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_merit_gain_TT:0 "Du erhältst Verdienst pro Stärkestufe +100 % schneller. Verdienst wird nur von Verwaltungsregierungen genutzt.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_monthly_gold_OFF:0 "AUS  ·  Gold +10 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_monthly_gold_ON:0 "AN  ·  Gold +10 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_monthly_gold_TT:0 "Fügt deinen monatlichen Einnahmen pauschal +10 Gold pro Stärkestufe hinzu (×1 = +10, ×100 = +1.000, ×1000 = +10.000).\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_piety_OFF:0 "AUS  ·  Frömmigkeit +100 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_piety_ON:0 "AN  ·  Frömmigkeit +100 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_piety_TT:0 "Du erhältst jeden Monat +100 Frömmigkeit pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_prestige_OFF:0 "AUS  ·  Prestige +100 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_prestige_ON:0 "AN  ·  Prestige +100 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_prestige_TT:0 "Du erhältst jeden Monat +100 Prestige pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_prestige_mult_OFF:0 "AUS  ·  Prestige- und Frömmigkeitszuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_prestige_mult_ON:0 "AN  ·  Prestige- und Frömmigkeitszuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_prestige_mult_TT:0 "Sämtliches Prestige und sämtliche Frömmigkeit, die du erhältst, steigen um +100 % pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_renown_OFF:0 "AUS  ·  Dynastie-Bekanntheit +5 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_renown_ON:0 "AN  ·  Dynastie-Bekanntheit +5 pro Monat × Stärke"
 UCM_CROZIER_CHEATS_B_renown_TT:0 "Deine Dynastie erhält jeden Monat +5 Bekanntheit pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_renown_mult_OFF:0 "AUS  ·  Bekanntheitszuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_renown_mult_ON:0 "AN  ·  Bekanntheitszuwachs +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_renown_mult_TT:0 "Sämtliche Bekanntheit, die deine Dynastie erhält, steigt um +100 % pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_skills_OFF:0 "AUS  ·  Alle sechs Werte +50 × Stärke"
 UCM_CROZIER_CHEATS_B_skills_ON:0 "AN  ·  Alle sechs Werte +50 × Stärke"
 UCM_CROZIER_CHEATS_B_skills_TT:0 "Erhöht Diplomatie, Kriegsführung, Verwaltung, Ränkespiel, Bildung und Kampfgeschick um +50 pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_skills_mult_OFF:0 "AUS  ·  Alle sechs Werte +50 % × Stärke"
 UCM_CROZIER_CHEATS_B_skills_mult_ON:0 "AN  ·  Alle sechs Werte +50 % × Stärke"
 UCM_CROZIER_CHEATS_B_skills_mult_TT:0 "Alle sechs deiner Werte steigen um +50 % ihres aktuellen Werts pro Stärkestufe (×2 verdoppelt sie).\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_slots_OFF:0 "AUS  ·  Gebäudeplätze +1 × Stärke"
 UCM_CROZIER_CHEATS_B_slots_ON:0 "AN  ·  Gebäudeplätze +1 × Stärke"
 UCM_CROZIER_CHEATS_B_slots_TT:0 "Jedes Besitztum, das dir gehört, erhält +1 zusätzlichen Gebäudeplatz pro Stärkestufe.\nIst „Gilt für“ auf „ganzes Reich“ gesetzt, erhalten auch alle deine Vasallen die Plätze.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_stress_OFF:0 "AUS  ·  Anspannungszuwachs −99 %"
 UCM_CROZIER_CHEATS_B_stress_ON:0 "AN  ·  Anspannungszuwachs −99 %"
 UCM_CROZIER_CHEATS_B_stress_TT:0 "Du erhältst nur noch 1 % der Anspannung, die du normalerweise bekämst. Die Stärke hat bei diesem Schalter keine Wirkung.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_t_armies_to:0 "Meine Armeen zu seinem Hauptsitz teleportieren"
 UCM_CROZIER_CHEATS_B_t_armies_to_TT:0 "Jede deiner Armeen, die sich nicht in einer Schlacht befindet, wird sofort in die Hauptsitzprovinz des Ziels versetzt. Stehen dort Feinde, beginnt sofort eine Schlacht."
 UCM_CROZIER_CHEATS_B_t_artifact_claims:0 "Meinem Haus Ansprüche auf seine Artefakte geben"
 UCM_CROZIER_CHEATS_B_t_artifact_claims_TT:0 "Dein Haus erhält einen Anspruch auf jedes Artefakt, das dem Ziel gehört."
 UCM_CROZIER_CHEATS_B_t_banish:0 "Verbannen"
 UCM_CROZIER_CHEATS_B_t_banish_TT:0 "Verbannt das Ziel von dem Hof, an dem es sich aufhält."
 UCM_CROZIER_CHEATS_B_t_child_me:0 "Mit meinem Kind schwängern"
 UCM_CROZIER_CHEATS_B_t_child_me_TT:0 "Wer von euch beiden die Frau ist, wird mit eurem Kind schwanger. Erfordert unterschiedliche Geschlechter, und die Frau darf nicht bereits schwanger sein."
 UCM_CROZIER_CHEATS_B_t_child_now:0 "Jetzt ein Kind mit diesem Charakter bekommen"
 UCM_CROZIER_CHEATS_B_t_child_now_TT:0 "Ein neugeborenes Kind von dir und dem Ziel erscheint mit Genie, Herkules und Wunderschön an deinem Hof. Erfordert unterschiedliche Geschlechter."
 UCM_CROZIER_CHEATS_B_t_councillor_chancellor:0 "Zum Ratskanzler ernennen"
 UCM_CROZIER_CHEATS_B_t_councillor_chancellor_TT:0 "Das Ziel übernimmt deinen Sitz als Ratskanzler. Der bisherige Ratskanzler bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_councillor_court_chaplain:0 "Zum Ratsprediger ernennen"
 UCM_CROZIER_CHEATS_B_t_councillor_court_chaplain_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsprediger. Der bisherige Ratsprediger bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_councillor_marshal:0 "Zum Ratsmarschall ernennen"
 UCM_CROZIER_CHEATS_B_t_councillor_marshal_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsmarschall. Der bisherige Ratsmarschall bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_councillor_spymaster:0 "Zum Ratsspitzel ernennen"
 UCM_CROZIER_CHEATS_B_t_councillor_spymaster_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsspitzel. Der bisherige Ratsspitzel bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_councillor_steward:0 "Zum Ratsverwalter ernennen"
 UCM_CROZIER_CHEATS_B_t_councillor_steward_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsverwalter. Der bisherige Ratsverwalter bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_cp_bodyguard:0 "Zu meinem Leibwächter ernennen"
 UCM_CROZIER_CHEATS_B_t_cp_bodyguard_TT:0 "Das Ziel wird in ein Leibwächter-Amt an deinem Hof ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_cp_champion:0 "Zu meinem Persönlichen Streiter ernennen"
 UCM_CROZIER_CHEATS_B_t_cp_champion_TT:0 "Das Ziel wird in dein Amt des Persönlichen Streiters ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_cp_court_physician:0 "Zu meinem Leibarzt ernennen"
 UCM_CROZIER_CHEATS_B_t_cp_court_physician_TT:0 "Das Ziel wird in dein Amt des Leibarztes ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_cp_court_tutor:0 "Zu meinem Tutor ernennen"
 UCM_CROZIER_CHEATS_B_t_cp_court_tutor_TT:0 "Das Ziel wird in dein Amt des Tutors ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_cp_master_assassin:0 "Zu meinem Meistermeuchler ernennen"
 UCM_CROZIER_CHEATS_B_t_cp_master_assassin_TT:0 "Das Ziel wird in dein Amt des Meistermeuchlers ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_cp_royal_architect:0 "Zu meinem Hofbaumeister ernennen"
 UCM_CROZIER_CHEATS_B_t_cp_royal_architect_TT:0 "Das Ziel wird in dein Amt des Hofbaumeisters ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 UCM_CROZIER_CHEATS_B_t_depose:0 "Absetzen"
 UCM_CROZIER_CHEATS_B_t_depose_TT:0 "Das Ziel verliert all seine Titel, die an seinen Erben übergehen."
 UCM_CROZIER_CHEATS_B_t_epidemic_bubonic_plague:0 "Pest-Ausbruch im Hauptsitz auslösen"
 UCM_CROZIER_CHEATS_B_t_epidemic_bubonic_plague_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Pest aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 UCM_CROZIER_CHEATS_B_t_epidemic_consumption:0 "Schwindsucht-Ausbruch im Hauptsitz auslösen"
 UCM_CROZIER_CHEATS_B_t_epidemic_consumption_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Schwindsucht aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 UCM_CROZIER_CHEATS_B_t_epidemic_dysentery:0 "Blutdurchfall-Ausbruch im Hauptsitz auslösen"
 UCM_CROZIER_CHEATS_B_t_epidemic_dysentery_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch des Blutdurchfalls aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 UCM_CROZIER_CHEATS_B_t_epidemic_ergotism:0 "Antoniusfeuer-Ausbruch im Hauptsitz auslösen"
 UCM_CROZIER_CHEATS_B_t_epidemic_ergotism_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch des Antoniusfeuers (Mutterkornvergiftung) aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 UCM_CROZIER_CHEATS_B_t_epidemic_measles:0 "Masern-Ausbruch im Hauptsitz auslösen"
 UCM_CROZIER_CHEATS_B_t_epidemic_measles_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Masern aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 UCM_CROZIER_CHEATS_B_t_epidemic_smallpox:0 "Blattern-Ausbruch im Hauptsitz auslösen"
 UCM_CROZIER_CHEATS_B_t_epidemic_smallpox_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Blattern aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 UCM_CROZIER_CHEATS_B_t_epidemic_typhus:0 "Typhus-Ausbruch im Hauptsitz auslösen"
 UCM_CROZIER_CHEATS_B_t_epidemic_typhus_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch des Typhus aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 UCM_CROZIER_CHEATS_B_t_execute:0 "Hinrichten"
 UCM_CROZIER_CHEATS_B_t_execute_TT:0 "Das Ziel stirbt sofort durch Hinrichtung, mit dir als Henker vermerkt."
 UCM_CROZIER_CHEATS_B_t_family_hostages:0 "Alle seine Kinder als Geiseln nehmen"
 UCM_CROZIER_CHEATS_B_t_family_hostages_TT:0 "Jedes lebende Kind des Ziels, das kein Herrscher und noch keine Geisel ist, wird als Geisel an deinen Hof gebracht."
 UCM_CROZIER_CHEATS_B_t_guest:0 "Als Gast einladen"
 UCM_CROZIER_CHEATS_B_t_guest_TT:0 "Das Ziel reist als Gast an deinen Hof, wo du es anwerben oder verheiraten kannst."
 UCM_CROZIER_CHEATS_B_t_hostage:0 "Als meine Geisel nehmen"
 UCM_CROZIER_CHEATS_B_t_hostage_TT:0 "Das Ziel wird als Geisel an deinen Hof gebracht. Funktioniert nicht bei Herrschern oder bei jemandem, der bereits eine Geisel ist."
 UCM_CROZIER_CHEATS_B_t_hostage_free:0 "Geisel nach Hause schicken"
 UCM_CROZIER_CHEATS_B_t_hostage_free_TT:0 "Ist das Ziel eine Geisel, kehrt es nach Hause zurück."
 UCM_CROZIER_CHEATS_B_t_knight_force:0 "Immer Ritter"
 UCM_CROZIER_CHEATS_B_t_knight_force_TT:0 "Setzt den Ritterstatus des Ziels auf „immer“, sodass es seinem Lehnsherrn stets als Ritter dient. Funktioniert nur, wenn es an seinem aktuellen Hof Ritter sein kann."
 UCM_CROZIER_CHEATS_B_t_knight_off:0 "Nie Ritter"
 UCM_CROZIER_CHEATS_B_t_knight_off_TT:0 "Setzt den Ritterstatus des Ziels auf „nie“, sodass es nicht als Ritter dient."
 UCM_CROZIER_CHEATS_B_t_pneumonic:0 "Lungenentzündung geben"
 UCM_CROZIER_CHEATS_B_t_pneumonic_TT:0 "Gibt dem Ziel eine Lungenentzündung, eine schwere und oft tödliche Krankheit."
 UCM_CROZIER_CHEATS_B_t_rob_artifacts:0 "Alle seine Artefakte nehmen"
 UCM_CROZIER_CHEATS_B_t_rob_artifacts_TT:0 "Verschiebt jedes Artefakt des Ziels in dein Inventar."
 UCM_CROZIER_CHEATS_B_t_schemes_end:0 "Alle seine Komplotte beenden"
 UCM_CROZIER_CHEATS_B_t_schemes_end_TT:0 "Beendet jedes Komplott, das das Ziel betreibt."
 UCM_CROZIER_CHEATS_B_t_schemes_expose:0 "Alle seine Komplotte aufdecken"
 UCM_CROZIER_CHEATS_B_t_schemes_expose_TT:0 "Jedes verborgene Komplott, das das Ziel betreibt, wird aufgedeckt."
 UCM_CROZIER_CHEATS_B_toasts_toggle:0 "Benachrichtigungen nach Cheats: an/aus"
 UCM_CROZIER_CHEATS_B_toasts_toggle_TT:0 "Schaltet die kleinen Einblendungen „Cheat benutzt“ / „Cheat an“ / „Cheat aus“ ein oder aus."
 UCM_CROZIER_CHEATS_B_travel_arrive:0 "Jetzt an meinem Ziel ankommen"
 UCM_CROZIER_CHEATS_B_travel_arrive_TT:0 "Bist du auf Reisen, endet deine aktuelle Reise sofort an ihrem Ziel."
 UCM_CROZIER_CHEATS_B_travel_safe_OFF:0 "AUS  ·  Reisetempo und Reisesicherheit +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_travel_safe_ON:0 "AN  ·  Reisetempo und Reisesicherheit +100 % × Stärke"
 UCM_CROZIER_CHEATS_B_travel_safe_TT:0 "Deine Reisen sind pro Stärkestufe +100 % schneller und +100 % sicherer.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 UCM_CROZIER_CHEATS_B_vassals_OFF:0 "AUS  ·  Vasallenschwelle +100 × Stärke"
 UCM_CROZIER_CHEATS_B_vassals_ON:0 "AN  ·  Vasallenschwelle +100 × Stärke"
 UCM_CROZIER_CHEATS_B_vassals_TT:0 "Erhöht deine Vasallenschwelle um +100 pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
