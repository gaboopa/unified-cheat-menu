l_simp_chinese:
 ucm_clavius_grail_name:0 "永恒哨兵圣杯"
 ucm_clavius_grail_description:0 "这只杯子曾托付给护民官克拉维乌斯·阿奎拉，其朴素的出身隐藏在无数代人的供奉之下。在漫长的值守结束之前，克拉维乌斯将它交到了继任者手中。这是一个誓言：以死亡也无法催促之人的耐心守护生者。"
 ucm_clavius_grail_modifier:0 "克拉维乌斯的最后嘱托"
 ucm_clavius_grail_modifier_desc:0 "护民官的杯子召唤其持有者对每一位臣民保持智慧、虔诚与公正。"
 ucm_clavius_handover_memory:0 "克拉维乌斯的最后值守"
 ucm_clavius_handover_memory_desc:0 "我饮下了克拉维乌斯·阿奎拉圣杯中的酒，接受了他作为永恒哨兵的嘱托。护民官漫长的值守终于结束了。"
 ucm_clavius_handover_memory_desc_second_perspective:0 "你饮下了克拉维乌斯·阿奎拉圣杯中的酒，接受了他作为永恒哨兵的嘱托。护民官漫长的值守终于结束了。"
 ucm_clavius_handover_memory_desc_third_perspective:0 "该角色饮下了克拉维乌斯·阿奎拉圣杯中的酒，接受了他作为永恒哨兵的嘱托。护民官漫长的值守终于结束了。"
