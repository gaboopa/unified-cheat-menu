 trait_tyranny_gain_remove:0 "En İyi Avukatlar Ekibi"
 trait_tyranny_gain_remove_desc:0 "Kutsanmış Barbara, bu karakteri görünmez savunucularla korur, tüm suçlamalara karşı savunur."
 trait_tyranny_gain_remove_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] kınamanın ötesindedir, çünkü Kutsanmış Barbara her eylemine ilahi otorite ödünç verir."
 trait_100_stat_man:0 "Kadir-i Mutlak"
 trait_100_stat_man_desc:0 "Kutsanmış Barbara tarafından yüceltilmiş bir efsane, ilahi lütufla kutsanmış bir dahi. Hiç kimse bu kaderli ruhun üstesinden gelemez."
 trait_100_stat_man_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], Barbara'nın seçilmişi olarak yürür; efsaneler arasında bir efsane ve durdurulamaz bir gücün taşıyıcısıdır."
