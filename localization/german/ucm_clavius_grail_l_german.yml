l_german:
 ucm_clavius_grail_name:0 "Gral des Ewigen Wächters"
 ucm_clavius_grail_description:0 "Der Kelch, der Tribun Clavius Aquila anvertraut wurde; sein bescheidener Ursprung liegt unter den Gaben unzähliger Generationen verborgen. Bevor seine lange Wache endete, legte Clavius ihn in die Hände seines Nachfolgers. Er ist ein Gelöbnis, die Lebenden mit der Geduld eines Mannes zu beschützen, den der Tod nicht mehr zur Eile drängen kann."
 ucm_clavius_grail_modifier:0 "Clavius' letzter Auftrag"
 ucm_clavius_grail_modifier_desc:0 "Der Kelch des Tribuns ruft seinen Hüter zu Weisheit, Hingabe und Gerechtigkeit gegenüber allen Untertanen auf."
 ucm_clavius_handover_memory:0 "Clavius' letzte Wache"
 ucm_clavius_handover_memory_desc:0 "Ich trank aus dem Gral von Clavius Aquila und nahm seinen Auftrag als Ewiger Wächter an. Endlich war die lange Wache des Tribuns zu Ende."
 ucm_clavius_handover_memory_desc_second_perspective:0 "Du trankst aus dem Gral von Clavius Aquila und nahmst seinen Auftrag als Ewiger Wächter an. Endlich war die lange Wache des Tribuns zu Ende."
 ucm_clavius_handover_memory_desc_third_perspective:0 "Dieser Charakter trank aus dem Gral von Clavius Aquila und nahm seinen Auftrag als Ewiger Wächter an. Endlich war die lange Wache des Tribuns zu Ende."
