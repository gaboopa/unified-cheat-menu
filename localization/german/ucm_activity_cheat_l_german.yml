 ucm_cheat_menu_activity_cheat_menu_interaction: "Aktivitäten / Lebensstil"
 ucm_cheat_menu_activity_cheat_menu_interaction_desc: "Feste, Jagden und Turniere ausrichten erzwingen; Kosten für Feste überspringen; Aktivitätsphasen überspringen oder sofort abschließen."
 ucm_cheat_menu.3091.t: "Aktivitäten-Cheats"
 ucm_cheat_menu.3091.desc: "Steuere Lebensstilaktivitäten für [ucm_cheat_menu_target.GetShortUIName] (Feste, Jagden, Turniere etc.). Beim Ausrichten werden zunächst Gold und Prestige hinzugefügt; ursprüngliche Spielvoraussetzungen (Rang, Kultur, DLC) können einige Typen dennoch blockieren."
 ucm_cheat_menu.3092.t: "Unterhaltungsveranstaltungen ausrichten"
 ucm_cheat_menu.3092.desc: "Aktivitäten für [ucm_cheat_menu_target.GetShortUIName] ausrichten. Zuerst werden Ressourcen hinzugefügt. Falls das Menü nicht öffnet, prüfe Benachrichtigungen oder die Aktivitätsliste und versuche, die Festkosten-Überspringfunktion umzuschalten."
 ucm_cheat_menu.3097.t: "Weitere Aktivitäten ausrichten"
 ucm_cheat_menu.3097.desc: "Hofreisen, Hochzeiten, Pilgerreisen und weitere besondere Aktivitäten. Die strengen Voraussetzungen des Basisspiels gelten weiterhin."
 ucm_activity_cheat_toast_toggle_title: "Aktivitäten-Cheat · Festkosten"
 ucm_activity_cheat_toast_toggle_desc: "fest_ai_override für den ausgewählten Charakter umgeschaltet."
 ucm_activity_cheat_toast_host_title: "Aktivitäten-Cheat · Ausrichtversuch"
 ucm_activity_cheat_toast_host_desc: "Ressourcen hinzugefügt und Aktivität in der Hauptstadt/Ort gestartet. Prüfe Aktivitäten oder Benachrichtigungen."
 ucm_activity_cheat_toast_skip_phase_title: "Aktuelle Aktivitätsphase übersprungen"
 ucm_activity_cheat_toast_complete_title: "Aktivität abgeschlossen"
 ucm_activity_cheat_toast_cancel_title: "Aktivität für ungültig erklärt"
