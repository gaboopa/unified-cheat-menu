l_german:
  daddy_pika_information:0 "Unified Cheat Menu"
  information_desc:0 "Unified Cheat Menu für CK3 1.20. Rechtsklicke eine beliebige Person und wähle Cheat-Menü öffnen. Nur für Einzelspieler."
  information_TT:0 "Klicken, um Informationen zum Unified Cheat Menu anzuzeigen."

  dp_information.changelog.t:0 "Unified Cheat Menu"
  dp_information.changelog.d:0 "Für CK3 1.20 Crozier: das Riten- und Glaubenssatzsystem, die neuen Gesetzes- und Wahlformate und das Interaktionsmenü von By God Alone."

  dp_information.useful_tips.t:0 "Nützliche Hinweise"
  dp_information.useful_tips.d:0 "Funktionsmenü\n- Einmal klicken zum Aktivieren, erneut klicken zum Deaktivieren.\n- Wenn eine Funktion nicht erscheint, bedeutet das nicht, dass der Mod fehlerhaft ist. Möglicherweise wird sie durch eine fest integrierte Paradox-Funktion überschrieben.\n- Aufgrund von DLC-Inhalten können einige Interaktionen bei bestimmten Charakteren nicht verfügbar sein.\n- Knightblood-Eigenschaften werden zu Beginn eines neuen Spiels in geringer Anzahl zufällig an NSCs vergeben, um interessante Werte zu erzeugen. Falls die Spieler damit nicht zufrieden sind, werde ich diese Funktion wieder entfernen.\n- Dieser Mod unterstützt auch ältere Spielversionen, falls du auf eine frühere Version zurückwechseln möchtest."

  dp_information.locations.t:0 "Probleme melden"
  dp_information.locations.d:0 "Wenn etwas nicht funktioniert, notiere, worauf du geklickt hast, was passiert ist und was du erwartet hast, und behalte die passenden Zeilen aus Documents/Paradox Interactive/Crusader Kings III/logs/error.log."

  use_new_system:0 "Neues System"
  use_new_system_desc:0 "Das alte System wurde durch das neue ersetzt. Möchtest du es ausprobieren?"
  use_new_system_tooltip:0 "Ein Klick löst ein Ereignis aus."
