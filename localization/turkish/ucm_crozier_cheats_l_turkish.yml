 UCM_CROZIER_CHEATS_B_skills_ON:0 "AÇIK  ·  Altı becerinin hepsi +50 × güç"
 UCM_CROZIER_CHEATS_B_skills_TT:0 "Her güç kademesi için Diplomasi, Askeri, Yönetim, Entrika, Bilgi ve Yiğitlik becerilerine +50 ekler.\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
 UCM_CROZIER_CHEATS_B_skills_mult_OFF:0 "KAPALI  ·  Altı becerinin hepsi +%50 × güç"
 UCM_CROZIER_CHEATS_B_skills_mult_ON:0 "AÇIK  ·  Altı becerinin hepsi +%50 × güç"
 UCM_CROZIER_CHEATS_B_skills_mult_TT:0 "Altı becerinin her biri, her güç kademesi için mevcut değerinin +%50'si kadar artar (×2 onları ikiye katlar).\nGüç, bunu açtığında panelin üst kısmında seçili olan çarpandır. Daha sonra değiştirmek için anahtarı kapat, yeni bir güç seç ve tekrar aç.\nBaşka bir karaktere geçersen bonus, bir sonraki otomatik mod kontrolünde ona aktarılır."
