 ucm_ai_boost_toggle_decision_desc_on: "Monatliche Auto-Boni aktiv Bis 600# landbesitzende KI erhalten pro Monat Staatsboni ausgehend vom Spielerreich, stapelbar mit manueller Verstärkung. Klick zum Ausschalten"
