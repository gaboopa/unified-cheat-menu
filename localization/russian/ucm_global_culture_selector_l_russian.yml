 ucm_cheat_menu.1360.t: "Выберите культуру (регион → наследие → культура)"
 ucm_cheat_menu.1360.desc: "Выберите общий регион, затем наследие и культуру. Также доступен алфавитный список всех наследий и общий индекс культур."
