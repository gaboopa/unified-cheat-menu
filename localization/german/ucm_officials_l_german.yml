 ucm_ai_counter_player_pressure_heavy_desc: "Your realm has exceeded a critical size threshold: all AI receive stronger diplomacy, intrigue, diplomatic range, and war/grudge weights, making alliances against a dominant player more likely. AI decisions still follow the base engine rules."
