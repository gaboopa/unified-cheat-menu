 trait_blood_ancester_7:0 "Rüzgar Koşucusu"
 trait_blood_ancester_7_desc:0 "Bu karakter, soyunu Rüzgar Melekleri ile dans eden efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: hız ve özgürlük."
