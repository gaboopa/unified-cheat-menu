 ucm_trait_immortal_ageless: "Zeitlose Unsterblichkeit"
 ucm_trait_immortal_ageless_desc: "Die Zeit vermag Sie nicht altern zu lassen. Sie altern nicht, erleiden keine altersbedingten Beeinträchtigungen, besitzen eine extreme Krankheitsresistenz und sind nahezu immun gegen Mordanschläge und feindliche Machenschaften."
 ucm_trait_yannian_dan: "Langlebigkeitselixier"
 ucm_trait_yannian_dan_desc: "Ein mächtiges Elixier, das die Jugend bewahrt, die Lebensdauer stark verlängert und vor Krankheiten schützt."
 ucm_trait_yannian_dan_mid: "Verfeinertes Langlebigkeitselixier"
 ucm_trait_yannian_dan_mid_desc: "Ein verfeinertes Elixier, das die Jugend bewahrt, die Lebensdauer deutlich verlängert und vor Krankheiten schützt."
 ucm_trait_yannian_dan_best: "Höchstes Langlebigkeitselixier"
 ucm_trait_yannian_dan_best_desc: "Ein göttliches Elixier, das die Jugend für immer bewahrt, die Grenzen des sterblichen Daseins durchbricht und jegliche Krankheiten abwehrt."
 ucm_trait_baidubuqin: "Unempfindlich gegen alle Gifte"
 ucm_trait_baidubuqin_desc: "Gifte und Seuchen können Ihnen nichts anhaben. Sie erkranken an keinerlei Krankheiten und besitzen eine extreme Resistenz gegen Epidemien. Bestehende Krankheiten werden sofort geheilt."
 ucm_trait_xinwuguai: "Geistige Gelassenheit"
 ucm_trait_xinwuguai_desc: "Ihr Geist ist stets klar und unbeschwert. Der Stress bleibt dauerhaft bei Null und kann sich kaum ansammeln. Bei Erhalt dieser Eigenschaft wird sämtlicher vorhandener Stress sofort entfernt."
 ucm_trait_marriage_ban: "Verbot der Heirat"
 ucm_trait_marriage_ban_desc: "Sie können in diesem Leben weder heiraten noch eine Verlobung eingehen. Bestehende Ehen und Verlobungen werden sofort aufgelöst. Diese Einschränkung kann nicht aufgehoben werden."
 ucm_trait_stats_100_locked: "Attribute festgesetzt (100)"
 ucm_trait_stats_100_locked_desc: "Diplomatie, Kampf, Verwaltung, Intrige, Gelehrsamkeit und Kampfstärke sind dauerhaft auf 100 fixiert. Weder Alter noch Ereignisse können diese Werte verändern."
 trait_ucm_cheat_menu: "Sonderbegabung"
 trait_warlord_eternal: "Ewiger Kriegsherr"
 trait_warlord_eternal_desc: "Ein Meister der Kriegsführung. Ihre Truppen sind kampferprobt, Ritter verbreiten Angst und Ihre Streitkräfte sind unaufhaltsam. Geländebedingungen behindern Sie nicht."
 trait_wealth_sovereign_max: "Herrscher des Reichtums"
 trait_wealth_sovereign_max_desc: "Meister von Handel und Finanzen. Steuereinnahmen und Vasallenabgaben steigen stark an, Ihre Schatzkammer geht niemals leer."
 trait_ultimate_intrigue_master: "Meister der Geheimnisse"
 trait_ultimate_intrigue_master_desc: "Ein unvergleichlicher Meister der Schatten. Feindliche Intrigen scheitern gegen Sie, Ihre eigenen Machenschaften bleiben unentdeckt und gelingen garantiert."
 trait_great_builder_god: "Göttlicher Baumeister"
 trait_great_builder_god_desc: "Unübertroffene Baukunst. Gebäude und Betriebe im Reich werden mit minimalen Kosten und Zeitaufwand erbaut. Verwaltung, Steuern, Prestige, Entwicklung und Befestigungen werden stark gestärkt."
 trait_nether_conspiracy_lord: "Herr der Verschwörungen"
 trait_nether_conspiracy_lord_desc: "Meister der hinterlistigen Intrigen. Feindliche Pläne geraten ins Stocken, Ihr Angstwert steigt und die Hofmeinung neigt sich Ihnen zu."
 trait_eternal_nether_lord: "Ewiger Schattenherr"
 trait_eternal_nether_lord_desc: "Ein eiserner Wille durch die Zeitalter. Stress berührt Sie kaum, Ihre Intrigen sind übermächtig, Feinde scheitern gegen Sie und Vasallen sowie Höflinge ehren Sie zutiefst."
 trait_the_wake: "Wachsamster Wächter"
 trait_the_wake_desc: "Ein Meister der Späher und Plünderer. Gefürchtet in Schlachten und Überfällen, besonders stark in Sumpfgebieten. Angehörige verwandter Kulturen blicken zu Ihnen auf."
 trait_lifestyle_traveler: "Weltreisender"
 trait_lifestyle_traveler_desc: "Eine tiefe Verbindung zum Wanderer-Lebensstil. Sie profitieren von Reisen, neuen Orten und Begegnungen, ob auf sicheren oder riskanten Wegen."
 trait_child_of_concubine_female: "Tochter einer Nebenfrau"
 trait_child_of_concubine_female_desc: "Geboren von einer Nebenfrau oder Zweitgemahlin. Familienrecht und Erbfolge unterscheiden sich von denen der Kinder der Hauptgemahlin."
 trait_child_of_concubine_male: "Sohn einer Nebenfrau"
 trait_child_of_concubine_male_desc: "Geboren von einer Nebenfrau oder Zweitgemahlin. Familienrecht und Erbfolge unterscheiden sich von denen der Kinder der Hauptgemahlin."
