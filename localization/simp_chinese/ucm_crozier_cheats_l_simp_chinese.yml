 UCM_CROZIER_CHEATS_B_piety_TT:0 "每级强度使你每月获得+100虔诚。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_prestige_OFF:0 "关闭  ·  每月威望+100 × 强度"
 UCM_CROZIER_CHEATS_B_prestige_ON:0 "开启  ·  每月威望+100 × 强度"
 UCM_CROZIER_CHEATS_B_prestige_TT:0 "每级强度使你每月获得+100威望。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_prestige_mult_OFF:0 "关闭  ·  威望和虔诚获取+100% × 强度"
 UCM_CROZIER_CHEATS_B_prestige_mult_ON:0 "开启  ·  威望和虔诚获取+100% × 强度"
 UCM_CROZIER_CHEATS_B_prestige_mult_TT:0 "每级强度使你获得的所有威望和虔诚增加+100%。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_renown_OFF:0 "关闭  ·  每月宗族威望+5 × 强度"
 UCM_CROZIER_CHEATS_B_renown_ON:0 "开启  ·  每月宗族威望+5 × 强度"
 UCM_CROZIER_CHEATS_B_renown_TT:0 "每级强度使你的宗族每月获得+5宗族威望。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_renown_mult_OFF:0 "关闭  ·  宗族威望获取+100% × 强度"
 UCM_CROZIER_CHEATS_B_renown_mult_ON:0 "开启  ·  宗族威望获取+100% × 强度"
 UCM_CROZIER_CHEATS_B_renown_mult_TT:0 "每级强度使你的宗族获得的所有宗族威望增加+100%。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_skills_OFF:0 "关闭  ·  全部六项能力+50 × 强度"
 UCM_CROZIER_CHEATS_B_skills_ON:0 "开启  ·  全部六项能力+50 × 强度"
 UCM_CROZIER_CHEATS_B_skills_TT:0 "每级强度使外交、军事、管理、谋略、学识和勇武+50。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_skills_mult_OFF:0 "关闭  ·  全部六项能力+50% × 强度"
 UCM_CROZIER_CHEATS_B_skills_mult_ON:0 "开启  ·  全部六项能力+50% × 强度"
 UCM_CROZIER_CHEATS_B_skills_mult_TT:0 "每级强度使你的全部六项能力增加其当前数值的+50%（×2即翻倍）。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_slots_OFF:0 "关闭  ·  建筑槽位+1 × 强度"
 UCM_CROZIER_CHEATS_B_slots_ON:0 "开启  ·  建筑槽位+1 × 强度"
 UCM_CROZIER_CHEATS_B_slots_TT:0 "每级强度使你拥有的每块地产额外获得+1个建筑槽位。\n若“作用范围”设为“整个领地”，你的所有封臣也会获得这些槽位。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 UCM_CROZIER_CHEATS_B_stress_OFF:0 "关闭  ·  压力获取−99%"
 UCM_CROZIER_CHEATS_B_stress_ON:0 "开启  ·  压力获取−99%"
