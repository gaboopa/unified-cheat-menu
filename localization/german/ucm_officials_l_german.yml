 ucm_cheat_menu_force_pregnancy_interaction: "Schwangerschaft erzwingen"
 ucm_cheat_menu_force_pregnancy_interaction_desc: "Ist die Person nicht Ihr Ehepartner, Geliebter, Seelenverwandter oder Konkubine: Sie wird von Ihnen schwanger, das Kind gilt aber als unbekannter Bastard. Der eingetragene Vater ist ggf. ihr Ehemann, andernfalls Sie selbst. Die Entdeckung eines Ehebruchs wird erschwert. Handelt es sich um eine Ihrer Beziehungen, sind Sie sowohl biologischer als auch eingetragener Vater. Es gibt keine Fruchtbarkeitsprüfung; bestehende Geheimnisse wie Liebesbeziehungen oder Ehebruch verhindern keine Schwangerschaft."
