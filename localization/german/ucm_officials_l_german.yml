 ucm_ai_realm_governance_support: "Regierungsunterstützung"
 ucm_ai_realm_governance_support_desc: "Truppenunterhalt um ca.50% gesenkt, Hauskriegerlimit und Truppengröße stark erhöht. Bau- und Einkommensboni, verbesserte Diplomatie und Kriegslust. KI wird habgieriger, Mildheit und Ehre sinken, Domänenlimit +2. Alle unabhängigen Reiche erhalten jährliche stapelbare Expansionsboni, höhere Vasallabgaben und EP3-Vorteile. Automatische De-Jure-Vasallverteilung dauernd aktiv."
