 ucm_boost_world_ai_rulers_decision_desc: "Дарует военные, экономические и дипломатические бонусы всем правителям с владениями для стимулирования войн и экспансии. При чрезмерном усилении игрока правители формируют коалиции для сохранения сложности игры."
 ucm_boost_world_ai_rulers_decision_tooltip: "Система работает #boldбез расхода престижа#!"
 ucm_boost_world_ai_rulers_decision_confirm: "Запустить полное усиление ИИ"
 ucm_boost_world_ai_rulers_effect_tt: "#boldВсе правители ИИ с землями#! получают модификатор «Поддержка управления» на #bold15 лет#, ежегодные бонусы строительства и дружин сохраняются весь срок действия."
 ucm_ai_yearly_admin_conversion_toggle_title_on: "#bold 【ВКЛ】#! Годовой триггер: Автореформа административного строя ИИ"
 ucm_ai_yearly_admin_conversion_toggle_title_off: "#bold 【ВЫКЛ】#! Годовой триггер: Автореформа административного строя ИИ"
 ucm_ai_yearly_admin_conversion_toggle_desc_on: "Сейчас включен. Требуется «Путь к власти»(EP3). Каждый год все независимые правители ИИ и их вассалы переводятся в административное государственное устройство. Включено по умолчанию, отдельно от ручного усиления ИИ. Кочевые и племенные владыки больше не переводят вассалов массово во избежание отделения. При отключении повышаются обязательства вассалов и бонусы расширения сохраняются. Нажмите для отключения"
 ucm_ai_yearly_admin_conversion_toggle_desc_off: "Сейчас отключен, ежегодная автоматическая смена строя прекращена. Бонусы податей и расширения остаются, ручная смена строя доступна в меню форм правления. Нажмите для повторного включения"
 ucm_ai_yearly_admin_conversion_toggle_tooltip_on: "Активно: ежегодная автореформа ИИ(требуется EP3), клик для отключения"
 ucm_ai_yearly_admin_conversion_toggle_tooltip_off: "Неактивно: нет автоматической реформы, клик для включения"
 ucm_ai_yearly_admin_conversion_toggle_confirm_disable: "Отключить ежегодную автореформу администрации"
 ucm_ai_yearly_admin_conversion_toggle_confirm_enable: "Включить ежегодную автореформу администрации"
 ucm_ai_yearly_admin_conversion_toggle_effect_disabled_tt: "Отключено: ежегодная автоматическая смена строя для ИИ остановлена"
 ucm_ai_yearly_admin_conversion_toggle_effect_enabled_tt: "Включено: подходящие независимые ИИ переходят в административный строй ежегодно(нужен EP3)"
 ucm_ai_yearly_pulse_toggle_title_on: "#bold 【ВКЛ】#! Годовой глобальный импульс (Главный переключатель)"
 ucm_ai_yearly_pulse_toggle_title_off: "#bold 【ВЫКЛ】#! Годовой глобальный импульс (Главный переключатель)"
 ucm_ai_yearly_pulse_toggle_desc_on: "Включен по умолчанию. Каждый год все независимые ИИ получают бонусы расширения, войны, рост вассальных податей и обновление антигегемонистических коалиций. Подпункты: автореформа администрации вкл, законный перенос вассалов выкл. Первый год новой кампании пропускает весь импульс. При отключении главного переключателя все подменю скрываются, скрипты останавливаются. Не связано с месячным автоусилением ИИ Нажмите отключить"
 ucm_ai_yearly_pulse_toggle_desc_off: "Отключен, событие9200 остановлено, ежегодное обновление антигегемонии модуля прекращено(квартальные и месячные проверки работают). Нажмите включить снова"
 ucm_ai_yearly_pulse_toggle_tooltip_on: "Стандарт активен, клик для отключения главного переключателя"
 ucm_ai_yearly_pulse_toggle_tooltip_off: "Все годовые импульсы остановлены, клик для активации"
 ucm_ai_yearly_pulse_toggle_confirm_disable: "Отключить главный переключатель годового импульса"
 ucm_ai_yearly_pulse_toggle_confirm_enable: "Включить главный переключатель годового импульса"
 ucm_ai_yearly_pulse_toggle_effect_disabled_tt: "Отключено: событие9200 и ежегодное обновление антигегемонистических коалиций остановлены"
 ucm_ai_yearly_pulse_toggle_effect_enabled_tt: "Включено: годовой импульс работает согласно поднастройкам"
 ucm_ai_yearly_de_jure_transfer_toggle_title_on: "#bold 【ВКЛ】#! Годовой импульс: Автоперенос вассалов по закону ИИ"
 ucm_ai_yearly_de_jure_transfer_toggle_title_off: "#bold 【ВЫКЛ】#! Годовой импульс: Автоперенос вассалов по закону ИИ"
 ucm_ai_yearly_de_jure_transfer_toggle_desc_on: "Включен. Ежегодно независимые ИИ переносят вассалов по юридической принадлежности как игрок. По умолчанию выкл, изменяет стартовые границы оригинала(Хэси, Гоби и т.д.) При отключении бонусы расширения, податей и автореформа сохраняются, ручной перенос законных вассалов доступен. Нажмите отключить"
 ucm_ai_yearly_de_jure_transfer_toggle_desc_off: "По умолчанию выкл Годовой скрипт не перераспределяет вассалов для сохранения оригинальной карты. В первый год новой игры весь годовой импульс пропускается. Нажмите включить"
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_on: "Активно: ежегодный законный перенос вассалов ИИ, клик отключить"
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_off: "Неактивно: нет автопереноса, клик включить"
 ucm_ai_yearly_de_jure_transfer_toggle_confirm_disable: "Отключить ежегодный автоперенос по закону"
 ucm_ai_yearly_de_jure_transfer_toggle_confirm_enable: "Включить ежегодный автоперенос по закону"
 ucm_ai_yearly_de_jure_transfer_toggle_effect_disabled_tt: "Отключено: ежегодный автоматический перенос вассалов прекращен"
 ucm_ai_yearly_de_jure_transfer_toggle_effect_enabled_tt: "Включено: независимые ИИ перераспределяют вассалов по закону каждый год"
 ucm_ai_boost_toggle_decision_title_on: "#bold 【ВКЛ】#! Месячное автоматическое усиление ИИ"
 ucm_ai_boost_toggle_decision_title_off: "#bold 【ВЫКЛ】#! Месячное автоматическое усиление ИИ"
 ucm_ai_boost_toggle_decision_desc_on: "Месячные авто-бонусы активны Каждый месяц до 600# владеющих землями ИИ получают усиление, расходящееся от владений игрока, складывается с ручным усилением. Нажмите отключить"
 ucm_ai_boost_toggle_decision_desc_off: "Месячное автоусиление отключен Клик для включения, повторный клик для остановки."
 ucm_ai_boost_toggle_decision_confirm_disable: "Отключить месячное автоусиление ИИ"
 ucm_ai_boost_toggle_decision_confirm_enable: "Включить месячное автоусиление ИИ"
 ucm_ai_boost_toggle_effect_enabled_tt: "Активно: до 600 ИИ получают государственные бонусы каждый месяц"
 ucm_ai_boost_toggle_effect_disabled_tt: "Отключено: автоматическое начисление бонусов прекращено"
 ucm_ai_realm_governance_support: "Поддержка управления"
 ucm_ai_realm_governance_support_desc: "Содержание войск снижено примерно на 50%, лимит и численность дружин сильно повышены. Ускорено строительство, рост доходов, улучшена дипломатия и воинственность. ИИ становится алчнее, снижена доброта и честь, лимит домена +2. Все независимые царства получают ежегодные бонусы расширения с накоплением, рост вассальных податей и преимущества EP3. Автоперенос вассалов по закону всегда активен."
 ucm_ai_expansion_push: "Годовой толчок к экспансии"
 ucm_ai_expansion_push_desc: "Годовой модификатор: строительство +60%, содержание дружин -70%. Повышено желание ИИ воевать за претензии, принудительных войн нет."
 ucm_ai_stable_surge: "Крупный ежегодный всплеск экспансии"
 ucm_ai_stable_surge_desc: "Ежегодный дополнительный рост воинственности, смелости и амбиций ИИ поверх базового бонуса, правила войны следуют оригиналу игры."
 ucm_ai_counter_player_pressure: "Антигегемонистическая коалиция"
 ucm_ai_counter_player_pressure_desc: "Срабатывает при владении империей или более 80 графств: все независимые ИИ получают бонус дальности дипломатии, общения, интриг и войны для формирования союзов против сильного игрока. Войны, похищения и браки по оригинальным правилам ИИ."
