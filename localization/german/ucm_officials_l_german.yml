 ucm_one_click_strip_official_titles_decision: "Alle Titel entziehen"
 ucm_one_click_strip_official_titles_decision_desc: "Ein einziger Klick wiederholt den Titelentzug bis zur vollständigen Säuberung: Alle Grafschaften, Herzogtümer sowie höherrangige Titel innerhalb deines Reiches fallen an dich zurück."
 ucm_one_click_strip_official_titles_decision_tooltip: "Entziehe sämtliche Titel in deinem Reich – sie gehen direkt an dich über."
 ucm_one_click_strip_official_titles_decision_confirm: "Titelentzug bestätigen"
 ucm_one_click_strip_official_titles_effect_tt: "Automatisch werden mehrere Durchläufe des Titelentzugs ausgeführt, bis keine einziehbaren Grafschaften oder Herzogtümer und höherrangigen Titel mehr in deinem Reich übrig sind. Unabhängige Herrscher fremder Reiche bleiben unberührt."
