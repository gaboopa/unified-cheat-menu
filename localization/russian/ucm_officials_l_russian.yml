 trait_ucm_trait_yannian_dan_mid_desc: "Утончённый эликсир, закрепляющий молодость и значительно продлевающий жизнь, отпугивая болезни."
 trait_ucm_trait_yannian_dan_best: "Пилюля долголетия (высшая)"
 trait_ucm_trait_yannian_dan_best_desc: "Несравненный эликсир, закрепляющий молодость и бросающий вызов пределам смертной жизни, отпугивая болезни."
 trait_ucm_trait_baidubuqin: "Иммунитет к ядам"
 trait_ucm_trait_baidubuqin_desc: "Иммунитет к болезням и чуме; чрезвычайно устойчив. Любая текущая болезнь излечивается сразу же после обретения этой черты."
 trait_ucm_trait_xinwuguai: "Безмятежный ум"
 trait_ucm_trait_xinwuguai_desc: "Ясный ум без тягот: стресс остаётся на нуле и почти не накапливается; при получении снимает весь накопленный стресс."
 trait_ucm_trait_marriage_ban: "Запрет на брак"
 trait_ucm_trait_marriage_ban_desc: "Не может жениться или обручиться на всю жизнь; любой брак или обручение немедленно нарушается. Существующие супруги или обручения заканчиваются при получении черты. Нажмите снова, чтобы удалить."
 trait_ucm_trait_stats_100_locked: "Фиксация характеристик на 100"
 trait_ucm_trait_stats_100_locked_desc: "Дипломатия, военное дело, управление, интрига, учёность и доблесть зафиксированы на 100 и не могут быть изменены событиями, возрастом или другими источниками."
 trait_trait_warlord_eternal: "Вечный военачальник"
 trait_trait_warlord_eternal_desc: "Вершина командования: закалённые в боях солдаты, ужасающие рыцари и неустанный натиск. Скорость марша парит, местность перестаёт иметь значение, а осады рушатся перед неудержимым войском."
 trait_trait_wealth_sovereign_max: "Суверенное богатство"
 trait_trait_wealth_sovereign_max_desc: "Мастер денег и торговли: налоги растут, вассальные взносы растут, а казначейство, кажется, никогда не иссякает."
 trait_trait_ultimate_intrigue_master: "Многоликий провидец"
 trait_trait_ultimate_intrigue_master_desc: "Непревзойдённый ткач теней: враждебные схемы против вас увядают, в то время как ваши собственные заговоры остаются невидимыми и почти гарантированно преуспевают."
 trait_trait_great_builder_god: "Божественный строитель"
 trait_trait_great_builder_god_desc: "Первозданное мастерство в строительстве: владения и здания по всему миру растут с минимальными затратами времени и золота; управление, налоги, престиж, развитие, укрепления и сборы — всё это растёт."
 trait_trait_nether_conspiracy_lord: "Повелитель преисподней (заговор)"
 trait_trait_nether_conspiracy_lord_desc: "Мастер завуалированной интриги: ваши враждебные схемы становятся всё более скрытными и вероятными, в то время как вражеские заговоры против вас медленны и непостоянны; страх поднимается, и придворные склоняются в вашу пользу."
 trait_trait_eternal_nether_lord: "Вечный повелитель преисподней"
 trait_trait_eternal_nether_lord_desc: "Воля, застывшая на эоны: стресс едва касается вас, страх нарастает и держится, интрига огромна, и враждебные схемы против вас с трудом добиваются успеха, в то время как вассалы и придворные изгибаются в трепете."
