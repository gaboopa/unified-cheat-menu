 ucm_ai_realm_governance_support: "Regierungsunterstützung"
 ucm_ai_realm_governance_support_desc: "Truppenunterhalt um ca.50% gesenkt, Hauskriegerlimit und Truppengröße stark erhöht. Bau- und Einkommensboni, verbesserte Diplomatie und Kriegslust. KI wird habgieriger, Mildheit und Ehre sinken, Domänenlimit +2. Alle unabhängigen Reiche erhalten jährliche stapelbare Expansionsboni, höhere Vasallabgaben und EP3-Vorteile. Automatische De-Jure-Vasallverteilung dauernd aktiv."
 ucm_ai_expansion_push: "Jährlicher Expansionsschub"
 ucm_ai_expansion_push_desc: "Jährlicher Modifikator: Bautempo +60%, Hauskriegerunterhalt -70%. Erhöhte Kriegsbereitschaft der KI auf eigene Ansprüche, keine erzwungenen Kriege."
 ucm_ai_stable_surge: "Großer jährlicher Expansionsanstieg"
 ucm_ai_stable_surge_desc: "Jährliche zusätzliche Erhöhung von Kriegslust, Tapferkeit und Ehrgeiz oberhalb des Basisbonus, Kriegsregeln folgen Vanilla-KI-Logik."
 ucm_ai_counter_player_pressure: "Anti-Hegemon-Bündnis"
 ucm_ai_counter_player_pressure_desc: "Wirkung bei Imperiumstitel oder über 80 Grafschaften: Alle unabhängigen KI erhalten Boni auf Diplomatie-Reichweite, Sozialwert, Intrige und Kriegslust zur Bündnisbildung gegen übermächtigen Spieler. Krieg, Entführung und Heirat nach Original-KI-Regeln."
