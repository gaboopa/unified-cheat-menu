 # 分页：文化革新
 ucm_trait_immortal_ageless: "不死不朽"
 ucm_trait_immortal_ageless_desc: "永葆青春，不受岁月侵蚀：外观定格、不会无能，抗病极强，且几乎免疫谋杀与敌对阴谋。"
 ucm_trait_yannian_dan: "延年丹"
 ucm_trait_yannian_dan_desc: "服下延年丹后青春定格、寿命大增，元气充沛，百病不侵。"
 ucm_trait_yannian_dan_mid: "延年丹（中级）"
 ucm_trait_yannian_dan_mid_desc: "中级延年丹：青春定格、寿命暴增，元气充沛，百病不侵。"
 ucm_trait_yannian_dan_best: "延年丹（极品）"
 ucm_trait_yannian_dan_best_desc: "极品延年丹：青春定格、寿命逆天，元气充沛，百病不侵。"
 ucm_trait_baidubuqin: "百毒不侵"
 ucm_trait_baidubuqin_desc: "百毒辟易、瘟疫难侵：不会感染任何疾病，抗疫性极高；若已患病则立刻痊愈。"
 ucm_trait_xinwuguai: "心无挂碍"
 ucm_trait_xinwuguai_desc: "心境澄明、业障皆空：压力恒为零，几乎不会积累压力；获得时立刻卸下过往一切压力。"
 ucm_trait_marriage_ban: "禁婚"
 ucm_trait_marriage_ban_desc: "此生无法结婚或订婚：成婚、订婚成立时立刻拆散；已有配偶或婚约在获得特质时会被解除。可再点「禁婚」关闭。"
 ucm_trait_stats_100_locked: "属性一百"
 ucm_trait_stats_100_locked_desc: "外交、军事、管理、谋略、学识、勇武均锁定为 100，不受事件、年龄或其它来源增减。"
 trait_ucm_cheat_menu: "特质"
 trait_warlord_eternal: "万古军主"
 trait_warlord_eternal_desc: "穷极一世的治军巅峰，麾下士卒皆为百战精锐，贵族骑士悍勇无双。大军行战近似无视地形桎梏、行军如飞，征伐四海无往不利，凡所至之处，万军辟易。"
 trait_wealth_sovereign_max: "万财帝君"
 trait_wealth_sovereign_max_desc: "执掌天地财权，掌控大陆所有商路与税源。万物生息皆为己用：领地税收与总收入暴涨，封臣贡奉源源不绝；举国赋税充盈如海，国库永世不竭。"
 trait_ultimate_intrigue_master: "万劫窥秘"
 trait_ultimate_intrigue_master_desc: "窥尽人心与暗影之网：洞察阴谋如掌中观火，自身几乎免疫敌对阴谋，出手则隐蔽无踪、十拿九稳。"
 trait_great_builder_god: "鬼斧神工"
 trait_great_builder_god_desc: "身负创世营造神通，通晓天地营造法则，凡辖内城池要塞、神庙工坊，落笔即成型，刹那拔地而起，不耗钱粮、不费时日。"
 trait_nether_conspiracy_lord: "幽冥诡主"
 trait_nether_conspiracy_lord_desc: "深谙幽冥诡道，洞悉人心权谋。行密谋如无形，藏杀机于暗夜。凡所设刺杀、构陷、离间、篡权之谋，隐蔽难窥、易于得手；旁人难以反制，自带诡道威压。"
 trait_eternal_nether_lord: "万古冥主"
 trait_eternal_nether_lord_desc: "心性坚如万古寒石，七情不动六欲不生，压力极低、心神难损；身携炼狱冥威，恐怖威压冠绝世间，群臣万民慑服；谋略深不可测，敌对阴谋难以得逞。"
 trait_the_wake: "警觉者"
 trait_the_wake_desc: "「流亡者」教育线「沼泽猎手」之终点：薄暮与湿地间令人胆寒，劫掠迅疾、沼地作战如鱼得水；诺曼文化角色对你尤为敌视。"
 trait_lifestyle_traveler: "游历行家"
 trait_lifestyle_traveler_desc: "原版分级「旅者」特质：随远行、抵达目的地与名胜等积累阅历，可分平安旅途与险途两向成长。"
 trait_child_of_concubine_female: "妾出之女"
 trait_child_of_concubine_female_desc: "生母为妾或侧室所生之女；在家族与继承语境中常与嫡出有所区分。"
 trait_child_of_concubine_male: "妾出之子"
 trait_child_of_concubine_male_desc: "生母为妾或侧室所生之子；在家族与继承语境中常与嫡出有所区分。"
 trait_hajjaj: "哈只"
 trait_shieldmaiden: "盾女"
 trait_viking: "维京勇士"
