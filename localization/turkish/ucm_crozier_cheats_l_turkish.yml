 UCM_CROZIER_CHEATS_B_perks_all_TT:0 "162 yaşam tarzı yeteneğinin hepsini bir anda açar."
 UCM_CROZIER_CHEATS_B_piety_OFF:0 "KAPALI  ·  Ayda +100 dindarlık × güç"
