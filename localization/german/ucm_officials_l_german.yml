 ucm_boost_world_ai_rulers_decision: "Alle KI-Reiche auf einmal verstärken"
 ucm_boost_world_ai_rulers_decision_desc: "Alle landbesitzenden KI-Herrscher erhalten militärische, wirtschaftliche und diplomatische Boni zur Förderung von Expansion und Kriegsführung. Wird der Spieler zu mächtig, schließen KI-Reiche Bündnisse zur Spielbalance."
