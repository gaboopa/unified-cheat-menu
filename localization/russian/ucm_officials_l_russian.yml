 ucm_one_click_strip_official_titles_decision: "Массовый отзыв титулов"
 ucm_one_click_strip_official_titles_decision_desc: "Одно нажатие запускает многократный отзыв до полной очистки: все графства, герцогства и высшие титулы внутри вашего домена перейдут к вам."
 ucm_one_click_strip_official_titles_decision_tooltip: "Отозвать все титулы в пределах ваших владений — они перейдут в ваше распоряжение."
 ucm_one_click_strip_official_titles_decision_confirm: "Подтвердить отзыв титулов"
 ucm_one_click_strip_official_titles_effect_tt: "Автоматически запускает серии изъятия титулов до тех пор, пока в вашем домене не останется доступных к возврату графств, герцогств и вышестоящих титулов. Независимые правители других государств не затрагиваются."
