 ucm_boost_world_ai_rulers_decision: "Empower All Independent AI Realms"
 ucm_boost_world_ai_rulers_decision_desc: "Bestow full military, economic and diplomatic buffs to all landed AI lords to fuel expansion and warfare. If the player becomes overwhelmingly dominant, AI nations are far more prone to form coalitions against your hegemony for balanced gameplay."
 ucm_boost_world_ai_rulers_decision_tooltip: "Global bonus not suspended. #bold No prestige cost required.#!"
 ucm_boost_world_ai_rulers_decision_confirm: "Activate Full AI Reinforcement"
 ucm_boost_world_ai_rulers_effect_tt: "All #bold landed AI rulers#! receive the Governance Support modifier lasting #bold 15#! years, gaining annual construction and men-at-arms perks throughout the duration."

 ucm_ai_yearly_admin_conversion_toggle_title_on: "#bold 【ON】#! Annual Trigger: Automatic AI Administrative Government Reform"
 ucm_ai_yearly_admin_conversion_toggle_title_off: "#bold 【OFF】#! Annual Trigger: Automatic AI Administrative Government Reform"
 ucm_ai_yearly_admin_conversion_toggle_desc_on: "Currently enabled. Requires Roads to Power (EP3). Every year, all independent landed AI plus their vassals are automatically shifted into Administrative Government. Enabled by default, separate from manual AI empowerment. Nomadic/Tribal/Steppe overlords no longer bulk-convert their vassals to prevent unintended secession. Even after disabling this toggle, enhanced vassal dues and expansion modifiers remain functional. Click to disable automatic yearly government conversion."
 ucm_ai_yearly_admin_conversion_toggle_desc_off: "Currently disabled. Annual script no longer upgrades AI realms into EP3 Administrative Government. Vassal obligation bonuses and yearly expansion buffs persist; manual government alteration is still accessible via the polity menu. Click to re-enable automated yearly reform."
 ucm_ai_yearly_admin_conversion_toggle_tooltip_on: "Active: Independent AI yearly administrative conversion (EP3 needed). Click to disable."
 ucm_ai_yearly_admin_conversion_toggle_tooltip_off: "Inactive: No automated annual government shift for AI. Click to enable."
 ucm_ai_yearly_admin_conversion_toggle_confirm_disable: "Turn Off Annual Administrative Auto-Reform"
 ucm_ai_yearly_admin_conversion_toggle_confirm_enable: "Turn On Annual Administrative Auto-Reform"
 ucm_ai_yearly_admin_conversion_toggle_effect_disabled_tt: "Disabled: Annual automated Administrative Government conversion for AI is halted."
 ucm_ai_yearly_admin_conversion_toggle_effect_enabled_tt: "Enabled: Qualified independent AI convert to Administrative Government yearly (EP3 prerequisite)."

 ucm_ai_yearly_pulse_toggle_title_on: "#bold 【ON】#! Annual Global Pulse (Master Toggle)"
 ucm_ai_yearly_pulse_toggle_title_off: "#bold 【OFF】#! Annual Global Pulse (Master Toggle)"
 ucm_ai_yearly_pulse_toggle_desc_on: "Set to enabled by default. All independent landed AI receive complete yearly pulse benefits: expansion & war modifiers, raised vassal taxation, yearly anti-hegemony coalition refresh. Sub-options: Administrative conversion default-on, De Jure vassal reshuffle default-off. First campaign year skips full pulse entirely. Master toggle off hides all sub-options and halts relevant scripts. Does not interact with monthly automatic AI buff system. Click to disable entire annual pulse system."
 ucm_ai_yearly_pulse_toggle_desc_off: "Currently disabled. Event 9200 stops firing; mod-specific yearly anti-player coalition refresh ceases (quarterly/monthly checks unaffected). Click to reactivate annual global pulse."
 ucm_ai_yearly_pulse_toggle_tooltip_on: "Default active, full annual pulse operational; click shut down master switch."
 ucm_ai_yearly_pulse_toggle_tooltip_off: "All annual pulse mechanics suspended; click to activate master switch."
 ucm_ai_yearly_pulse_toggle_confirm_disable: "Disable Annual Pulse Master Switch"
 ucm_ai_yearly_pulse_toggle_confirm_enable: "Enable Annual Pulse Master Switch"
 ucm_ai_yearly_pulse_toggle_effect_disabled_tt: "Disabled: Event 9200 and yearly anti-hegemony coalition refresh no longer execute."
 ucm_ai_yearly_pulse_toggle_effect_enabled_tt: "Enabled: Annual pulse runs following individual sub-toggle configurations."

 ucm_ai_yearly_de_jure_transfer_toggle_title_on: "#bold 【ON】#! Annual Pulse: Automated AI De Jure Vassal Reassignment"
 ucm_ai_yearly_de_jure_transfer_toggle_title_off: "#bold 【OFF】#! Annual Pulse: Automated AI De Jure Vassal Reassignment"
 ucm_ai_yearly_de_jure_transfer_toggle_desc_on: "Currently enabled. Independent AI automatically executes identical bulk de jure vassal restructuring available to player decisions once per year. Alters vanilla starting vassal layout (Hexi, Gobi etc.), disabled by default. Disabling leaves expansion buffs, tax surcharges and administrative auto-reform intact; players retain manual de jure transfer resolution. Click to disable automatic AI de jure reshuffling."
 ucm_ai_yearly_de_jure_transfer_toggle_desc_off: "Default set to disabled. Annual pulse skips AI vassal legal rearrangement to preserve original vanilla starting borders. All newly-started campaigns skip the entire first-year annual pulse. Click to enable automated de jure vassal transfer."
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_on: "Active: Independent AI auto-de jure yearly; click disable."
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_off: "Default inactive: No automated legal vassal shift; click enable."
 ucm_ai_yearly_de_jure_transfer_toggle_confirm_disable: "Turn Off Annual Automated De Jure Reassignment"
 ucm_ai_yearly_de_jure_transfer_toggle_confirm_enable: "Turn On Annual Automated De Jure Reassignment"
 ucm_ai_yearly_de_jure_transfer_toggle_effect_disabled_tt: "Disabled: Annual pulse no longer runs automated de jure vassal restructuring."
 ucm_ai_yearly_de_jure_transfer_toggle_effect_enabled_tt: "Enabled: Independent AI realms undergo yearly de jure vassal reorganization."

 ucm_ai_boost_toggle_decision_title_on: "#bold 【ON】#! Monthly Passive AI Reinforcement"
 ucm_ai_boost_toggle_decision_title_off: "#bold 【OFF】#! Monthly Passive AI Reinforcement"
 ucm_ai_boost_toggle_decision_desc_on: "Monthly automatic AI stat buffs active. Up to 600 landed AI lords receive realm bonuses radiating outward from the player’s domain every calendar month, stacking alongside manual one-click AI empowerment. Click disable."
 ucm_ai_boost_toggle_decision_desc_off: "Monthly passive AI enhancement inactive. Click enable this function, toggle again for shutdown."
 ucm_ai_boost_toggle_decision_confirm_disable: "Suspend Monthly Automatic AI Buffs"
 ucm_ai_boost_toggle_decision_confirm_enable: "Activate Monthly Automatic AI Buffs"
 ucm_ai_boost_toggle_effect_enabled_tt: "Monthly AI reinforcement active: Max 600 landed AI gain outward-radiating national perks per month."
 ucm_ai_boost_toggle_effect_disabled_tt: "Monthly AI reinforcement suspended: No further passive stat bonuses applied automatically."

 ucm_ai_realm_governance_support: "Governance Support"
 ucm_ai_realm_governance_support_desc: "Roughly 50% army upkeep reduction; drastically increased men-at-arms cap & unit size. Boosted construction speed and domain income alongside improved diplomacy and belligerent inclination. AI gains higher greed alongside reduced compassion and honor; domain limit +2. All independent realms obtain yearly expansion bonuses plus stackable surge modifiers, elevated vassal dues and EP3 administrative perks. Permanent automatic de jure vassal reassignment enabled."
 ucm_ai_expansion_push: "Yearly Expansion Surge"
 ucm_ai_expansion_push_desc: "Mod yearly modifier: ~60% faster construction, ~70% cheaper men-at-arms maintenance. Shifts AI war desire, rationality and ambition to pursue claims more readily without forcing arbitrary declarations of war."
 ucm_ai_stable_surge: "Major Annual Expansion Surge"
 ucm_ai_stable_surge_desc: "Yearly incremental boost to AI bellicosity, boldness, rationality and ambition stacking atop base expansion surge; all war declarations abide by unmodified base-game native AI logic."
 ucm_ai_counter_player_pressure: "Anti-Hegemony Coalition"
 ucm_ai_counter_player_pressure_desc: "Triggered if player owns an empire title or rules over 80+ counties: all independent AI gain temporary boosts to diplomatic range, sociability, intrigue and warlikeness to encourage alliance formation against overwhelming player dominance. Declarations of war, abductions and royal marriages follow unaltered vanilla AI calculation rules."
 ucm_ai_counter_player_pressure_heavy: "Counter Player Dominance (Heavy)"
 ucm_ai_counter_player_pressure_heavy_desc: "Your realm has exceeded a critical size threshold: all AI receive stronger diplomacy, intrigue, diplomatic range, and war/grudge weights, making alliances against a dominant player more likely. AI decisions still follow the base engine rules."
