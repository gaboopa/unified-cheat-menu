 ucm_ai_yearly_pulse_toggle_title_on: "#bold 【AN】#! Jährlicher Globalimpuls [Hauptschalter]"
 ucm_ai_yearly_pulse_toggle_title_off: "#bold 【AUS】#! Jährlicher Globalimpuls [Hauptschalter]"
 ucm_ai_yearly_pulse_toggle_desc_on: "Standardmäßig an. Jährlich erhalten alle unabhängigen KI Expansions-/Kriegsmodifikatoren, höhere Vasallabgaben und Aktualisierung der Anti-Hegemon-Bündnisse. Unteroptionen: Verwaltungsreform an, De-Jure-Vasallverschiebung aus. Erstes Jahr neuer Kampagne überspringt kompletten Impuls. Bei ausgeschaltetem Hauptschalter sind alle Untermenüs verborgen, Skripte pausiert. Unabhängig von monatlicher Auto-Verstärkung Klick zum Ausschalten"
 ucm_ai_yearly_pulse_toggle_desc_off: "Deaktiviert, Ereignis9200 pausiert, modspezifische jährliche Anti-Hegemon-Aktualisierung endet(Quartals-/Monatschecks unbetroffen). Klick zum Wiederanschalten"
 ucm_ai_yearly_pulse_toggle_tooltip_on: "Standard aktiv, Klick schaltet Hauptschalter aus"
 ucm_ai_yearly_pulse_toggle_tooltip_off: "Alle Jahresimpulse aus, Klick aktivieren"
 ucm_ai_yearly_pulse_toggle_confirm_disable: "Hauptschalter Jahresimpuls abschalten"
 ucm_ai_yearly_pulse_toggle_confirm_enable: "Hauptschalter Jahresimpuls einschalten"
 ucm_ai_yearly_pulse_toggle_effect_disabled_tt: "Deaktiviert: Ereignis9200 und jährliche Anti-Hegemon-Bündnisaktualisierung beendet"
 ucm_ai_yearly_pulse_toggle_effect_enabled_tt: "Aktiv: Jahresimpuls läuft nach Untereinstellungen"
 ucm_ai_yearly_de_jure_transfer_toggle_title_on: "#bold 【AN】#! Jährlicher Impuls: Automatische De-Jure-Vasallumverteilung der KI"
 ucm_ai_yearly_de_jure_transfer_toggle_title_off: "#bold 【AUS】#! Jährlicher Impuls: Automatische De-Jure-Vasallumverteilung der KI"
 ucm_ai_yearly_de_jure_transfer_toggle_desc_on: "Aktiv. Unabhängige KI verteilt jährlich Vasallen nach Rechtszugehörigkeit wie der Spieler. Standardmäßig aus, verändert Vanilla-Startgrenzen(Hexi,Gobi etc.) Ausgeschaltet bleiben Expansions-,Abgaben- und Verwaltungsboni erhalten, manuelle De-Jure-Verschiebung nutzbar. Klick zum Ausschalten"
 ucm_ai_yearly_de_jure_transfer_toggle_desc_off: "Standardmäßig aus Jährlicher Skript verschiebt keine Vasallen zur Erhaltung der Originalkarte. Neue Spielstände überspringen kompletten Jahresimpuls im ersten Jahr. Klick zum Einschalten"
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_on: "Aktiv: Jährliche Rechtsverteilung für KI-Vasallen, Klick ausschalten"
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_off: "Inaktiv: Keine Autoverteilung, Klick aktivieren"
