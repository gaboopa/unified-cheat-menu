 zhuge_organize_titles:0 "整顿法理"
 zhuge_organize_titles_desc:0 "奉王冠与权杖之令，所有土地和封臣都将屈膝，被编织进其领主的合法领地之内。"
 zhuge_destroy_title:0 "摧毁主要头衔"
 zhuge_buff_02:0 "大司马"
 zhuge_buff_02_desc:0 "众旗之元帅，边疆的守护者，背誓者的灾祸。一个在蜜酒厅歌谣中传唱的角色。"
 zhuge_buff_02_tt:0 "切换大司马特质？"
 zhuge_buff_04:0 "学习他们的语言"
