 ucm_treasure_maker.tier_off: "Без бонуса"
 ucm_treasure_maker.tier_1: "Уровень 1"
 ucm_treasure_maker.tier_2: "Уровень 2"
 ucm_treasure_maker.tier_3: "Уровень 3 (максимальный)"
 ucm_treasure_maker.0001.desc: "Настройте 25 характеристик, наборы модификаторов, вид и качество, затем нажмите «Создать». При выборе режима «Передать цели» артефакт получит персонаж, на которого наведён курсор.
В Crusader Kings III нет ползунков интерфейса, поэтому меню реализовано через цепочку игровых событий."
 ucm_treasure_maker_workshop: "Мастерская артефактов"
 ucm_treasure_maker_workshop_desc: "Мастерская позволяет настроить 25 характеристик, мощные модификаторы, тип и качество, а также создавать артефакты в один клик. Требуется дополнение «Королевский двор»."
 ucm_tm_artifact_name: "Чудо кузницы"
 ucm_tm_artifact_desc: "Изготовлено в мастерской артефактов. В нём сочетается сила смертных и небесное могущество."
