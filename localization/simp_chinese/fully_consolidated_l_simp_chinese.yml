 ### 来自：pcm_main_l_english.yml
 set_immortal_interaction:0 "赐予不朽"
 set_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被赐予永生，容颜永远保持在二十五岁之龄。"
 set_mortal_interaction:0 "剥夺不朽"
 set_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将从无尽生命的锁链中解脱。也许[recipient.GetSheHe]渴望坟墓的安息。"
 set_super_interaction:0 "受膏为完人"
 set_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被提升至远超凡人的境界：智慧、力量、生育力、活力、声望、财富和恐怖值无与伦比。真正是领主中的完人。"
 set_unsuper_interaction:0 "撤销完人祝福"
 set_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被剥夺所有崇高的恩赐。[recipient.GetSheHe|U] 可能会觉得这个负担非常沉重。"
 set_super_governor_interaction:0 "赐予管家之令"
 set_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被授予治理王国的大师能力：更多的征召兵、明智的管理、快速建造厅堂、繁荣昌盛以及平民的爱戴。"
 set_unsuper_governor_interaction:0 "撤销管家之令"
 set_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将失去这些治理的祝福，回归凡人的局限。"
 set_super_general_interaction:0 "祝福为战争领主"
 set_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将成为无与伦比的军队统帅：勇武、军事才能、战略和耐力无双；在战斗中令人恐惧，在围攻中迅捷无比。"
 set_unsuper_general_interaction:0 "撤销战争领主祝福"
 set_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被剥夺所有战争中的神圣眷顾，可能在曾经凯旋的地方步履蹒跚。"
 set_all_in_one_interaction:0 "加冕为典范"
 set_all_in_one_interaction_desc:0 "对于[recipient.GetShortUINameNoTooltip|U]，所有祝福皆予之：完人、管家之令、战争领主，合于一身。实乃 秘术的奇观。"
 set_unall_in_one_interaction:0 "回归凡人位阶"
 set_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将失去完人、管家和战争领主的所有恩赐，再次作为凡人行走。"

 ### 来自：pcm_traits_l_english.yml
 trait_immortality:0 "不朽"
 trait_immortality_desc:0 "此角色已分享不朽圣礼。其容颜将永葆青春，抵御自然死亡之 grasp。"
 trait_immortality_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 已蒙受不朽圣礼之祝福。[ROOT.GetCharacter.GetSheHe|U] 将永葆二十五岁之姿，亦不会屈服于自然死亡本身。"
 trait_super:0 "完人"
 trait_super_desc:0 "此角色是凡人中的完人，拥有无与伦比的属性、活力、魅力和技能，使其凌驾于所有其他人之上。"
 trait_super_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 已被尊为完人，被赋予无穷的力量、智慧和声望。"
 trait_super_governor:0 "奇迹管家"
 trait_super_governor_desc:0 "此角色以近乎神圣的智慧进行治理。其土地繁荣，城镇兴旺，秩序至上，如同受天手触摸。"
 trait_super_governor_character_desc:0 "在[ROOT.GetCharacter.GetFirstNameNoTooltip]的统治下，王国欣欣向荣，田野丰收，甚至最卑微的农民也祝福其管家的名字。"
 trait_super_general:0 "受膏战争领主"
 trait_super_general_desc:0 "此角色领导军队如同受命运之手指引。其军队以不可动摇的勇气战斗，并取得一个又一个胜利。"
 trait_super_general_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 以无与伦比的天才指挥军队，敌人畏惧，士兵崇敬，带领每支军队走向胜利。"

