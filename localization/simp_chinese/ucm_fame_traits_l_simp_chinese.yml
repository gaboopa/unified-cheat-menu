l_simp_chinese:
 trait_ucm_fame_warlord_eternal: "万古军主"
 trait_ucm_fame_warlord_eternal_desc: "穷极一世的治军巅峰，麾下士卒皆为百战精锐，贵族骑士悍勇无双。大军行战近似无视地形桎梏、行军如飞，征伐四海无往不利，凡所至之处，万军辟易。"
 trait_ucm_fame_wealth_sovereign_max: "万财帝君"
 trait_ucm_fame_wealth_sovereign_max_desc: "执掌天地财权，掌控大陆所有商路与税源。万物生息皆为己用：领地税收与总收入暴涨，封臣贡奉源源不绝；举国赋税充盈如海，国库永世不竭。"
 trait_ucm_fame_ultimate_intrigue_master: "万劫窥秘"
 trait_ucm_fame_ultimate_intrigue_master_desc: "窥尽人心与暗影之网：洞察阴谋如掌中观火，自身几乎免疫敌对阴谋，出手则隐蔽无踪、十拿九稳。"
 trait_ucm_fame_nether_conspiracy_lord: "幽冥诡主"
 trait_ucm_fame_nether_conspiracy_lord_desc: "深谙幽冥诡道，洞悉人心权谋。行密谋如无形，藏杀机于暗夜。凡所设刺杀、构陷、离间、篡权之谋，隐蔽难窥、易于得手；旁人难以反制，自带诡道威压。"
 trait_ucm_fame_eternal_nether_lord: "万古冥主"
 trait_ucm_fame_eternal_nether_lord_desc: "心性坚如万古寒石，七情不动六欲不生，压力极低、心神难损；身携炼狱冥威，恐怖威压冠绝世间，群臣万民慑服；谋略深不可测，敌对阴谋难以得逞。"
 trait_ucm_fame_great_builder_god: "鬼斧神工"
 trait_ucm_fame_great_builder_god_desc: "身负创世营造神通，通晓天地营造法则，凡辖内城池要塞、神庙工坊，落笔即成型，刹那拔地而起，不耗钱粮、不费时日。"
