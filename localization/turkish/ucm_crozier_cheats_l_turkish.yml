 UCM_CROZIER_CHEATS_B_piety_add_TT:0 "Dindarlık ekler.\nMiktar, Hileleri'nin üst kısmındaki Miktarlar ayarına bağlıdır: Düşük 1.000, Orta 10.000, Yüksek 100.000."
