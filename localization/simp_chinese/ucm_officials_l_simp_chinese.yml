 ucm_ai_yearly_admin_conversion_toggle_title_on: "#bold 【已开启】#! 年脉冲：AI自动改行政制"
 ucm_ai_yearly_admin_conversion_toggle_title_off: "#bold 【已关闭】#! 年脉冲：AI自动改行政制"
 ucm_ai_yearly_admin_conversion_toggle_desc_on: "当前#bold 已开启#!：每年会对#bold 独立且有领地的AI领主#!生效。已安装《权力之路》扩展后，将自动把领主及其封臣改为#bold 行政制#!。#weak 新局默认关闭，以免开局两三年内全世界被刷成行政制；天朝/贤能等 TGP 政体不会被批量降级。#!游牧、部落、牧民宗主不会批量改封臣政体。\n\n关闭后，封臣义务提升、扩张与作战加成仍照常。\n\n点击即可#bold 关闭#!。"
 ucm_ai_yearly_admin_conversion_toggle_desc_off: "当前#bold 已关闭#!（#bold 新局默认#!）：年脉冲不会自动把AI领主改为行政制，有利于保持信仰之剑等原版开局版图。\n\n封臣义务提升、扩张与作战加成不受影响；你仍可在「政体调整」里手动改政体。\n\n点击即可#bold 重新开启#!。"
 ucm_ai_yearly_admin_conversion_toggle_tooltip_on: "已开启：每年自动把独立AI领主改为行政制（需《权力之路》扩展）。点击关闭。"
 ucm_ai_yearly_admin_conversion_toggle_tooltip_off: "已关闭：不再自动改AI政体。点击开启。"
 ucm_ai_yearly_admin_conversion_toggle_confirm_disable: "关闭自动改行政制"
 ucm_ai_yearly_admin_conversion_toggle_confirm_enable: "开启自动改行政制"
 ucm_ai_yearly_admin_conversion_toggle_effect_disabled_tt: "点击后将#bold 关闭#!：不再自动把AI领主改为行政制。"
 ucm_ai_yearly_admin_conversion_toggle_effect_enabled_tt: "点击后将#bold 开启#!：符合条件的独立AI领主会被改为行政制（需《权力之路》扩展）。"

 ucm_ai_yearly_pulse_toggle_title_on: "#bold 【已开启】#! 年脉冲（总开关）"
 ucm_ai_yearly_pulse_toggle_title_off: "#bold 【已关闭】#! 年脉冲（总开关）"
 ucm_ai_yearly_pulse_toggle_desc_on: "当前#bold 已开启#!：每年对#bold 独立且有领地的AI领主#!自动执行一轮强化，包括：\n· 常备扩张加成：建造更快、维护更省，更爱动手打仗\n· 扩张猛攻：好战与行动力逐年加强\n· 封臣义务提高：进贡与出兵要求上调\n· 制衡玩家：你太强时，AI更倾向联手对付你（每年刷新）\n· 自动改行政（#bold 新局默认关#!，需《权力之路》扩展）\n· 自动法理转封（#bold 新局默认关#!，可单独开启）\n\n新开局#bold 第一年#!整段不执行；天朝总督轮换亦首年跳过。关闭总开关后，上述效果全部停止，下面两个分项也会隐藏。#weak 与「AI强化（月度）」不是同一个功能。#!\n\n点击即可#bold 关闭#!。"
 ucm_ai_yearly_pulse_toggle_desc_off: "当前#bold 已关闭#!（#bold 新局默认#!）：上述整套年脉冲效果都不再执行；「AI联手对付玩家」的每年刷新也会停（#weak 每月仍可能有类似效果#!）。AI不会被年脉冲改义务、改政体或转封，最容易保持原版开局地图。\n\n点击即可#bold 重新开启#!。"
 ucm_ai_yearly_pulse_toggle_tooltip_on: "已开启：年脉冲生效。点击关闭总开关。"
 ucm_ai_yearly_pulse_toggle_tooltip_off: "已关闭：年脉冲全部停止。点击开启。"
 ucm_ai_yearly_pulse_toggle_confirm_disable: "关闭年脉冲总开关"
 ucm_ai_yearly_pulse_toggle_confirm_enable: "开启年脉冲总开关"
 ucm_ai_yearly_pulse_toggle_effect_disabled_tt: "点击后将#bold 关闭#!，不再执行：常备扩张加成、扩张猛攻、封臣义务提高、制衡玩家刷新、自动改行政、自动法理转封。"
 ucm_ai_yearly_pulse_toggle_effect_enabled_tt: "点击后将#bold 开启#!，每年对独立有地AI执行：常备扩张加成、扩张猛攻、封臣义务提高、制衡玩家刷新；自动改行政、自动法理转封需再单独开启（新局默认均关）。"

 ucm_ai_yearly_de_jure_transfer_toggle_title_on: "#bold 【已开启】#! 年脉冲：AI自动法理转封"
 ucm_ai_yearly_de_jure_transfer_toggle_title_off: "#bold 【已关闭】#! 年脉冲：AI自动法理转封"
 ucm_ai_yearly_de_jure_transfer_toggle_desc_on: "当前#bold 已开启#!：每年按#bold 法理归属#!把AI领主的封臣往上归并，效果与决议「法理转封」相同。#weak 容易改掉原版开局安排（如河西、戈壁一带），默认关闭。#!\n\n关闭后仍保留：扩张与作战加成、封臣义务提升、（可选）自动改行政。你仍可手动点「法理转封」。\n\n点击即可#bold 关闭#!。"
 ucm_ai_yearly_de_jure_transfer_toggle_desc_off: "当前#bold 已关闭#!（#bold 默认#!）：不会自动整理AI封臣归属，有利于保持原版开局地图。\n\n新开局#bold 第一年#!整段年脉冲也不执行，避免一进游戏就改图。\n\n点击即可#bold 开启#!。"
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_on: "已开启：每年自动为AI领主法理转封。点击关闭。"
 ucm_ai_yearly_de_jure_transfer_toggle_tooltip_off: "已关闭（默认）：不自动转封。点击开启。"
 ucm_ai_yearly_de_jure_transfer_toggle_confirm_disable: "关闭自动法理转封"
 ucm_ai_yearly_de_jure_transfer_toggle_confirm_enable: "开启自动法理转封"
 ucm_ai_yearly_de_jure_transfer_toggle_effect_disabled_tt: "点击后将#bold 关闭#!：不再自动法理转封。"
 ucm_ai_yearly_de_jure_transfer_toggle_effect_enabled_tt: "点击后将#bold 开启#!：每年对独立AI领主执行法理转封。"

 ucm_ai_boost_toggle_decision_title_on: "#bold 【已开启】#! AI强化（月度自动）"
 ucm_ai_boost_toggle_decision_title_off: "#bold 【已关闭】#! AI强化（月度自动）"
 ucm_ai_boost_toggle_decision_desc_on: "当前#bold 已开启#!：每月自动向有地 AI 发放「国政支援」加成（直辖+2、收入+40%、常备上限等），优先从你领地向外扩散。\n\n玩家版图过大时，AI 还会额外获得制衡倾向。点击可关闭。"
 ucm_ai_boost_toggle_decision_desc_off: "当前#bold 已关闭#!（#bold 新局默认#!）：不再自动发放国政支援。开启后会#bold 立即#!补发一批，之后每月继续扩散。\n\n#weak 与「年脉冲（总开关）」不是同一个功能；年脉冲亦默认关，首年跳过。#!\n\n点击可开启。"
 ucm_ai_boost_toggle_decision_confirm_disable: "关闭AI强化"
 ucm_ai_boost_toggle_decision_confirm_enable: "开启AI强化"
 ucm_ai_boost_toggle_effect_enabled_tt: "点击后将#bold 开启#! AI强化：每月自动强化600名AI，效果从玩家领地向外逐步扩散。"
 ucm_ai_boost_toggle_effect_disabled_tt: "点击后将#bold 关闭#! AI强化：不再执行自动强化。"

 ucm_ai_realm_governance_support: "吏治民力支援"
 ucm_ai_realm_governance_support_desc: "全面强化AI内政与军事经济，提升决策与宣战倾向。AI贪婪性格增强，怜悯、荣誉属性降低，更易横征暴敛；直辖领地上限+2。AI每年叠加常备军增益、作战强化效果，同时提升封臣义务，满足条件时推行EP3行政制。"

 ucm_ai_expansion_push: "扩张脉冲（常备军）"
 ucm_ai_expansion_push_desc: "年度增益效果：建造速度提升约60%，常备军维护费降低约70%。小幅提升开战意愿与行动力，改善AI持有宣称却消极不动的问题，不会强制宣战。"

 ucm_ai_stable_surge: "扩张猛攻（逐年叠加）"
 ucm_ai_stable_surge_desc: "每年叠加效果，大幅提升开战概率、行事魄力、决策能力与行动力，AI仍由游戏引擎自主判断是否宣战。"

 ucm_ai_counter_player_pressure: "反制玩家势力"
 ucm_ai_counter_player_pressure_desc: "检测到玩家领地达到80块及以上伯爵领（或持有帝国头衔）时，全体AI临时获得加强加成：外交+4、谋略+5、外交距离+35%、开战与结盟权重上调。若辖境≥120郡（或帝国且≥100郡），则升级为更强一档（外交+6、谋略+7、距离+50%）。AI行为仍由引擎自主判定。"
 ucm_ai_counter_player_pressure_heavy: "反制玩家势力（重压）"
 ucm_ai_counter_player_pressure_heavy_desc: "玩家版图已超临界规模：全体AI获得更高外交、谋略、外交距离与开战/记仇权重，更易拉同盟与针对强势玩家。AI行为仍由引擎自主判定。"
