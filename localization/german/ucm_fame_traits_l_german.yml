l_german:
 trait_ucm_fame_warlord_eternal: "Ewiger Kriegsherr"
 trait_ucm_fame_warlord_eternal_desc: "Ein Meister der Kriegsführung. Ihre Truppen sind kampferprobt, Ritter verbreiten Angst und Ihre Streitkräfte sind unaufhaltsam. Geländebedingungen behindern Sie nicht."
 trait_ucm_fame_wealth_sovereign_max: "Herrscher des Reichtums"
 trait_ucm_fame_wealth_sovereign_max_desc: "Meister von Handel und Finanzen. Steuereinnahmen und Vasallenabgaben steigen stark an, Ihre Schatzkammer geht niemals leer."
 trait_ucm_fame_ultimate_intrigue_master: "Meister der Geheimnisse"
 trait_ucm_fame_ultimate_intrigue_master_desc: "Ein unvergleichlicher Meister der Schatten. Feindliche Intrigen scheitern gegen Sie, Ihre eigenen Machenschaften bleiben unentdeckt und gelingen garantiert."
 trait_ucm_fame_nether_conspiracy_lord: "Herr der Verschwörungen"
 trait_ucm_fame_nether_conspiracy_lord_desc: "Meister der hinterlistigen Intrigen. Feindliche Pläne geraten ins Stocken, Ihr Angstwert steigt und die Hofmeinung neigt sich Ihnen zu."
 trait_ucm_fame_eternal_nether_lord: "Ewiger Schattenherr"
 trait_ucm_fame_eternal_nether_lord_desc: "Ein eiserner Wille durch die Zeitalter. Stress berührt Sie kaum, Ihre Intrigen sind übermächtig, Feinde scheitern gegen Sie und Vasallen sowie Höflinge ehren Sie zutiefst."
 trait_ucm_fame_great_builder_god: "Göttlicher Baumeister"
 trait_ucm_fame_great_builder_god_desc: "Unübertroffene Baukunst. Gebäude und Betriebe im Reich werden mit minimalen Kosten und Zeitaufwand erbaut. Verwaltung, Steuern, Prestige, Entwicklung und Befestigungen werden stark gestärkt."
