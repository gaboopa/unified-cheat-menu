 ucm_officials.9083.t: "Мировая очистка безземельных"
 ucm_officials.9083.desc: "Безопасно удаляет неиспользуемых странников ИИ из пула персонажей. Каждые три дня обрабатывается не более 25 персонажей. Придворные, гости, правители, авантюристы и ваша защищённая семья не затрагиваются. Одновременно может выполняться только одна очистка."
