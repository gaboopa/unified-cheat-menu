l_german:







  individual_marry_exempt:0 "Charakter ausnehmen"
  individual_marry_exempt_desc:0 "Markiert einen einzelnen Charakter, sodass er bei automatischen Ehe- oder Konkubinenregelungen übersprungen wird. Ein Modifikator kennzeichnet diese Ausnahme."

  males_marry_dynasty:0 "Dynastiemänner werden verheiratet"
  males_marry_dynasty_desc:0 "Die Männer dieser Dynastie werden einmal pro Jahr automatisch vom System verheiratet."

  females_marry_dynasty:0 "Dynastiefrauen werden verheiratet"
  females_marry_dynasty_desc:0 "Die Frauen dieser Dynastie werden einmal pro Jahr automatisch in matrilinearen Ehen verheiratet."

  inbreed_marry_dynasty:0 "Dynastie mit Verwandtenehen"
  inbreed_marry_dynasty_desc:0 "Diese Dynastie fördert Ehen unter nahen Verwandten und bevorzugt Verbindungen zwischen Geschwistern, Cousins und Cousinen oder Onkeln bzw. Tanten und Nichten bzw. Neffen."

  males_concubine_dynasty:0 "Dynastiemänner mit Konkubinen"
  males_concubine_dynasty_desc:0 "Die Männer dieser Dynastie erhalten automatisch Konkubinen, sofern Glauben und Gesetze dies erlauben."

  females_concubine_dynasty:0 "Dynastiefrauen mit Konkubinen"
  females_concubine_dynasty_desc:0 "Die Frauen dieser Dynastie erhalten automatisch Konkubinen, soweit Glaube und Brauchtum dies zulassen."

  males_marry_house:0 "Hausmänner werden verheiratet"
  males_marry_house_desc:0 "Die Männer dieses Hauses werden einmal pro Jahr automatisch verheiratet."

  females_marry_house:0 "Hausfrauen werden verheiratet"
  females_marry_house_desc:0 "Die Frauen dieses Hauses werden einmal pro Jahr automatisch in matrilinearen Ehen verheiratet."

  inbreed_marry_house:0 "Haus mit Verwandtenehen"
  inbreed_marry_house_desc:0 "Dieses Haus arrangiert Ehen unter nahen Verwandten, um die Blutlinie gezielt zu stärken."

  males_concubine_house:0 "Hausmänner mit Konkubinen"
  males_concubine_house_desc:0 "Die Männer dieses Hauses erhalten automatisch Konkubinen."

  females_concubine_house:0 "Hausfrauen mit Konkubinen"
  females_concubine_house_desc:0 "Die Frauen dieses Hauses erhalten automatisch Konkubinen, soweit dies durch die Traditionen erlaubt ist."



  males_eugenic_dynasty:0 "Dynastie verfolgt männliche Eugenik"
  males_eugenic_dynasty_desc:0 "Diese Dynastie arrangiert Ehen für ihre Männer mit dem Ziel, starke und reinblütige Nachkommen hervorzubringen."

  females_eugenic_dynasty:0 "Dynastie verfolgt weibliche Eugenik"
  females_eugenic_dynasty_desc:0 "Diese Dynastie arrangiert Ehen für ihre Frauen mit dem Ziel, starke und reinblütige Nachkommen hervorzubringen."

  males_eugenic_house:0 "Haus verfolgt männliche Eugenik"
  males_eugenic_house_desc:0 "Dieses Haus arrangiert Ehen für seine Männer, um die Reinheit und Stärke der Blutlinie zu fördern."

  females_eugenic_house:0 "Haus verfolgt weibliche Eugenik"
  females_eugenic_house_desc:0 "Dieses Haus arrangiert Ehen für seine Frauen, um die Reinheit und Stärke der Blutlinie zu fördern."