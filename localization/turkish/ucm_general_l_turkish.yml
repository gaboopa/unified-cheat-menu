 trait_bloodline_god_1:0 "Barbara'nın Ruh Kanı"
 trait_bloodline_god_1_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] Barbara ilahi soyunun kalıntılarını taşıyor."
