l_german:
 UCM_SEC_TARGET_SUCCESSION: "Nachfolgegesetze des Ziels"
 ucm_law_note: "Gewählte Gesetze werden gesperrt: Das Ziel behält sie unabhängig von Glaube, Kultur oder Innovationen, und der Erbe übernimmt die Sperre."
 ucm_law_include_vassals: "Vasallen einbeziehen"
 ucm_law_include_vassals_tt: "Solange aktiv, gilt eine Gesetzeswahl auch für jeden geeigneten Vasallen des Ziels."
 ucm_law_pick_tt: "Dieses Gesetz für das Ziel (und ggf. Vasallen) festlegen und sperren."
 ucm_law_unlock: "Gesetzessperren aufheben"
 ucm_law_unlock_tt: "Die Gesetze des Ziels nicht mehr sperren. Das Spiel kann dann Gesetze ändern, die es normalerweise nicht behalten darf."
 ucm_holding_capital_tt: "Die Besitzart der Hauptstadtbaronie des Ziels ändern."
 ucm_holding_realm_tt: "Die Besitzart der eigenen Baronien des Ziels und jener seiner Baron-Vasallen ändern."
 ucm_realm_max_buildings: "Reichsgebäude ausbauen"
 ucm_realm_max_buildings_tt: "Jedes Gebäude im Reich des Ziels um eine Stufe erhöhen. Für die nächste Stufe erneut klicken."
 ucm_realm_building_slots: "Reichs-Gebäudeplätze hinzufügen"
 ucm_realm_building_slots_tt: "Jedem Besitz im Reich des Ziels einen dauerhaften Gebäudeplatz hinzufügen."
 ucm_cure_illness: "Krankheit & Wunden heilen (Familie, Vasallen)"
 ucm_cure_illness_tt: "Krankheits- und Verletzungsmerkmale von Ziel, Vasallen, Kindern, Ehepartnern und Haus entfernen."
 ucm_cure_congenital: "Erbfehler entfernen (Familie, Vasallen)"
 ucm_cure_congenital_tt: "Inzucht und Erbfehler von Ziel, Vasallen, Kindern, Ehepartnern und Haus entfernen."
 ucm_dynasty_pope: "Heilige Dynastie: Pontifizes"
 ucm_dynasty_pope_tt: "Der Dynastie des Ziels den dauerhaften Frömmigkeits- und Glaubensmeinungsbonus geben."
 ucm_dynasty_grandmaster: "Heilige Dynastie: Großmeister"
 ucm_dynasty_grandmaster_tt: "Der Dynastie des Ziels den dauerhaften Kampfkraft- und Ordensbonus geben."
 ucm_oligarchic_elective_succession_law: "Oligarchische Wahl"
 ucm_oligarchic_elective_succession_law_effects: "Der [ruler|E] und die [powerful_vassals|E] wählen den [title_heir|E] aus diesen Vasallen und der [close_family|E] des Herrschers."
 ucm_peasant_elective_succession_law: "Volkswahl"
 ucm_peasant_elective_succession_law_effects: "Der [ruler|E] und direkte [vassals|E] über Baronen wählen den [title_heir|E]. Stimmen richten sich nach [development|E] und [county_opinion|E]."
 ucm_theocratic_elective_succession_law: "Fromme Wahl"
 ucm_theocratic_elective_succession_law_effects: "Der Inhaber und [de_jure|E]-[vassals|E] wählen den [title_heir|E]. Rang, Frömmigkeit und Tugenden geben Stimmen. Der Erbe wird zur Theokratie."
