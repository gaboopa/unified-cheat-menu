 ucm_adopted_son_interaction: "Zur Adoption aufnehmen (Dynastie & Haus)"
 ucm_adopted_son_interaction_desc: "Cheat-Funktion: Macht die Person zu Ihrem Kind (Vater bei Männern, Mutter bei Frauen), überführt sie in Ihr Haus und entfernt Bastard-Merkmale. Sie müssen einem Haus angehören. Nicht nutzbar bei Ehepartnern, eigenen Kindern oder Eltern. Falls die Person gleich alt oder älter ist, wird das Alter temporär angepasst, um die Elternbindung herzustellen, danach wiederhergestellt."
 ucm_cheat_menu_same_house_interaction: "In dasselbe Haus überführen"
 ucm_cheat_menu_same_house_interaction_desc: "Überführt die Person in Ihre Dynastie und Ihr Haus, ohne die Elternverhältnisse zu ändern. Sie müssen einer Dynastie und einem Haus angehören. Versteckt, falls die Person bereits zu Ihrem Haus gehört."
