l_english:
 ucm_clavius_grail_name:0 "Grail of the Eternal Sentinel"
 ucm_clavius_grail_description:0 "The cup entrusted to Tribune Clavius Aquila, its humble origins hidden beneath the offerings of countless generations. Before his long watch ended, Clavius placed it in the hands of his successor. It is a pledge to guard the living with the patience of one whom death can no longer hurry."
 ucm_clavius_grail_modifier:0 "Clavius's Last Charge"
 ucm_clavius_grail_modifier_desc:0 "The Tribune's cup calls its keeper to wisdom, devotion, and justice toward every subject."
 ucm_clavius_handover_memory:0 "Clavius's Last Watch"
 ucm_clavius_handover_memory_desc:0 "I drank from Clavius Aquila's Grail and accepted his charge as the Eternal Sentinel. At last, the Tribune's long watch ended."
 ucm_clavius_handover_memory_desc_second_perspective:0 "You drank from Clavius Aquila's Grail and accepted his charge as the Eternal Sentinel. At last, the Tribune's long watch ended."
 ucm_clavius_handover_memory_desc_third_perspective:0 "This character drank from Clavius Aquila's Grail and accepted his charge as the Eternal Sentinel. At last, the Tribune's long watch ended."
