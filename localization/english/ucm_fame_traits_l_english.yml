l_english:
 trait_ucm_fame_warlord_eternal: "Eternal Warlord"
 trait_ucm_fame_warlord_eternal_desc: "A master of warfare. Troops fight harder, movement speed is greatly increased, terrain penalties are negated, and sieges end swiftly."
 trait_ucm_fame_wealth_sovereign_max: "Wealth Sovereign"
 trait_ucm_fame_wealth_sovereign_max_desc: "Master of commerce and taxation. Income, vassal contributions and treasury reserves are vastly improved."
 trait_ucm_fame_ultimate_intrigue_master: "Mystic Seer"
 trait_ucm_fame_ultimate_intrigue_master_desc: "Unmatched in shadowy plots. Enemy schemes against you fail easily, while your own plots remain hidden and nearly guaranteed to succeed."
 trait_ucm_fame_nether_conspiracy_lord: "Nether Conspiracy Lord"
 trait_ucm_fame_nether_conspiracy_lord_desc: "A grand master of intrigue. Your plots are stealthier and more effective, while enemy plots are slowed and weakened. Dread rises and court opinion leans in your favor."
 trait_ucm_fame_eternal_nether_lord: "Eternal Nether Lord"
 trait_ucm_fame_eternal_nether_lord_desc: "An undying presence of shadow. Stress has little effect, dread is immense, intrigue power is heightened. Hostile plots rarely succeed, and vassals and courtiers hold you in awe."
 trait_ucm_fame_great_builder_god: "Divine Builder"
 trait_ucm_fame_great_builder_god_desc: "Supreme mastery of construction. Realm buildings and holdings are built for minimal cost and time. Stewardship, taxes, development, fortifications and levies all receive massive boosts."
