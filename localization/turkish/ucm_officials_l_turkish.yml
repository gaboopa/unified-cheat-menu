 ucm_seduce_shield_for_consorts_decision_desc_on: "Etkin. Eşlerini yalnızca sen baştan çıkarabilirsin, onlar da kimseyi çıkaramaz; yapay zekâ karakterleri baştan çıkaramaz, kur yapamaz, kaçamaz. Hanendeki aşk ve kaçırma entrikaları her gün biter, eşlerin iffetli ve sadık kalır. Kapatmak için tıkla."
 ucm_seduce_shield_for_consorts_decision_desc_off: "Etkin değil. Eşlerini baştan çıkarmadan korumak ve yapay zekâ aşk entrikalarını durdurmak için aç."
 ucm_seduce_shield_for_consorts_decision_confirm_disable: "Kapat"
 ucm_seduce_shield_for_consorts_decision_confirm_enable: "Aç"
 ucm_ai_realm_governance_support_desc: "Yarı ordu bakımı, çok daha fazla ve büyük ağır asker, hızlı inşa, daha çok alan geliri, +2 alan sınırı, daha açgözlü ve onursuz yapay zekâ, otomatik de jure vasal düzeni."
 ucm_de_jure_transfer_batch_complete_toast_desc: "Vasalların artık ana unvanının de jure zincirini izliyor. Mülk bölünmedi."
