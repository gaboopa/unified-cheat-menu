  daddy_pika_information:0 "Unified Cheat Menu"
  information_desc:0 "适用于 CK3 1.20 的 Unified Cheat Menu。右键点击任意人物并选择“打开作弊菜单”。仅限单人游戏。"
  information_TT:0 "点击查看 Unified Cheat Menu 的信息。"
  dp_information.changelog.t:0 "Unified Cheat Menu"
  dp_information.changelog.d:0 "适用于 CK3 1.20 Crozier：仪轨与信条系统、新的法律与选举格式，以及 By God Alone 的互动菜单。"
  dp_information.useful_tips.t:0 "实用提示"
  dp_information.useful_tips.d:0 "功能菜单\n- 单击添加，再次单击移除。\n- 如果某个功能没有出现，并不意味着模组损坏；这可能是 Paradox 的硬编码覆盖所致。\n- 由于 DLC 因素，某些互动可能不会出现在特定角色上。\n- 骑士血统特质在新游戏开始时以少量随机添加，以赋予随机 NPC 有趣的属性。如果大家不习惯，我会将其移除。\n- 如果你需要降级游戏版本，此模组也支持旧版游戏。"
  dp_information.locations.t:0 "报告问题"
  dp_information.locations.d:0 "出现问题时，请记下点击了什么、发生了什么以及预期结果，并保留 Documents/Paradox Interactive/Crusader Kings III/logs/error.log 中的相关行。"

