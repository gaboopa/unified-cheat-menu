 trait_blood_ancester_4:0 "Ay Işığı"
 trait_blood_ancester_4_desc:0 "Bu karakter, soyunu Gümüş Ay tarafından kutsanmış efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: ay ışığı kadar akışkan bir berraklık."
