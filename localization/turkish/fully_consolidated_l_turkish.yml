 trait_blood_ancester_6:0 "Karanlık Gece"
 trait_blood_ancester_6_desc:0 "Bu karakter, soyunu Gece Lordu tarafından kutsanmış efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: gölgenin her yerdeliği."
 trait_blood_ancester_6_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], soyunu Gece Lordu tarafından kutsanmış efsanevi bir şövalyeye dayandırır. Damarlarında akan kan, o atanın gücünü yankılar."
 trait_blood_ancester_8:0 "Venüs"
 trait_blood_ancester_8_desc:0 "Bu karakter, soyunu karanlıkta ışık arayan ve umutsuzluğa karşı dimdik duran efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: yıkımın ortasında umut."
 trait_blood_ancester_8_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], soyunu karanlıkta ışık arayan efsanevi bir şövalyeye dayandırır. Damarlarında akan kan, o atanın gücünü yankılar."
 trait_blood_ancester_9:0 "Soytarı"
 trait_blood_ancester_9_desc:0 "Bu karakter, soyunu dünya tarafından kandırılmış ancak misyonunu gülümsemeler getirmek olarak belirlemiş efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: aşkın alaycılığı."
 trait_blood_ancester_9_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], soyunu dünya tarafından kandırılmış ancak gülümsemeyi seçmiş efsanevi bir şövalyeye dayandırır. Damarlarında akan kan, o atanın gücünü yankılar."
 trait_blood_ancester_10:0 "Kuzgun"
 trait_blood_ancester_10_desc:0 "Bu karakter, soyunu ölümü öngörmek için bilgelik kuşuna dua eden efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: felaket yoluyla gelen bilgelik."
 trait_blood_ancester_10_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], soyunu bilgelik kuşuna dua eden efsanevi bir şövalyeye dayandırır. Damarlarında akan kan, o atanın gücünü yankılar."
 trait_blood_ancester_11:0 "Gümüş Ejderha"
 trait_blood_ancester_11_desc:0 "Bu karakter, soyunu Büyük Gümüş Ejderha'ya karşı bir tabu işleyen efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: ejderha nefesi."
 trait_blood_ancester_11_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], soyunu Büyük Gümüş Ejderha'ya karşı bir tabu işleyen efsanevi bir şövalyeye dayandırır. Damarlarında akan kan, o atanın gücünü yankılar."
 trait_blood_art_1:0 "Taiji"
 trait_blood_art_1_desc:0 "Bu karakter doğumundan beri büyükbabasından derinlemesine etkilenmiş, gözlem ve pratik yoluyla Uzak Doğu'dan harika bir fiziksel teknik öğrenmiştir: Taiji."
 trait_blood_art_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], doğumundan beri büyükbabasından derinlemesine etkilenmiş, Uzak Doğu'dan harika bir fiziksel teknik öğrenmiştir: Taiji."
 trait_blood_knight_1:0 "Şövalye Yaveri"
 trait_blood_knight_1_desc:0 "Çaba, sebat, inanç ve biraz da şansla bu karakter soyunu uyandırdı ve bir Şövalye Yaveri oldu."
 trait_blood_knight_1_character_desc:0 "Çaba, sebat, inanç ve biraz da şansla [ROOT.GetCharacter.GetFirstNameNoTooltip] soyunu uyandırdı ve bir Şövalye Yaveri oldu."
 trait_blood_knight_2:0 "Resmi Şövalye"
 trait_blood_knight_2_desc:0 "Durmak bilmeyen çabalardan sonra bu karakter başarıyla güç yoluna girdi ve Resmi bir Şövalye oldu."
 trait_blood_knight_2_character_desc:0 "Durmak bilmeyen çabalardan sonra [ROOT.GetCharacter.GetFirstNameNoTooltip] başarıyla güç yoluna girdi ve Resmi bir Şövalye oldu."
 trait_blood_knight_3:0 "Usta Şövalye"
 trait_blood_knight_3_desc:0 "Yetenek, sıkı çalışma ve kaderle kutsanan bu karakter, kanının bahşettiği güce hakim oldu ve bir Usta Şövalye oldu."
 trait_blood_knight_3_character_desc:0 "Yetenek, sıkı çalışma ve kaderle kutsanan [ROOT.GetCharacter.GetFirstNameNoTooltip], kanının bahşettiği güce hakim oldu ve bir Usta Şövalye oldu."
 trait_blood_knight_4:0 "Gök Şövalyesi"
 trait_blood_knight_4_desc:0 "Bu karakter dünyayı fethetti, gökyüzünü fethetti ve en önemlisi kendini fethetti. İnsan gücünün zirvesinde duruyorlar."
 trait_blood_knight_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] dünyayı, gökyüzünü ve kendini fethetti, insan gücünün zirvesinde duruyor."
