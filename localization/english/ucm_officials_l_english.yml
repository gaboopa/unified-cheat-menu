 ucm_trait_immortal_ageless: "Ageless Immortal"
 ucm_trait_immortal_ageless_desc: "Time cannot touch you. You do not age, cannot become infirm, possess strong disease resistance, and are nearly immune to murder and hostile plots."
 ucm_trait_yannian_dan: "Longevity Elixir"
 ucm_trait_yannian_dan_desc: "A potent elixir that preserves youth, extends lifespan and wards off illness."
 ucm_trait_yannian_dan_mid: "Refined Longevity Elixir"
 ucm_trait_yannian_dan_mid_desc: "A refined elixir that preserves youth, greatly extends lifespan and wards off illness."
 ucm_trait_yannian_dan_best: "Supreme Longevity Elixir"
 ucm_trait_yannian_dan_best_desc: "A peerless elixir that defies mortal aging, grants an extended life and full protection from sickness."
 ucm_trait_baidubuqin: "Poison Immunity"
 ucm_trait_baidubuqin_desc: "Immune to disease and plague. All existing illnesses are cured upon gaining this trait."
 ucm_trait_xinwuguai: "Peace of Mind"
 ucm_trait_xinwuguai_desc: "Your mind is free of burden. Stress remains at zero and accumulates almost never. All current stress is removed when obtained."
 ucm_trait_marriage_ban: "Marriage Restricted"
 ucm_trait_marriage_ban_desc: "Cannot marry or be betrothed. All existing marriages and betrothals are dissolved. Toggle this trait again to remove the restriction."
 ucm_trait_stats_100_locked: "Maxed Attributes (Locked)"
 ucm_trait_stats_100_locked_desc: "All core attributes and Prowess are locked at 100. No event, aging or effect can alter them."

 trait_ucm_cheat_menu: "Special Trait"
 trait_warlord_eternal: "Eternal Warlord"
 trait_warlord_eternal_desc: "A master of warfare. Troops fight harder, movement speed is greatly increased, terrain penalties are negated, and sieges end swiftly."
 trait_wealth_sovereign_max: "Wealth Sovereign"
 trait_wealth_sovereign_max_desc: "Master of commerce and taxation. Income, vassal contributions and treasury reserves are vastly improved."
 trait_ultimate_intrigue_master: "Mystic Seer"
 trait_ultimate_intrigue_master_desc: "Unmatched in shadowy plots. Enemy schemes against you fail easily, while your own plots remain hidden and nearly guaranteed to succeed."
 trait_great_builder_god: "Divine Builder"
 trait_great_builder_god_desc: "Supreme mastery of construction. Realm buildings and holdings are built for minimal cost and time. Stewardship, taxes, development, fortifications and levies all receive massive boosts."
 trait_nether_conspiracy_lord: "Nether Conspiracy Lord"
 trait_nether_conspiracy_lord_desc: "A grand master of intrigue. Your plots are stealthier and more effective, while enemy plots are slowed and weakened. Dread rises and court opinion leans in your favor."
 trait_eternal_nether_lord: "Eternal Nether Lord"
 trait_eternal_nether_lord_desc: "An undying presence of shadow. Stress has little effect, dread is immense, intrigue power is heightened. Hostile plots rarely succeed, and vassals and courtiers hold you in awe."
 trait_the_wake: "Fenstalker"
 trait_the_wake_desc: "The pinnacle of fen raiders. Strong in wetlands and skilled at raiding, yet despised by Norman cultures."
 trait_lifestyle_traveler: "Wanderer"
 trait_lifestyle_traveler_desc: "A tiered trait from the Wandering lifestyle. Gains power from travels, discoveries and journeys across the realm."
 trait_child_of_concubine_female: "Daughter of a Concubine"
 trait_child_of_concubine_female_desc: "Born to a secondary consort. Succession and family laws may treat her differently from legitimate children."
 trait_child_of_concubine_male: "Son of a Concubine"
 trait_child_of_concubine_male_desc: "Born to a secondary consort. Succession and family laws may treat him differently from legitimate children."
 trait_hajjaj: "Hajji"
 trait_shieldmaiden: "Shieldmaiden"
 trait_viking: "Viking Raider"

