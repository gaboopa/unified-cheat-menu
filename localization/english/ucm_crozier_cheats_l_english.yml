l_english:
 UCM_CROZIER_CHEATS_B_auto_ascension_OFF:0 "OFF  ·  Every ruler I play: best genes and +5 skills"
 UCM_CROZIER_CHEATS_B_auto_ascension_ON:0 "ON  ·  Every ruler I play: best genes and +5 skills"
 UCM_CROZIER_CHEATS_B_auto_ascension_TT:0 "The character you play gets Genius, Herculean and Beautiful plus +5 to all six skills. Each character only gets this once, so every heir you continue as receives it too.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 UCM_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "OFF  ·  Stay 30 forever"
 UCM_CROZIER_CHEATS_B_auto_forever_young_ON:0 "ON  ·  Stay 30 forever"
 UCM_CROZIER_CHEATS_B_auto_forever_young_TT:0 "Whenever you are older than 30, your age is set back to 30.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 UCM_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "OFF  ·  Never below 1,000 gold"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "ON  ·  Never below 1,000 gold"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "Whenever you have less than 1,000 gold (including debt), you are topped back up to exactly 1,000.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 UCM_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "OFF  ·  I cannot be imprisoned"
 UCM_CROZIER_CHEATS_B_auto_no_prison_ON:0 "ON  ·  I cannot be imprisoned"
 UCM_CROZIER_CHEATS_B_auto_no_prison_TT:0 "The moment you are imprisoned, you are released.\nAlso checked when you turn it on and at every auto-mode check."
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "OFF  ·  Never below 1,000 prestige and piety"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "ON  ·  Never below 1,000 prestige and piety"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "Whenever your prestige or piety is below 1,000, it is topped back up to exactly 1,000.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 UCM_CROZIER_CHEATS_B_combo_army:0 "Dream army"
 UCM_CROZIER_CHEATS_B_combo_army_TT:0 "In order: every men-at-arms regiment grows (+1 / +2 / +5 per regiment, Amounts setting) and is filled to full strength; levies and garrisons in your provinces are refilled; 5 strong knights join your court (Prowess 40, Martial 18); you, your knights and your army commanders get Logistician, Military Engineer, Organizer and Aggressive Attacker."
 UCM_CROZIER_CHEATS_B_disease_player_OFF:0 "OFF  ·  Disease immunity"
 UCM_CROZIER_CHEATS_B_disease_player_ON:0 "ON  ·  Disease immunity"
 UCM_CROZIER_CHEATS_B_disease_player_TT:0 "Gives you the Disease Protection trait (+50 health, blocks catching ordinary non-epidemic diseases) and cures any disease you have, including plague, smallpox and cancer. Diseases are cured again at every auto-mode check.\nEvents can still give you a disease directly.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_domain_OFF:0 "OFF  ·  Domain limit +50 × strength"
 UCM_CROZIER_CHEATS_B_domain_ON:0 "ON  ·  Domain limit +50 × strength"
 UCM_CROZIER_CHEATS_B_domain_TT:0 "Lets you hold +50 more counties personally without a penalty, per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_enemy_commander:0 "Remove their army commanders"
 UCM_CROZIER_CHEATS_B_enemy_commander_TT:0 "Removes the commander from every army of the target. The AI may appoint new ones."
 UCM_CROZIER_CHEATS_B_enemy_deplete:0 "Destroy 25% / 50% / 90% of their raised troops"
 UCM_CROZIER_CHEATS_B_enemy_deplete_TT:0 "The target's raised armies lose a share of their soldiers permanently.\nAmount depends on the Amounts setting at the top of Cheats: Low 25%, Medium 50%, High 90%."
 UCM_CROZIER_CHEATS_B_enemy_supply:0 "Empty their army supplies"
 UCM_CROZIER_CHEATS_B_enemy_supply_TT:0 "Every raised army of the target loses all its supply."
 UCM_CROZIER_CHEATS_B_forge_crown:0 "Create the Crown of the Sovereign"
 UCM_CROZIER_CHEATS_B_forge_crown_TT:0 "Adds a new legendary crown to your inventory: +10 Diplomacy, +5 prestige per month, +25 vassal opinion and +10 general opinion. It never wears out."
 UCM_CROZIER_CHEATS_B_freq_month:0 "Auto modes: check every month (default)"
 UCM_CROZIER_CHEATS_B_freq_month_TT:0 "Auto modes and toggle upkeep run every 30 days. This is the default. Takes effect after the next check."
 UCM_CROZIER_CHEATS_B_freq_quarter:0 "Auto modes: check every quarter"
 UCM_CROZIER_CHEATS_B_freq_quarter_TT:0 "Auto modes and toggle upkeep run every 90 days. Lighter on game performance. Takes effect after the next check."
 UCM_CROZIER_CHEATS_B_freq_week:0 "Auto modes: check every week"
 UCM_CROZIER_CHEATS_B_freq_week_TT:0 "Auto modes and toggle upkeep run every 7 days. Takes effect after the next check."
 UCM_CROZIER_CHEATS_B_health_OFF:0 "OFF  ·  Health +50 × strength"
 UCM_CROZIER_CHEATS_B_health_ON:0 "ON  ·  Health +50 × strength"
 UCM_CROZIER_CHEATS_B_health_TT:0 "Adds +50 health per strength step. Normal health is single digits, so even ×1 means you will practically never die of poor health.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_immortal_player_OFF:0 "OFF  ·  Immortal: no death from old age"
 UCM_CROZIER_CHEATS_B_immortal_player_ON:0 "ON  ·  Immortal: no death from old age"
 UCM_CROZIER_CHEATS_B_immortal_player_TT:0 "Gives you the game's Immortal trait: you stop aging visually and cannot die of old age. You can still be murdered, executed, killed in battle or by events. It also cures the age ailments Withering Mind, Clouded Eyes, Faltering Heart, Fragile Bones and Infirm, and if you are older than 25 your appearance is frozen at 25 (your listed age still counts up).\nTurning this off removes the trait again, but only if this toggle added it.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_income_OFF:0 "OFF  ·  Income +400% × strength"
 UCM_CROZIER_CHEATS_B_income_ON:0 "ON  ·  Income +400% × strength"
 UCM_CROZIER_CHEATS_B_income_TT:0 "Raises all your monthly income by +400% per strength step (×1 = five times your normal income).\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_influence_OFF:0 "OFF  ·  Influence +5 per month × strength"
 UCM_CROZIER_CHEATS_B_influence_ON:0 "ON  ·  Influence +5 per month × strength"
 UCM_CROZIER_CHEATS_B_influence_TT:0 "You gain +5 influence every month per strength step. Influence is only used by administrative governments.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_innovation_OFF:0 "OFF  ·  Innovation speed +100% × strength"
 UCM_CROZIER_CHEATS_B_innovation_ON:0 "ON  ·  Innovation speed +100% × strength"
 UCM_CROZIER_CHEATS_B_innovation_TT:0 "Your culture discovers innovations +100% faster per strength step. Only works while you are the head of your culture.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_legend_spread_OFF:0 "OFF  ·  Legend spread +100% × strength"
 UCM_CROZIER_CHEATS_B_legend_spread_ON:0 "ON  ·  Legend spread +100% × strength"
 UCM_CROZIER_CHEATS_B_legend_spread_TT:0 "Legends you own spread +100% faster per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_legit_gain_OFF:0 "OFF  ·  Legitimacy +1 per month, gain +100% × strength"
 UCM_CROZIER_CHEATS_B_legit_gain_ON:0 "ON  ·  Legitimacy +1 per month, gain +100% × strength"
 UCM_CROZIER_CHEATS_B_legit_gain_TT:0 "You gain +1 legitimacy every month, and all legitimacy you earn is increased by +100%, per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_levy_OFF:0 "OFF  ·  Levy size +100% × strength"
 UCM_CROZIER_CHEATS_B_levy_ON:0 "ON  ·  Levy size +100% × strength"
 UCM_CROZIER_CHEATS_B_levy_TT:0 "All your holdings provide +100% more levies per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_life_OFF:0 "OFF  ·  Life expectancy +10 years × strength (family)"
 UCM_CROZIER_CHEATS_B_life_ON:0 "ON  ·  Life expectancy +10 years × strength (family)"
 UCM_CROZIER_CHEATS_B_life_TT:0 "You, your spouses and your children get +10 years of life expectancy per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "OFF  ·  Lifestyle experience +100% × strength"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "ON  ·  Lifestyle experience +100% × strength"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "Your lifestyle experience grows +100% faster per strength step, so you unlock perks sooner.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_long_reign_OFF:0 "OFF  ·  Long reign bonus +100% × strength"
 UCM_CROZIER_CHEATS_B_long_reign_ON:0 "ON  ·  Long reign bonus +100% × strength"
 UCM_CROZIER_CHEATS_B_long_reign_TT:0 "The bonus you get for ruling a long time builds up +100% faster per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_merit_gain_OFF:0 "OFF  ·  Merit gain +100% × strength"
 UCM_CROZIER_CHEATS_B_merit_gain_ON:0 "ON  ·  Merit gain +100% × strength"
 UCM_CROZIER_CHEATS_B_merit_gain_TT:0 "You earn merit +100% faster per strength step. Merit is only used by administrative governments.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_monthly_gold_OFF:0 "OFF  ·  Gold +10 per month × strength"
 UCM_CROZIER_CHEATS_B_monthly_gold_ON:0 "ON  ·  Gold +10 per month × strength"
 UCM_CROZIER_CHEATS_B_monthly_gold_TT:0 "Adds a flat +10 gold to your monthly income per strength step (×1 = +10, ×100 = +1,000, ×1000 = +10,000).\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_piety_OFF:0 "OFF  ·  Piety +100 per month × strength"
 UCM_CROZIER_CHEATS_B_piety_ON:0 "ON  ·  Piety +100 per month × strength"
 UCM_CROZIER_CHEATS_B_piety_TT:0 "You gain +100 piety every month per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_prestige_OFF:0 "OFF  ·  Prestige +100 per month × strength"
 UCM_CROZIER_CHEATS_B_prestige_ON:0 "ON  ·  Prestige +100 per month × strength"
 UCM_CROZIER_CHEATS_B_prestige_TT:0 "You gain +100 prestige every month per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_prestige_mult_OFF:0 "OFF  ·  Prestige and piety gain +100% × strength"
 UCM_CROZIER_CHEATS_B_prestige_mult_ON:0 "ON  ·  Prestige and piety gain +100% × strength"
 UCM_CROZIER_CHEATS_B_prestige_mult_TT:0 "All prestige and piety you earn is increased by +100% per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_renown_OFF:0 "OFF  ·  Dynasty renown +5 per month × strength"
 UCM_CROZIER_CHEATS_B_renown_ON:0 "ON  ·  Dynasty renown +5 per month × strength"
 UCM_CROZIER_CHEATS_B_renown_TT:0 "Your dynasty gains +5 renown every month per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_renown_mult_OFF:0 "OFF  ·  Renown gain +100% × strength"
 UCM_CROZIER_CHEATS_B_renown_mult_ON:0 "ON  ·  Renown gain +100% × strength"
 UCM_CROZIER_CHEATS_B_renown_mult_TT:0 "All renown your dynasty earns is increased by +100% per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_skills_OFF:0 "OFF  ·  All six skills +50 × strength"
 UCM_CROZIER_CHEATS_B_skills_ON:0 "ON  ·  All six skills +50 × strength"
 UCM_CROZIER_CHEATS_B_skills_TT:0 "Adds +50 to Diplomacy, Martial, Stewardship, Intrigue, Learning and Prowess per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_skills_mult_OFF:0 "OFF  ·  All six skills +50% × strength"
 UCM_CROZIER_CHEATS_B_skills_mult_ON:0 "ON  ·  All six skills +50% × strength"
 UCM_CROZIER_CHEATS_B_skills_mult_TT:0 "All six of your skills are increased by +50% of their current value per strength step (×2 doubles them).\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_slots_OFF:0 "OFF  ·  Building slots +1 × strength"
 UCM_CROZIER_CHEATS_B_slots_ON:0 "ON  ·  Building slots +1 × strength"
 UCM_CROZIER_CHEATS_B_slots_TT:0 "Every holding you own gets +1 extra building slot per strength step.\nIf Applies to is set to whole realm, all your vassals get the slots too.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_stress_OFF:0 "OFF  ·  Stress gain −99%"
 UCM_CROZIER_CHEATS_B_stress_ON:0 "ON  ·  Stress gain −99%"
 UCM_CROZIER_CHEATS_B_stress_TT:0 "You gain only 1% of the stress you normally would. Strength has no effect on this toggle.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 UCM_CROZIER_CHEATS_B_t_armies_to:0 "Teleport my armies to their capital"
 UCM_CROZIER_CHEATS_B_t_armies_to_TT:0 "Every army of yours that is not in battle instantly moves to the target's capital province. If enemies are there, a battle starts at once."
 UCM_CROZIER_CHEATS_B_t_artifact_claims:0 "Give my house claims on their artifacts"
 UCM_CROZIER_CHEATS_B_t_artifact_claims_TT:0 "Your house gets a claim on every artifact the target owns."
 UCM_CROZIER_CHEATS_B_t_banish:0 "Banish"
 UCM_CROZIER_CHEATS_B_t_banish_TT:0 "Banishes the target from the court they are at."
 UCM_CROZIER_CHEATS_B_t_child_me:0 "Make pregnant with my child"
 UCM_CROZIER_CHEATS_B_t_child_me_TT:0 "Whichever of you is the woman becomes pregnant with your child. Requires opposite sexes and the woman not already pregnant."
 UCM_CROZIER_CHEATS_B_t_child_now:0 "Have a child with them now"
 UCM_CROZIER_CHEATS_B_t_child_now_TT:0 "A newborn child of you and the target appears at your court with Genius, Herculean and Beautiful. Requires opposite sexes."
 UCM_CROZIER_CHEATS_B_t_councillor_chancellor:0 "Appoint as my chancellor"
 UCM_CROZIER_CHEATS_B_t_councillor_chancellor_TT:0 "The target takes your chancellor seat. The previous chancellor stays at your court.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_councillor_court_chaplain:0 "Appoint as my court chaplain"
 UCM_CROZIER_CHEATS_B_t_councillor_court_chaplain_TT:0 "The target takes your court chaplain seat. The previous chaplain stays at your court.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_councillor_marshal:0 "Appoint as my marshal"
 UCM_CROZIER_CHEATS_B_t_councillor_marshal_TT:0 "The target takes your marshal seat. The previous marshal stays at your court.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_councillor_spymaster:0 "Appoint as my spymaster"
 UCM_CROZIER_CHEATS_B_t_councillor_spymaster_TT:0 "The target takes your spymaster seat. The previous spymaster stays at your court.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_councillor_steward:0 "Appoint as my steward"
 UCM_CROZIER_CHEATS_B_t_councillor_steward_TT:0 "The target takes your steward seat. The previous steward stays at your court.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_cp_bodyguard:0 "Appoint as my bodyguard"
 UCM_CROZIER_CHEATS_B_t_cp_bodyguard_TT:0 "The target is appointed to a bodyguard position at your court.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_cp_champion:0 "Appoint as my champion"
 UCM_CROZIER_CHEATS_B_t_cp_champion_TT:0 "The target is appointed to your champion position.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_cp_court_physician:0 "Appoint as my court physician"
 UCM_CROZIER_CHEATS_B_t_cp_court_physician_TT:0 "The target is appointed to your court physician position.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_cp_court_tutor:0 "Appoint as my court tutor"
 UCM_CROZIER_CHEATS_B_t_cp_court_tutor_TT:0 "The target is appointed to your court tutor position.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_cp_master_assassin:0 "Appoint as my master assassin"
 UCM_CROZIER_CHEATS_B_t_cp_master_assassin_TT:0 "The target is appointed to your master assassin position.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_cp_royal_architect:0 "Appoint as my royal architect"
 UCM_CROZIER_CHEATS_B_t_cp_royal_architect_TT:0 "The target is appointed to your royal architect position.\nThe target must be eligible: usually your courtier or vassal."
 UCM_CROZIER_CHEATS_B_t_depose:0 "Depose"
 UCM_CROZIER_CHEATS_B_t_depose_TT:0 "The target loses all their titles, which pass to their heir."
 UCM_CROZIER_CHEATS_B_t_epidemic_bubonic_plague:0 "Start a plague outbreak at their capital"
 UCM_CROZIER_CHEATS_B_t_epidemic_bubonic_plague_TT:0 "Starts a major bubonic plague outbreak in the target's capital province. It can spread like any epidemic, including to you."
 UCM_CROZIER_CHEATS_B_t_epidemic_consumption:0 "Start a consumption outbreak at their capital"
 UCM_CROZIER_CHEATS_B_t_epidemic_consumption_TT:0 "Starts a major consumption outbreak in the target's capital province. It can spread like any epidemic, including to you."
 UCM_CROZIER_CHEATS_B_t_epidemic_dysentery:0 "Start a dysentery outbreak at their capital"
 UCM_CROZIER_CHEATS_B_t_epidemic_dysentery_TT:0 "Starts a major dysentery outbreak in the target's capital province. It can spread like any epidemic, including to you."
 UCM_CROZIER_CHEATS_B_t_epidemic_ergotism:0 "Start an ergotism outbreak at their capital"
 UCM_CROZIER_CHEATS_B_t_epidemic_ergotism_TT:0 "Starts a major ergotism (Saint Anthony's fire) outbreak in the target's capital province. It can spread like any epidemic, including to you."
 UCM_CROZIER_CHEATS_B_t_epidemic_measles:0 "Start a measles outbreak at their capital"
 UCM_CROZIER_CHEATS_B_t_epidemic_measles_TT:0 "Starts a major measles outbreak in the target's capital province. It can spread like any epidemic, including to you."
 UCM_CROZIER_CHEATS_B_t_epidemic_smallpox:0 "Start a smallpox outbreak at their capital"
 UCM_CROZIER_CHEATS_B_t_epidemic_smallpox_TT:0 "Starts a major smallpox outbreak in the target's capital province. It can spread like any epidemic, including to you."
 UCM_CROZIER_CHEATS_B_t_epidemic_typhus:0 "Start a typhus outbreak at their capital"
 UCM_CROZIER_CHEATS_B_t_epidemic_typhus_TT:0 "Starts a major typhus outbreak in the target's capital province. It can spread like any epidemic, including to you."
 UCM_CROZIER_CHEATS_B_t_execute:0 "Execute"
 UCM_CROZIER_CHEATS_B_t_execute_TT:0 "The target dies immediately, executed, with you recorded as the executioner."
 UCM_CROZIER_CHEATS_B_t_family_hostages:0 "Take all their children hostage"
 UCM_CROZIER_CHEATS_B_t_family_hostages_TT:0 "Every living child of the target who is not a ruler and not already a hostage is taken to your court as a hostage."
 UCM_CROZIER_CHEATS_B_t_guest:0 "Invite as a guest"
 UCM_CROZIER_CHEATS_B_t_guest_TT:0 "The target travels to your court as a guest, where you can recruit or marry them off."
 UCM_CROZIER_CHEATS_B_t_hostage:0 "Take as my hostage"
 UCM_CROZIER_CHEATS_B_t_hostage_TT:0 "The target is taken to your court as a hostage. Does not work on rulers or on someone who is already a hostage."
 UCM_CROZIER_CHEATS_B_t_hostage_free:0 "Send hostage home"
 UCM_CROZIER_CHEATS_B_t_hostage_free_TT:0 "If the target is a hostage, they return home."
 UCM_CROZIER_CHEATS_B_t_knight_force:0 "Always a knight"
 UCM_CROZIER_CHEATS_B_t_knight_force_TT:0 "Sets the target's knight status to always, so they always serve as a knight for their liege. Only works if they can be a knight at their current court."
 UCM_CROZIER_CHEATS_B_t_knight_off:0 "Never a knight"
 UCM_CROZIER_CHEATS_B_t_knight_off_TT:0 "Sets the target's knight status to never, so they will not serve as a knight."
 UCM_CROZIER_CHEATS_B_t_pneumonic:0 "Give pneumonia"
 UCM_CROZIER_CHEATS_B_t_pneumonic_TT:0 "Gives the target Pneumonia, a severe and often deadly illness."
 UCM_CROZIER_CHEATS_B_t_rob_artifacts:0 "Take all their artifacts"
