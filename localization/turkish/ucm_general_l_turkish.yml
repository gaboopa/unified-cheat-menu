 ucm_officials.9083.t:0 "Köksüz Halkı Temizle"
 ucm_officials.9083.desc:0 "Karakter havuzundaki kullanılmayan yapay zekâ gezginlerini güvenle kaldırır. Her üç günde yalnızca 25 karakter işlenir; saray mensupları, misafirler, hükümdarlar, maceracılar ve korunan aileniz asla hedef alınmaz. Aynı anda yalnızca bir temizlik çalışabilir."
