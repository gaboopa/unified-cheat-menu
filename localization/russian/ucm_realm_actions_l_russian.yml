l_russian:
 UCM_SEC_TARGET_SUCCESSION: "Законы наследования цели"
 ucm_law_note: "Выбранные законы закрепляются: цель сохраняет их независимо от веры, культуры и нововведений, а наследник получает закрепление."
 ucm_law_include_vassals: "Включая вассалов"
 ucm_law_include_vassals_tt: "Пока включено, выбранный закон применяется и ко всем подходящим вассалам цели."
 ucm_law_pick_tt: "Установить и закрепить этот закон для цели (и вассалов, если включено)."
 ucm_law_unlock: "Снять закрепление законов"
 ucm_law_unlock_tt: "Перестать закреплять законы цели. Игра сможет сменить законы, которые ей обычно недоступны."
 ucm_holding_capital_tt: "Изменить тип владения в столичной баронии цели."
 ucm_holding_realm_tt: "Изменить тип владения в собственных барониях цели и у её вассалов-баронов."
 ucm_realm_max_buildings: "Улучшить здания державы"
 ucm_realm_max_buildings_tt: "Повысить каждое здание в державе цели на один уровень. Нажмите снова для следующего."
 ucm_realm_building_slots: "Добавить места для зданий"
 ucm_realm_building_slots_tt: "Добавить постоянное место для здания каждому владению в державе цели."
 ucm_cure_illness: "Лечить болезни и раны (семья, вассалы)"
 ucm_cure_illness_tt: "Убрать черты болезней и ран у цели, её вассалов, детей, супругов и дома."
 ucm_cure_congenital: "Убрать врождённые изъяны (семья, вассалы)"
 ucm_cure_congenital_tt: "Убрать инбридинг и врождённые изъяны у цели, её вассалов, детей, супругов и дома."
 ucm_dynasty_pope: "Святая династия: понтифики"
 ucm_dynasty_pope_tt: "Дать династии цели постоянный бонус благочестия и мнения единоверцев."
 ucm_dynasty_grandmaster: "Святая династия: великие магистры"
 ucm_dynasty_grandmaster_tt: "Дать династии цели постоянный бонус к удали и святым орденам."
 ucm_oligarchic_elective_succession_law: "Олигархические выборы"
 ucm_oligarchic_elective_succession_law_effects: "[ruler|E] и [powerful_vassals|E] выбирают [title_heir|E] из этих вассалов и [close_family|E] правителя."
 ucm_peasant_elective_succession_law: "Народные выборы"
 ucm_peasant_elective_succession_law_effects: "[ruler|E] и прямые [vassals|E] выше барона выбирают [title_heir|E]. Голоса зависят от [development|E] и [county_opinion|E]."
 ucm_theocratic_elective_succession_law: "Благочестивые выборы"
 ucm_theocratic_elective_succession_law_effects: "Владелец и [de_jure|E] [vassals|E] выбирают [title_heir|E]. Ранг, благочестие и добродетели дают голоса. Наследник становится теократией."
