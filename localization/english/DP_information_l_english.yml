l_english:
  daddy_pika_information:0 "Unified Cheat Menu"
  information_desc:0 "Unified Cheat Menu for CK3 1.20. Right-click any character and choose Open Cheat Menu. Single-player only."
  
  dp_information.changelog.t:0 "Unified Cheat Menu"
  dp_information.changelog.d:0 "Built for CK3 1.20 Crozier: the Rite and tenet system, the new law and election formats, and the By God Alone interaction menu."
  dp_information.useful_tips.t:0 "Useful Tips"
  dp_information.useful_tips.d:0 "Feature Menu\n- Click once to add, click again to remove.\n- If a feature doesn’t appear, it doesn’t mean the mod is broken; it can indicate a hardcoded override from Paradox or that AGOT,etc.overode a base game factor.This is why some decisions don't work.\n- Due to DLC factors, some interactions may not appear on certain characters.\n- Test this mod with only base game/DLC.Then with say a 1066 character like Duchess Matilda to see if this mod is causing your isses. Some older mods that havent been updated can be the real issue."
  dp_information.locations.t:0 "Reporting Problems"
  dp_information.locations.d:0 "When something breaks, note what you clicked, what happened and what you expected, and keep the relevant lines from Documents/Paradox Interactive/Crusader Kings III/logs/error.log."
  
  use_new_system:0 "New System"
