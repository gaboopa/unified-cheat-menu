 ucm_cheat_menu.0075.t: "Редактирование возраста"
 ucm_cheat_menu.0075.desc: "При изменении возраста корректируется здоровье. Накопленное изменение ограничено ±60 годами; чем больше лет добавлено, тем сильнее штраф к здоровью. При уменьшении возраста — обратная компенсация. Черты и болезни суммируются отдельно."
