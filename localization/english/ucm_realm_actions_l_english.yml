l_english:
 UCM_SEC_TARGET_SUCCESSION: "Target's Succession Laws"
 ucm_law_note: "Picked laws are locked: the target keeps them whatever their faith, culture or innovations, and their heir inherits the lock."
 ucm_law_include_vassals: "Include Vassals"
 ucm_law_include_vassals_tt: "While on, a law pick also applies to every eligible vassal of the target."
 ucm_law_pick_tt: "Set and lock this law for the target (and vassals, if included)."
 ucm_law_unlock: "Release Law Locks"
 ucm_law_unlock_tt: "Stop locking the target's laws. The game may then change laws they can't normally keep."
 ucm_holding_capital_tt: "Change the holding type of the target's capital barony."
 ucm_holding_realm_tt: "Change the holding type of every barony in the target's realm."
 ucm_realm_max_buildings: "Upgrade Realm Buildings"
 ucm_realm_max_buildings_tt: "Raise every building in the target's realm by one level. Click again for the next level."
 ucm_realm_building_slots: "Add Realm Building Slots"
 ucm_realm_building_slots_tt: "Add a lasting extra building slot to every holding in the target's realm."
 ucm_cure_illness: "Cure Illness & Injury (Kin, Vassals)"
 ucm_cure_illness_tt: "Remove illness and injury traits from the target, their vassals, children, spouses and house."
 ucm_cure_congenital: "Remove Congenital Flaws (Kin, Vassals)"
 ucm_cure_congenital_tt: "Remove inbreeding and congenital flaws from the target, their vassals, children, spouses and house."
 ucm_dynasty_pope: "Holy Dynasty: Pontiffs"
 ucm_dynasty_pope_tt: "Give the target's dynasty the lasting piety and same-faith opinion bonus."
 ucm_dynasty_grandmaster: "Holy Dynasty: Grandmasters"
 ucm_dynasty_grandmaster_tt: "Give the target's dynasty the lasting prowess and holy order bonus."
 ucm_oligarchic_elective_succession_law: "Oligarchic Elective"
 ucm_oligarchic_elective_succession_law_effects: "The [ruler|E] and the [powerful_vassals|E] choose the [title_heir|E] from among those vassals and the ruler's [close_family|E]."
 ucm_peasant_elective_succession_law: "Populist Elective"
 ucm_peasant_elective_succession_law_effects: "The [ruler|E] and direct [vassals|E] above baron choose the [title_heir|E]. Votes follow each elector's [development|E] and [county_opinion|E]."
 ucm_theocratic_elective_succession_law: "Devout Elective"
 ucm_theocratic_elective_succession_law_effects: "The holder and [de_jure|E] [vassals|E] choose the [title_heir|E]. Rank, devotion and virtues add votes. An heir who inherits becomes a theocracy."
