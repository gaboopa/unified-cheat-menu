l_turkish:
 UCM_SEC_TARGET_SUCCESSION: "Hedefin Veraset Yasaları"
 ucm_law_note: "Seçilen yasalar kilitlenir: hedef, inancı, kültürü veya yeniliklerinden bağımsız olarak onları korur ve varisi kilidi devralır."
 ucm_law_include_vassals: "Vasalları Dahil Et"
 ucm_law_include_vassals_tt: "Açıkken yasa seçimi hedefin uygun tüm vasallarına da uygulanır."
 ucm_law_pick_tt: "Bu yasayı hedef (ve dahil edildiyse vasallar) için belirle ve kilitle."
 ucm_law_unlock: "Yasa Kilitlerini Kaldır"
 ucm_law_unlock_tt: "Hedefin yasalarını kilitlemeyi bırak. Oyun, normalde koruyamayacağı yasaları değiştirebilir."
 ucm_holding_capital_tt: "Hedefin başkent baronluğunun mülk türünü değiştir."
 ucm_holding_realm_tt: "Hedefin diyarındaki tüm baronlukların mülk türünü değiştir."
 ucm_realm_max_buildings: "Diyar Binalarını Yükselt"
 ucm_realm_max_buildings_tt: "Hedefin diyarındaki her binayı bir seviye yükselt. Sonraki seviye için tekrar tıkla."
 ucm_realm_building_slots: "Diyara Bina Yuvası Ekle"
 ucm_realm_building_slots_tt: "Hedefin diyarındaki her mülke kalıcı bir bina yuvası ekle."
 ucm_cure_illness: "Hastalık ve Yara İyileştir (Aile, Vasal)"
 ucm_cure_illness_tt: "Hedef, vasalları, çocukları, eşleri ve hanedan kolundan hastalık ve yara özelliklerini kaldır."
 ucm_cure_congenital: "Doğuştan Kusurları Kaldır (Aile, Vasal)"
 ucm_cure_congenital_tt: "Hedef, vasalları, çocukları, eşleri ve hanedan kolundan akraba evliliği ve doğuştan kusurları kaldır."
 ucm_dynasty_pope: "Kutsal Hanedan: Ruhani Liderler"
 ucm_dynasty_pope_tt: "Hedefin hanedanına kalıcı dindarlık ve aynı inanç görüşü bonusu ver."
 ucm_dynasty_grandmaster: "Kutsal Hanedan: Büyük Üstatlar"
 ucm_dynasty_grandmaster_tt: "Hedefin hanedanına kalıcı dövüş gücü ve kutsal tarikat bonusu ver."
 ucm_oligarchic_elective_succession_law: "Oligarşik Seçim"
 ucm_oligarchic_elective_succession_law_effects: "[ruler|E] ve [powerful_vassals|E], [title_heir|E] kişisini bu vasallar ve hükümdarın [close_family|E] üyeleri arasından seçer."
 ucm_peasant_elective_succession_law: "Halk Seçimi"
 ucm_peasant_elective_succession_law_effects: "[ruler|E] ve baron üstü doğrudan [vassals|E], [title_heir|E] kişisini seçer. Oylar [development|E] ve [county_opinion|E] değerine bağlıdır."
 ucm_theocratic_elective_succession_law: "Dindar Seçim"
 ucm_theocratic_elective_succession_law_effects: "Unvan sahibi ve [de_jure|E] [vassals|E], [title_heir|E] kişisini seçer. Rütbe, dindarlık ve erdemler oy ekler. Varis teokrasiye dönüşür."
