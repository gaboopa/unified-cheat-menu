 trait_build_speed_cheat_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], kaleleri ve katedralleri sanki Villard'ın eliyle yönlendiriliyormuş ve Barbara tarafından kutsanmış gibi inşa eder."
 trait_stress_gain_remove:0 "Kutsanmış ve Kaygısız"
