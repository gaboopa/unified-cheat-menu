 trait_blood_ancester_5:0 "Yaban Domuzu"
 trait_blood_ancester_5_desc:0 "Bu karakter, soyunu Yaban Domuzu ruhuna sahip efsanevi bir şövalyeye dayandırır. Damarlarında akan kan atasal güç taşır: öfke ve yıkım."
