 ucm_cheat_menu.3080.opt_god_mode: "@advantage_icon! Режим бога для армии"
 ucm_cheat_menu.3080.opt_god_mode_tt: "@advantage_icon! Почти нулевые потери, разгром врагов, максимальная скорость марша. Отсутствие штрафов за зиму, рейды, высадку и переправу через реки (отключение по повторному нажатию)."
 ucm_cheat_menu.3080.opt_instant_replenish: "@supply_icon! Бесконечные припасы"
 ucm_cheat_menu.3080.opt_instant_replenish_tt: "@supply_icon! Огромный лимит припасов, минимальные потери. Все армии пополняются каждые 7 дней и ежемесячно во время войны. Содержание и износ близки к нулю (отключение по повторному нажатию)."
 ucm_cheat_menu.3080.opt_levy_multiplier: "@gold_icon! Неограниченное ополчение"
 ucm_cheat_menu.3080.opt_levy_multiplier_tt: "@gold_icon! Размер ополчения увеличен в 100 раз, повышен лимит профессиональных отрядов. Ополчение не требует золота на содержание независимо от численности (отключение по повторному нажатию)."
 ucm_cheat_menu.3080.opt_raise_levies: "@soldier_icon! Призвать всё ополчение"
 ucm_cheat_menu.3080.opt_raise_levies_tt: "@soldier_icon! Мгновенно собрать ополчение максимальной численности в столице или текущей локации."
 ucm_cheat_menu.3080.opt_sand_soldiers: "@soldier_icon! Генератор профессиональных воинов"
 ucm_cheat_menu.3080.opt_sand_soldiers_tt: "@soldier_icon! Открыть окно генератора воинов; для возврата закройте данное окно."
