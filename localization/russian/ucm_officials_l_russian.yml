 ucm_one_click_grant_titles_decision_confirm: "Подтвердить пожалование"
 ucm_one_click_purge_bad_governors_decision: "Увольнять посредственных губернаторов"
 ucm_one_click_purge_bad_governors_decision_desc: "Замена чиновников с низкими гражданскими и военными способностями на всех уровнях."
 ucm_one_click_purge_bad_governors_decision_tooltip: "Избавиться от посредственности"
