 ucm_officials.9083.desc: "Entfernt ungenutzte KI-Wanderer sicher aus dem Charakterpool. Alle drei Tage werden nur 25 Charaktere verarbeitet. Höflinge, Gäste, Herrscher, Abenteurer und Eure geschützte Familie bleiben verschont. Es kann nur eine Säuberung gleichzeitig laufen."
