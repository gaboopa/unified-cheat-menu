l_russian:
 UCM_CROZIER_CHEATS_B_auto_ascension_OFF:0 "выкл  ·  Авто: каждый новый правитель — лучшие гены и +5 к навыкам"
 UCM_CROZIER_CHEATS_B_auto_ascension_ON:0 "ВКЛ  ·  Авто: каждый новый правитель — лучшие гены и +5 к навыкам"
 UCM_CROZIER_CHEATS_B_auto_ascension_TT:0 "Персонаж, за которого ты играешь, получает «Гениальность», «Геракл» и «Прелесть», а также +5 ко всем шести навыкам. Каждый персонаж получает это лишь один раз, так что и каждый наследник, за которого ты продолжишь игру, тоже это получит.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 UCM_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "выкл  ·  Авто: вечная молодость — мне всегда не больше 30"
 UCM_CROZIER_CHEATS_B_auto_forever_young_ON:0 "ВКЛ  ·  Авто: вечная молодость — мне всегда не больше 30"
 UCM_CROZIER_CHEATS_B_auto_forever_young_TT:0 "Всякий раз, когда тебе больше 30 лет, твой возраст снова становится 30.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 UCM_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "выкл  ·  Неисчерпаемая казна: золото не ниже 1000"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "ВКЛ  ·  Неисчерпаемая казна: золото не ниже 1000"
 UCM_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "Всякий раз, когда у тебя меньше 1 000 золота (включая долг), казна пополняется ровно до 1 000.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 UCM_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "выкл  ·  Мгновенно: меня невозможно заключить в темницу"
 UCM_CROZIER_CHEATS_B_auto_no_prison_ON:0 "ВКЛ  ·  Мгновенно: меня невозможно заключить в темницу"
 UCM_CROZIER_CHEATS_B_auto_no_prison_TT:0 "Как только тебя заключают в темницу, ты оказываешься на свободе.\nТакже проверяется при включении и при каждой проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "выкл  ·  Авто: престиж и благочестие не ниже 1000"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "ВКЛ  ·  Авто: престиж и благочестие не ниже 1000"
 UCM_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "Всякий раз, когда твой престиж или благочестие ниже 1 000, они пополняются ровно до 1 000.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 UCM_CROZIER_CHEATS_B_combo_army:0 "Армия мечты: полки больше и полны, ополчение, 5 рыцарей, полководцы-гении"
 UCM_CROZIER_CHEATS_B_combo_army_TT:0 "По порядку: каждый полк профессионалов увеличивается (+1 / +2 / +5 на полк, настройка «Кол-во») и пополняется до полной численности; ополчение и гарнизоны в твоих провинциях восстанавливаются; к твоему двору присоединяются 5 сильных рыцарей (доблесть 40, военное дело 18); ты, твои рыцари и командиры армий получаете черты «Логист», «Военная инженерия», «Организованность» и «Агрессивная атака»."
 UCM_CROZIER_CHEATS_B_disease_player_OFF:0 "выкл  ·  Без болезней: иммунитет и очистка"
 UCM_CROZIER_CHEATS_B_disease_player_ON:0 "ВКЛ  ·  Без болезней: иммунитет и очистка"
 UCM_CROZIER_CHEATS_B_disease_player_TT:0 "Даёт тебе черту «Защита от болезней» (+50 к здоровью, не даёт заразиться обычными болезнями, не являющимися поветриями) и излечивает все твои болезни, включая чуму, оспу и рак. Болезни снова излечиваются при каждой проверке авто-режимов.\nСобытия всё ещё могут напрямую наградить тебя болезнью.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_domain_OFF:0 "выкл  ·  Лимит домена +50"
 UCM_CROZIER_CHEATS_B_domain_ON:0 "ВКЛ  ·  Лимит домена +50"
 UCM_CROZIER_CHEATS_B_domain_TT:0 "Позволяет лично владеть без штрафа на +50 графств больше за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_enemy_commander:0 "Снять командиров с армий цели"
 UCM_CROZIER_CHEATS_B_enemy_commander_TT:0 "Снимает командира с каждой армии цели. ИИ может назначить новых."
 UCM_CROZIER_CHEATS_B_enemy_deplete:0 "Убрать выбранный процент войск цели (25% / 50% / 90%)"
 UCM_CROZIER_CHEATS_B_enemy_deplete_TT:0 "Поднятые армии цели безвозвратно теряют часть солдат.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы»: мало 25%, средне 50%, много 90%."
 UCM_CROZIER_CHEATS_B_enemy_supply:0 "Обнулить снабжение армий цели"
 UCM_CROZIER_CHEATS_B_enemy_supply_TT:0 "Каждая поднятая армия цели теряет все припасы."
 UCM_CROZIER_CHEATS_B_forge_crown:0 "Создать легендарный артефакт: Корона владыки"
 UCM_CROZIER_CHEATS_B_forge_crown_TT:0 "Добавляет в твой инвентарь новую легендарную корону: +10 к дипломатии, +5 престижа в месяц, +25 к мнению вассалов и +10 к общему мнению. Никогда не изнашивается."
 UCM_CROZIER_CHEATS_B_freq_month:0 "Авто-режимы работают раз в месяц"
 UCM_CROZIER_CHEATS_B_freq_month_TT:0 "Авто-режимы и обновление бонусов срабатывают раз в 30 дн. Это настройка по умолчанию. Вступает в силу после следующей проверки."
 UCM_CROZIER_CHEATS_B_freq_quarter:0 "Авто-режимы работают раз в квартал"
 UCM_CROZIER_CHEATS_B_freq_quarter_TT:0 "Авто-режимы и обновление бонусов срабатывают раз в 90 дн. Меньше нагружает игру. Вступает в силу после следующей проверки."
 UCM_CROZIER_CHEATS_B_freq_week:0 "Авто-режимы работают раз в неделю"
 UCM_CROZIER_CHEATS_B_freq_week_TT:0 "Авто-режимы и обновление бонусов срабатывают раз в 7 дн. Вступает в силу после следующей проверки."
 UCM_CROZIER_CHEATS_B_health_OFF:0 "выкл  ·  Здоровье +50"
 UCM_CROZIER_CHEATS_B_health_ON:0 "ВКЛ  ·  Здоровье +50"
 UCM_CROZIER_CHEATS_B_health_TT:0 "Добавляет +50 к здоровью за каждый шаг силы. Обычное здоровье — однозначное число, так что даже при ×1 ты практически никогда не умрёшь от плохого здоровья.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_immortal_player_OFF:0 "выкл  ·  Бессмертие от старости"
 UCM_CROZIER_CHEATS_B_immortal_player_ON:0 "ВКЛ  ·  Бессмертие от старости"
 UCM_CROZIER_CHEATS_B_immortal_player_TT:0 "Даёт тебе штатную черту «Бессмертие»: ты перестаёшь стареть внешне и не можешь умереть от старости. Тебя всё ещё можно убить, казнить, сразить в бою или погубить событием. Также излечивает возрастные недуги «Угасающий разум», «Помутненное зрение», «Слабое сердце», «Хрупкие кости» и «Немощь», а если тебе больше 25 лет, твоя внешность застывает на 25 (указанный возраст продолжает расти).\nПри выключении черта снимается, но только если её добавил этот переключатель.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_income_OFF:0 "выкл  ·  Личные доходы ×5"
 UCM_CROZIER_CHEATS_B_income_ON:0 "ВКЛ  ·  Личные доходы ×5"
 UCM_CROZIER_CHEATS_B_income_TT:0 "Увеличивает весь твой ежемесячный доход на +400% за каждый шаг силы (×1 — в пять раз больше обычного дохода).\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_influence_OFF:0 "выкл  ·  Влияние: +5 в месяц × сила"
 UCM_CROZIER_CHEATS_B_influence_ON:0 "ВКЛ  ·  Влияние: +5 в месяц × сила"
 UCM_CROZIER_CHEATS_B_influence_TT:0 "Ты получаешь +5 влияния каждый месяц за каждый шаг силы. Влияние используется только бюрократическими правительствами.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_innovation_OFF:0 "выкл  ·  Нововведения культуры: скорость +100% × сила"
 UCM_CROZIER_CHEATS_B_innovation_ON:0 "ВКЛ  ·  Нововведения культуры: скорость +100% × сила"
 UCM_CROZIER_CHEATS_B_innovation_TT:0 "Твоя культура открывает инновации на +100% быстрее за каждый шаг силы. Работает, только пока ты — культурный идеолог своей культуры.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_legend_spread_OFF:0 "выкл  ·  Мои легенды распространяются быстрее +100% × сила"
 UCM_CROZIER_CHEATS_B_legend_spread_ON:0 "ВКЛ  ·  Мои легенды распространяются быстрее +100% × сила"
 UCM_CROZIER_CHEATS_B_legend_spread_TT:0 "Твои легенды распространяются на +100% быстрее за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_legit_gain_OFF:0 "выкл  ·  Легитимность: +1 в месяц и прирост +100% × сила"
 UCM_CROZIER_CHEATS_B_legit_gain_ON:0 "ВКЛ  ·  Легитимность: +1 в месяц и прирост +100% × сила"
 UCM_CROZIER_CHEATS_B_legit_gain_TT:0 "Ты получаешь +1 легитимности каждый месяц, а вся получаемая легитимность увеличивается на +100% — за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_levy_OFF:0 "выкл  ·  Размер ополчения: +100% × сила"
 UCM_CROZIER_CHEATS_B_levy_ON:0 "ВКЛ  ·  Размер ополчения: +100% × сила"
 UCM_CROZIER_CHEATS_B_levy_TT:0 "Все твои владения дают на +100% больше ополчения за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_life_OFF:0 "выкл  ·  Семья: продолжительность жизни +10 лет × сила"
 UCM_CROZIER_CHEATS_B_life_ON:0 "ВКЛ  ·  Семья: продолжительность жизни +10 лет × сила"
 UCM_CROZIER_CHEATS_B_life_TT:0 "Ты, твои супруги и дети получаете +10 лет к продолжительности жизни за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "выкл  ·  Опыт образа жизни: +100% × сила"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "ВКЛ  ·  Опыт образа жизни: +100% × сила"
 UCM_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "Опыт образа жизни растёт на +100% быстрее за каждый шаг силы, так что перки открываются раньше.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_long_reign_OFF:0 "выкл  ·  Бонус долгого правления +100% × сила"
 UCM_CROZIER_CHEATS_B_long_reign_ON:0 "ВКЛ  ·  Бонус долгого правления +100% × сила"
 UCM_CROZIER_CHEATS_B_long_reign_TT:0 "Бонус за долгое правление накапливается на +100% быстрее за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_merit_gain_OFF:0 "выкл  ·  Заслуги (администрация): прирост +100% × сила"
 UCM_CROZIER_CHEATS_B_merit_gain_ON:0 "ВКЛ  ·  Заслуги (администрация): прирост +100% × сила"
 UCM_CROZIER_CHEATS_B_merit_gain_TT:0 "Ты получаешь заслуги на +100% быстрее за каждый шаг силы. Заслуги используются только бюрократическими правительствами.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_monthly_gold_OFF:0 "выкл  ·  Ежемесячный доход: +10 золота × сила"
 UCM_CROZIER_CHEATS_B_monthly_gold_ON:0 "ВКЛ  ·  Ежемесячный доход: +10 золота × сила"
 UCM_CROZIER_CHEATS_B_monthly_gold_TT:0 "Добавляет к ежемесячному доходу фиксированные +10 золота за каждый шаг силы (×1 = +10, ×100 = +1 000, ×1000 = +10 000).\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_piety_OFF:0 "выкл  ·  Благочестие: +100 в месяц"
 UCM_CROZIER_CHEATS_B_piety_ON:0 "ВКЛ  ·  Благочестие: +100 в месяц"
 UCM_CROZIER_CHEATS_B_piety_TT:0 "Ты получаешь +100 благочестия каждый месяц за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_prestige_OFF:0 "выкл  ·  Престиж: +100 в месяц"
 UCM_CROZIER_CHEATS_B_prestige_ON:0 "ВКЛ  ·  Престиж: +100 в месяц"
 UCM_CROZIER_CHEATS_B_prestige_TT:0 "Ты получаешь +100 престижа каждый месяц за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_prestige_mult_OFF:0 "выкл  ·  Прирост престижа и благочестия +100% × сила"
 UCM_CROZIER_CHEATS_B_prestige_mult_ON:0 "ВКЛ  ·  Прирост престижа и благочестия +100% × сила"
 UCM_CROZIER_CHEATS_B_prestige_mult_TT:0 "Весь получаемый тобой престиж и благочестие увеличиваются на +100% за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_renown_OFF:0 "выкл  ·  Признание династии: +5 в месяц × сила"
 UCM_CROZIER_CHEATS_B_renown_ON:0 "ВКЛ  ·  Признание династии: +5 в месяц × сила"
 UCM_CROZIER_CHEATS_B_renown_TT:0 "Твоя династия получает +5 признания каждый месяц за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_renown_mult_OFF:0 "выкл  ·  Прирост признания династии +100% × сила"
 UCM_CROZIER_CHEATS_B_renown_mult_ON:0 "ВКЛ  ·  Прирост признания династии +100% × сила"
 UCM_CROZIER_CHEATS_B_renown_mult_TT:0 "Всё признание, получаемое твоей династией, увеличивается на +100% за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_skills_OFF:0 "выкл  ·  Все основные навыки +50"
 UCM_CROZIER_CHEATS_B_skills_ON:0 "ВКЛ  ·  Все основные навыки +50"
 UCM_CROZIER_CHEATS_B_skills_TT:0 "Добавляет +50 к дипломатии, военному делу, управлению, интриге, учёности и доблести за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_skills_mult_OFF:0 "выкл  ·  Все навыки +50% × сила (процентом от текущих)"
 UCM_CROZIER_CHEATS_B_skills_mult_ON:0 "ВКЛ  ·  Все навыки +50% × сила (процентом от текущих)"
 UCM_CROZIER_CHEATS_B_skills_mult_TT:0 "Все шесть твоих навыков увеличиваются на +50% от текущего значения за каждый шаг силы (×2 удваивает их).\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_slots_OFF:0 "выкл  ·  Доп. слоты зданий: +1 × сила (я и вассалы — по охвату)"
 UCM_CROZIER_CHEATS_B_slots_ON:0 "ВКЛ  ·  Доп. слоты зданий: +1 × сила (я и вассалы — по охвату)"
 UCM_CROZIER_CHEATS_B_slots_TT:0 "Каждое твоё владение получает +1 дополнительный слот здания за каждый шаг силы.\nЕсли «Охват» установлен на «вся держава», слоты получают и все твои вассалы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_stress_OFF:0 "выкл  ·  Стресс почти не растёт"
 UCM_CROZIER_CHEATS_B_stress_ON:0 "ВКЛ  ·  Стресс почти не растёт"
 UCM_CROZIER_CHEATS_B_stress_TT:0 "Ты получаешь лишь 1% от обычного стресса. Сила на этот переключатель не влияет.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_t_armies_to:0 "Телепорт: все мои армии — к столице цели"
 UCM_CROZIER_CHEATS_B_t_armies_to_TT:0 "Каждая твоя армия, не участвующая в битве, мгновенно перемещается в провинцию столицы цели. Если там враги, сразу начинается битва."
 UCM_CROZIER_CHEATS_B_t_artifact_claims:0 "Родовые претензии моего дома на все артефакты цели"
 UCM_CROZIER_CHEATS_B_t_artifact_claims_TT:0 "Твой дом получает претензию на каждый артефакт, принадлежащий цели."
 UCM_CROZIER_CHEATS_B_t_banish:0 "Изгнать цель из моего двора"
 UCM_CROZIER_CHEATS_B_t_banish_TT:0 "Изгоняет цель из двора, при котором она находится."
 UCM_CROZIER_CHEATS_B_t_child_me:0 "Ребёнок от меня и цели (беременность)"
 UCM_CROZIER_CHEATS_B_t_child_me_TT:0 "Та из вас, кто женщина, беременеет вашим ребёнком. Нужны разные полы, и женщина не должна быть уже беременна."
 UCM_CROZIER_CHEATS_B_t_child_now:0 "Мгновенно родить ребёнка с целью (гений, геркулес, красавец)"
 UCM_CROZIER_CHEATS_B_t_child_now_TT:0 "Новорождённый ребёнок от тебя и цели появляется при твоём дворе с чертами «Гениальность», «Геракл» и «Прелесть». Нужны разные полы."
 UCM_CROZIER_CHEATS_B_t_councillor_chancellor:0 "Назначить цель канцлером"
 UCM_CROZIER_CHEATS_B_t_councillor_chancellor_TT:0 "Цель занимает место канцлера в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_councillor_court_chaplain:0 "Назначить цель духовником"
 UCM_CROZIER_CHEATS_B_t_councillor_court_chaplain_TT:0 "Цель занимает место духовника в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_councillor_marshal:0 "Назначить цель маршалом"
 UCM_CROZIER_CHEATS_B_t_councillor_marshal_TT:0 "Цель занимает место маршала в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_councillor_spymaster:0 "Назначить цель тайным советником"
 UCM_CROZIER_CHEATS_B_t_councillor_spymaster_TT:0 "Цель занимает место тайного советника в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_councillor_steward:0 "Назначить цель казначеем"
 UCM_CROZIER_CHEATS_B_t_councillor_steward_TT:0 "Цель занимает место казначея в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_cp_bodyguard:0 "Назначить цель телохранителем"
 UCM_CROZIER_CHEATS_B_t_cp_bodyguard_TT:0 "Цель назначается на должность телохранителя при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_cp_champion:0 "Назначить цель поборником (чемпионом)"
 UCM_CROZIER_CHEATS_B_t_cp_champion_TT:0 "Цель назначается на должность поборника при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_cp_court_physician:0 "Назначить цель придворным врачом"
 UCM_CROZIER_CHEATS_B_t_cp_court_physician_TT:0 "Цель назначается на должность придворного врача при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_cp_court_tutor:0 "Назначить цель наставником"
 UCM_CROZIER_CHEATS_B_t_cp_court_tutor_TT:0 "Цель назначается на должность наставника при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_cp_master_assassin:0 "Назначить цель мастером-убийцей"
 UCM_CROZIER_CHEATS_B_t_cp_master_assassin_TT:0 "Цель назначается на должность мастера-убийцы при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_cp_royal_architect:0 "Назначить цель королевским архитектором"
 UCM_CROZIER_CHEATS_B_t_cp_royal_architect_TT:0 "Цель назначается на должность королевского архитектора при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 UCM_CROZIER_CHEATS_B_t_depose:0 "Свергнуть цель (лишить всех титулов в пользу наследника)"
 UCM_CROZIER_CHEATS_B_t_depose_TT:0 "Цель теряет все титулы, которые переходят к её наследнику."
 UCM_CROZIER_CHEATS_B_t_epidemic_bubonic_plague:0 "Наслать чуму на столицу цели"
 UCM_CROZIER_CHEATS_B_t_epidemic_bubonic_plague_TT:0 "Вызывает сильную вспышку болезни «Бубонная чума» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 UCM_CROZIER_CHEATS_B_t_epidemic_consumption:0 "Наслать чахотку на столицу цели"
 UCM_CROZIER_CHEATS_B_t_epidemic_consumption_TT:0 "Вызывает сильную вспышку болезни «Чахотка» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 UCM_CROZIER_CHEATS_B_t_epidemic_dysentery:0 "Наслать дизентерию на столицу цели"
 UCM_CROZIER_CHEATS_B_t_epidemic_dysentery_TT:0 "Вызывает сильную вспышку болезни «Дизентерия» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 UCM_CROZIER_CHEATS_B_t_epidemic_ergotism:0 "Наслать огонь святого Антония на столицу цели"
 UCM_CROZIER_CHEATS_B_t_epidemic_ergotism_TT:0 "Вызывает сильную вспышку огня святого Антония (эрготизма) в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 UCM_CROZIER_CHEATS_B_t_epidemic_measles:0 "Наслать корь на столицу цели"
 UCM_CROZIER_CHEATS_B_t_epidemic_measles_TT:0 "Вызывает сильную вспышку болезни «Корь» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 UCM_CROZIER_CHEATS_B_t_epidemic_smallpox:0 "Наслать оспу на столицу цели"
 UCM_CROZIER_CHEATS_B_t_epidemic_smallpox_TT:0 "Вызывает сильную вспышку болезни «Оспа» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 UCM_CROZIER_CHEATS_B_t_epidemic_typhus:0 "Наслать тиф на столицу цели"
 UCM_CROZIER_CHEATS_B_t_epidemic_typhus_TT:0 "Вызывает сильную вспышку болезни «Тиф» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 UCM_CROZIER_CHEATS_B_t_execute:0 "Казнить цель (я — палач)"
 UCM_CROZIER_CHEATS_B_t_execute_TT:0 "Цель немедленно умирает — казнена, палачом записан ты."
 UCM_CROZIER_CHEATS_B_t_family_hostages:0 "Взять в заложники всех детей цели"
 UCM_CROZIER_CHEATS_B_t_family_hostages_TT:0 "Каждый живой ребёнок цели, который не является правителем и ещё не в заложниках, отправляется к твоему двору заложником."
 UCM_CROZIER_CHEATS_B_t_guest:0 "Пригласить цель гостем ко мне двор"
 UCM_CROZIER_CHEATS_B_t_guest_TT:0 "Цель отправляется гостем к твоему двору, где её можно завербовать или выдать замуж (женить)."
 UCM_CROZIER_CHEATS_B_t_hostage:0 "Взять цель в заложники ко мне"
 UCM_CROZIER_CHEATS_B_t_hostage_TT:0 "Цель отправляется к твоему двору заложником. Не работает на правителей и на тех, кто уже в заложниках."
 UCM_CROZIER_CHEATS_B_t_hostage_free:0 "Отпустить заложника домой"
 UCM_CROZIER_CHEATS_B_t_hostage_free_TT:0 "Если цель — заложник, она возвращается домой."
 UCM_CROZIER_CHEATS_B_t_knight_force:0 "Сделать моим рыцарем (всегда)"
 UCM_CROZIER_CHEATS_B_t_knight_force_TT:0 "Устанавливает рыцарский статус цели на «всегда», так что она всегда служит рыцарем своему сюзерену. Работает, только если цель может быть рыцарем при своём нынешнем дворе."
 UCM_CROZIER_CHEATS_B_t_knight_off:0 "Запретить быть рыцарем"
 UCM_CROZIER_CHEATS_B_t_knight_off_TT:0 "Устанавливает рыцарский статус цели на «никогда», так что она не служит рыцарем."
 UCM_CROZIER_CHEATS_B_t_pneumonic:0 "Наслать тяжёлую болезнь (пневмония)"
 UCM_CROZIER_CHEATS_B_t_pneumonic_TT:0 "Даёт цели «Лёгочную болезнь» — тяжёлое и часто смертельное заболевание."
 UCM_CROZIER_CHEATS_B_t_rob_artifacts:0 "Забрать все артефакты цели себе"
 UCM_CROZIER_CHEATS_B_t_rob_artifacts_TT:0 "Переносит все артефакты цели в твой инвентарь."
 UCM_CROZIER_CHEATS_B_t_schemes_end:0 "Сорвать все интриги цели"
 UCM_CROZIER_CHEATS_B_t_schemes_end_TT:0 "Прекращает все интриги, которые ведёт цель."
 UCM_CROZIER_CHEATS_B_t_schemes_expose:0 "Раскрыть все интриги цели"
 UCM_CROZIER_CHEATS_B_t_schemes_expose_TT:0 "Раскрывает все тайные интриги, которые ведёт цель."
 UCM_CROZIER_CHEATS_B_toasts_toggle:0 "Уведомления «Чит: …» после разовых читов — вкл/выкл"
 UCM_CROZIER_CHEATS_B_toasts_toggle_TT:0 "Включает или выключает маленькие всплывающие уведомления «Чит: …», «Включено: …» и «Выключено: …»."
 UCM_CROZIER_CHEATS_B_travel_arrive:0 "Мгновенно прибыть (завершить путешествие)"
 UCM_CROZIER_CHEATS_B_travel_arrive_TT:0 "Если ты в путешествии, текущее путешествие немедленно завершается в пункте назначения."
 UCM_CROZIER_CHEATS_B_travel_safe_OFF:0 "выкл  ·  Путешествия: безопасность и скорость +100% × сила"
 UCM_CROZIER_CHEATS_B_travel_safe_ON:0 "ВКЛ  ·  Путешествия: безопасность и скорость +100% × сила"
 UCM_CROZIER_CHEATS_B_travel_safe_TT:0 "Твои путешествия на +100% быстрее и на +100% безопаснее за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 UCM_CROZIER_CHEATS_B_vassals_OFF:0 "выкл  ·  Лимит вассалов +100"
 UCM_CROZIER_CHEATS_B_vassals_ON:0 "ВКЛ  ·  Лимит вассалов +100"
 UCM_CROZIER_CHEATS_B_vassals_TT:0 "Увеличивает максимум вассалов на +100 за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
