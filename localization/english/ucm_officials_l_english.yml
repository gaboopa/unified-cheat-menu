 ucm_seduce_shield_for_consorts_decision_title_on: "#bold 【ON】#! Inner-Chamber Vigil"
 ucm_seduce_shield_for_consorts_decision_title_off: "#bold 【OFF】#! Inner-Chamber Vigil"
 ucm_seduce_shield_for_consorts_decision_desc_on: "Vigil is active. Outsiders may not seduce your consorts, and your consorts may not seduce others (including AI), except towards you. Universal Rules: All AI are barred from Seduction, Courtship and Elopement; extramarital lover ties for married AI are cleared daily. Daily Effects: Refreshes Chaste and Loyal traits; ends all incoming and outgoing romance, abduction and elopement schemes involving your household; removes lover bonds to anyone other than yourself. A yearly trait refresh acts as additional backup. Click to disable."
 ucm_seduce_shield_for_consorts_decision_desc_off: "Vigil is inactive. New campaigns enable the vigil by default until manually disabled, after which it remains off. When active, consorts are protected from seduction, global AI romance restrictions apply, hostile schemes are cleared daily and unrelated lover bonds are removed. Chaste and Loyal traits receive daily and yearly refreshes."
