 test.4.desc:0 "Gesamtzahl der Charaktere: [ROOT.Var('local_copy_disease_data_global_character_amount').GetValue]\nVorzeitige Krankheitstode (Alter < 60): [ROOT.Var('local_copy_disease_data_global_premature_death_amount').GetValue]\nWahrscheinlichkeit eines vorzeitigen Krankheitstodes: [ROOT.Var('disease_data_calc_premature_disease_death_percentage').GetValue]%\n\nHÄUFIGE KRANKHEITEN:\nWahrscheinlichkeit häufiger Krankheiten: [ROOT.Var('disease_data_calc_common_disease_percentage').GetValue]%\nErkrankungswahrscheinlichkeit (Krank): [ROOT.Var('disease_data_calc_ill_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Krank): [ROOT.Var('disease_data_calc_ill_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Lungenentzündung): [ROOT.Var('disease_data_calc_pneumonic_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Lungenentzündung): [ROOT.Var('disease_data_calc_pneumonic_premature_death_chance').GetValue]%\n\nSCHWERE KRANKHEITEN:\nWahrscheinlichkeit schwerer Krankheiten: [ROOT.Var('disease_data_calc_serious_disease_percentage').GetValue]%\nErkrankungswahrscheinlichkeit (Gicht): [ROOT.Var('disease_data_calc_gout_ridden_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Gicht): [ROOT.Var('disease_data_calc_gout_ridden_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Lepra): [ROOT.Var('disease_data_calc_leper_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Lepra): [ROOT.Var('disease_data_calc_leper_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Typhus): [ROOT.Var('disease_data_calc_typhus_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Typhus): [ROOT.Var('disease_data_calc_typhus_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Schwindsucht): [ROOT.Var('disease_data_calc_consumption_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Schwindsucht): [ROOT.Var('disease_data_calc_consumption_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Krebs): [ROOT.Var('disease_data_calc_cancer_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Krebs): [ROOT.Var('disease_data_calc_cancer_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Liebespocken): [ROOT.Var('disease_data_calc_lovers_pox_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Liebespocken): [ROOT.Var('disease_data_calc_lovers_pox_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Große Pocken): [ROOT.Var('disease_data_calc_great_pox_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Große Pocken): [ROOT.Var('disease_data_calc_great_pox_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Pocken): [ROOT.Var('disease_data_calc_smallpox_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Pocken): [ROOT.Var('disease_data_calc_smallpox_premature_death_chance').GetValue]%\nErkrankungswahrscheinlichkeit (Beulenpest): [ROOT.Var('disease_data_calc_bubonic_plague_percentage').GetValue]%\nVorzeitige Sterbewahrscheinlichkeit (Beulenpest): [ROOT.Var('disease_data_calc_bubonic_plague_premature_death_chance').GetValue]%\n\nhej[a_value.GetName]hey"
