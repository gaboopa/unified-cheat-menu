 sol_captive_war_cb_prisoners.tt_attacker:1 "Nach eurem Sieg werden viele von [defender.GetShortUINamePossessive] [courtiers|E] zu euren Gefangenen. Ihre Zahl richtet sich nach dem Rang von [defender.GetHerHis]."

