l_english:
 # Base Traits
 trait_sneed_seed:0 "Blood of the Dúnedain"
 trait_sneed_seed_desc:0 "This character possesses the noble blood of the Men of the West, granting them longevity and wisdom beyond their peers."
 
 trait_gigasuperseed:0 "Blood of Númenor"
 trait_gigasuperseed_desc:0 "This character is a scion of the High Númenóreans, carrying the pure lineage of Westernesse from the days of old."
 
 trait_greatest_lord_np:0 "Steward of the Realm"
 trait_greatest_lord_np_desc:0 "This character holds the authority of a High Steward, ruling with the mandate of the Free Peoples."
 
 trait_greatest_lord_t:0 "Lord of the High Houses"
 trait_greatest_lord_t_desc:0 "This character is descended from the Great Houses of the Edain, commandng respect from all Men."
 
 trait_insane_generale:0 "Captain of the West"
 trait_insane_generale_desc:0 "A legendary war-leader whose tactical brilliance is whispered of in both Gondor and the Shadow-lands."

 trait_insane_opinion_fv:0 "Terror of the Nine"
 trait_insane_opinion_fv_desc:0 "This character’s reputation is so formidable it strikes a chill into the hearts of both friend and foe."
 
 trait_insane_opinion_fa:0 "Shadow of the Unseen"
 trait_insane_opinion_fa_desc:0 "A presence that demands total obedience through sheer, overwhelming dread and iron will."

 trait_crazyminded_psycho:0 "Morgoth's Taint"
 trait_crazyminded_psycho_desc:0 "The character's spirit is marred by an ancient darkness, leading to acts of extreme cruelty and madness."
 
 trait_goodguy_toc:0 "Grace of the Valar"
 trait_goodguy_toc_desc:0 "This character possesses a gentle, peaceful disposition, as if blessed by the powers of the West."

 trait_pantokratorus_a:0 "High King"
 trait_pantokratorus_a_desc:0 "This character is marked as a Great Conqueror and High King of the age."
 
 trait_borntorule_seed:0 "True Heir of Isildur"
 trait_borntorule_seed_desc:0 "This character is recognized as the rightful heir to the kingdoms of old."
 
 trait_pantokratorus_ablood:0 "Lineage of Kings"
 trait_pantokratorus_ablood_desc:0 "This character possesses the bloodline of the ancient kings who first defied the Shadow."

 # Custom Bloodlines
 trait_first_bloodline1:0 "Kin of the Free Peoples"
 trait_first_bloodline1_desc:0 "A faint inherited legacy from the common folk of Middle-earth, granting a modest increase to status and legitimacy."
  
 trait_second_bloodline2:0 "Scion of the High Houses"
 trait_second_bloodline2_desc:0 "A recognized bloodline carrying the strength and vitality of the noble houses of Men."
  
 trait_third_bloodline3:0 "Legacy of Arnor"
 trait_third_bloodline3_desc:0 "A respected lineage whose blood carries the meaningful skill and renown of the Northern Kingdom."
  
 trait_fourth_bloodline4:0 "Heir of Westernesse"
 trait_fourth_bloodline4_desc:0 "A powerful inherited legacy of the Sea-kings, admired by kin and vassals alike for its inherent authority."
  
 trait_fifth_bloodline5:0 "Blood of Elendil"
 trait_fifth_bloodline5_desc:0 "An exalted bloodline of the highest order, granting overwhelming bonuses to ability, vitality, and dynastic renown."

 trait_toc_patrilinealblood:0 "Ancestral Line of the Fathers"
 trait_toc_patrilinealblood_desc:0 "A paternal lineage recognized by blood and the authority of the ancient houses."
  
 trait_toc_patrilinealblood2:0 "Sovereign Paternal Legacy"
 trait_toc_patrilinealblood2_desc:0 "A stronger paternal lineage, carrying the prestige and authority of a ruling dynasty."
  
 trait_toc_patrilinealblood3:0 "Eternal House of the West"
 trait_toc_patrilinealblood3_desc:0 "A dominant paternal lineage, granting lasting vitality and the right of legitimate rule through the ages."

 # Special Traits
 trait_toc_gamerblood0:0 "Whispers of Orthanc"
 trait_toc_gamerblood0_desc:0 "This character possesses a bloodline marked by the cunning and manipulation of the great schemers."
 
 trait_toc_gamer0:0 "Master of Deceit"
 trait_toc_gamer0_desc:0 "Grants massive intrigue and scheme success bonuses, rivaling the subtle tongue of Saruman."
 
 trait_toc_immortalblood:0 "Spark of the Ainur"
 trait_toc_immortalblood_desc:0 "This character possesses the bloodline of the Immortals, a bridge between the seen and unseen worlds."
 
 trait_toc_immortal:0 "Undying Spirit"
 trait_toc_immortal_desc:0 "This character is bound to the circles of the world and cannot die of old age or disease."

