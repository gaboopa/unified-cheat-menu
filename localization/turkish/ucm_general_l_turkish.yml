 trait_water_of_life:0 "Sözün Muhafızı"
 trait_water_of_life_desc:0 "Clavius Aquila'nın koruduğu kâseden içen bu kişi, Ebedî Muhafız'ın görevini taşır. Zaman bedenini çürütemez, zihnini köreltemez. Yüzyıllar sürecek hizmet; bilgelik, güç ve sarsılmaz bir ruh vadeder.\n\n#P Yenilenme:#! Yaşlılık rahatsızlıkları, acizlik, yaralar ve hastalıklar; kutsama alındığında, kayıt yüklendiğinde ve aylık bakım sırasında giderilir."
 trait_water_of_life_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], Sözün Muhafızı olarak Clavius Aquila'nın nöbetini devraldı. Yaşlanmayan bir beden, yorulmak bilmeyen bir zihin ve sarsılmaz inanç, Kutsal Kâse'nin emanetçisini ayakta tutar.\n\n#P Yenilenme:#! Yaşlılık rahatsızlıkları, acizlik, yaralar ve hastalıklar kayıt yüklendiğinde ve aylık bakım sırasında giderilir."
  trait_boost_hufu:0 "İmparatorluk Otoritesi Artışı"
  trait_boost_hufu_desc:0 "Kendi hayatı pahasına, imparatorun kararlarını daha akıllı hale getirmek ve devletin işlerinin düzenli, istikrarlı ve müreffeh olmasını sağlamak için cennetin ve dünyanın doğal gücünden yararlanın."
  trait_boost_hufu_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], ulusun refahı ve demokrasisi için kendini feda eden büyük bir imparatordur."
  trait_bloodline_god_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip], Barbara'nın ilahi soyundandır."
