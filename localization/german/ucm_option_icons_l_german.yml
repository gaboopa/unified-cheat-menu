 ucm_cheat_menu.3080.opt_god_mode_tt: "@advantage_icon! Nahezu keine Truppenverluste, Feinde werden leicht besiegt. Maximale Marschgeschwindigkeit (keine Nachteile im Winter, bei Überfällen, Einschiffungen oder Flussüberquerungen. Erneut klicken zum Deaktivieren)."
 ucm_cheat_menu.3080.opt_instant_replenish: "@supply_icon! Unendlicher Nachschub · Keine Verluste"
 ucm_cheat_menu.3080.opt_instant_replenish_tt: "@supply_icon! Die Truppenanzahl bleibt unverändert. Hohes Vorratslimit, minimaler Verbrauch. Im Krieg werden alle Armeen alle 7 Tage und monatlich vollständig aufgefüllt. Nahezu keine Unterhaltskosten und Truppenverluste (erneut klicken zum Deaktivieren)."
 ucm_cheat_menu.3080.opt_levy_multiplier: "@gold_icon! Unbegrenzter Heerbann & keine Kosten"
