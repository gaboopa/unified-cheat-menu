 UCM_CROZIER_CHEATS_B_target_pregnancy_TT:0 "Hedef, hatırlanan ikinci karakterden hamile kalır. Hedefin 18 yaşında veya daha büyük, hamile olmayan bir kadın; ikinci karakterin ise 18 yaşında veya daha büyük, hayatta olan bir erkek olmasını gerektirir.\nÖnce diğer karakteri aç ve İkinci karakter olarak hatırla düğmesine bas, sonra buraya geri dön."
